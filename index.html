<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flamboyan 4 | Portal Informasi Warga Lorong</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    body { user-select: none; }
    html { scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen w-full">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-950 via-indigo-900 to-indigo-950 text-white border-b border-indigo-800/40 sticky top-0 z-40 w-full shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between relative">
      <a href="#" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 transition group shrink-0">
        <i data-lucide="home" class="w-5 h-5 text-indigo-200"></i>
      </a>
      <div class="text-center w-full max-w-xs sm:max-w-xl px-2">
        <h1 class="text-xs sm:text-base md:text-lg font-bold tracking-wide text-white truncate">
          Flamboyan 4 <span class="hidden sm:inline font-normal text-indigo-200/80 text-xs sm:text-sm">| RT 001 RW 026 Pesona Kahuripan 2</span>
        </h1>
      </div>
      <div class="flex items-center space-x-2 shrink-0">
        <a href="rapat.html" class="p-2 rounded-xl bg-amber-500/20 border border-amber-400/40 text-xs font-semibold text-amber-200 flex items-center space-x-1">
          <i data-lucide="file-text" class="w-4 h-4 text-amber-300"></i>
          <span class="hidden sm:inline">Hasil Rapat</span>
        </a>
        <a href="cctv.html" class="p-2 rounded-xl bg-indigo-600 border border-indigo-400/40 text-xs font-semibold text-white flex items-center space-x-1">
          <i data-lucide="video" class="w-4 h-4 text-emerald-300"></i>
          <span class="hidden sm:inline">Live CCTV</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-br from-indigo-950 via-indigo-900 to-violet-900 text-white py-12 px-4 text-center border-b border-indigo-800/40">
    <h2 class="text-3xl sm:text-5xl font-black tracking-tight">
      Transparansi & Kebersamaan <br>
      <span class="bg-gradient-to-r from-amber-200 to-white bg-clip-text text-transparent">Warga Flamboyan 4</span>
    </h2>
  </section>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow space-y-12 w-full">

    <!-- BANNER SLIDER DYNAMIC -->
    <section id="banner-slider-section" class="w-full relative">
      <div id="banner-slider-container" class="relative bg-slate-900 rounded-2xl overflow-hidden shadow-md group border border-slate-200">
        <div id="banner-slides-track" class="flex transition-transform duration-500 ease-out w-full cursor-pointer">
          <div class="w-full shrink-0 h-40 sm:h-56 md:h-72 bg-slate-800 flex items-center justify-center text-slate-400 text-xs sm:text-sm">
            Memuat banner...
          </div>
        </div>

        <button onclick="prevBannerSlide(event)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-sm z-10">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <button onclick="nextBannerSlide(event)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-sm z-10">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>

        <div id="banner-dots-container" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center space-x-2 z-10"></div>
      </div>
    </section>

    <!-- SECTION 1: LAPORAN KEUANGAN -->
    <section id="keuangan" class="scroll-mt-20 w-full">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-2">
          <i data-lucide="wallet" class="w-6 h-6 text-indigo-600"></i>
          <h3 class="text-xl md:text-2xl font-bold text-slate-900">Laporan Keuangan Kas</h3>
        </div>
        <span id="label-update-kas" class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-3 py-1 rounded-full">Update Rincian Kas</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-white p-5 rounded-2xl border border-slate-200">
          <span class="text-xs font-semibold text-slate-500">Pemasukan Bulan Ini</span>
          <p id="pemasukan-bulan-ini" class="text-xl md:text-2xl font-bold text-emerald-600 mt-2">Rp 0</p>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200">
          <span class="text-xs font-semibold text-slate-500">Pengeluaran Bulan Ini</span>
          <p id="pengeluaran-bulan-ini" class="text-xl md:text-2xl font-bold text-rose-600 mt-2">Rp 0</p>
        </div>

        <div class="bg-gradient-to-br from-indigo-900 to-indigo-950 p-6 rounded-2xl text-white">
          <p class="text-xs font-semibold text-indigo-200 uppercase">Sisa Saldo Kas Utama</p>
          <p id="sisa-saldo" class="text-2xl md:text-3xl font-black mt-1">Rp 0</p>
        </div>
      </div>
    </section>

  </
