<!-- SECTION 6: INTERAKSI & OBROLAN WARGA -->
<section id="komentar-warga" class="scroll-mt-20 w-full space-y-4">
  <div class="flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <i data-lucide="messages-square" class="w-6 h-6 text-indigo-600 shrink-0"></i>
      <h3 class="text-xl md:text-2xl font-bold text-slate-900">Obrolan & Sapa Warga</h3>
    </div>
    <span class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-3 py-1 rounded-full">Papan Warga</span>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- FORM KIRIM KOMENTAR -->
    <div class="lg:col-span-5 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
      <h4 class="font-bold text-slate-800 text-sm flex items-center space-x-1.5">
        <i data-lucide="message-square-plus" class="w-4 h-4 text-indigo-600"></i>
        <span>Tulis Pesan / Sapaan</span>
      </h4>
      
      <form id="form-komentar" onsubmit="tambahKomentarWarga(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama & Blok Rumah</label>
          <input type="text" id="komentar-nama" required placeholder="Contoh: Pak Heri (A5/41)" class="w-full text-xs md:text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pesan / Komentar</label>
          <textarea id="komentar-pesan" required rows="3" placeholder="Ketik obrolan, info, atau sapaan warga di sini..." class="w-full text-xs md:text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white resize-none"></textarea>
        </div>

        <!-- EMOTIKON GAMBAR MOVING GIF -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Klik Emoticon:</label>
          <div class="flex flex-wrap gap-2 bg-white p-2.5 rounded-lg border border-slate-200 items-center">
            <button type="button" onclick="insertEmoticon(' :ngakak ')" title="Ngakak" class="p-1.5 bg-slate-50 hover:bg-amber-100 rounded border border-slate-200 transition transform hover:scale-110">
              <img src="https://s.kaskus.id/images/smilies/smilies_15.gif" alt="ngakak" class="w-6 h-6 object-contain">
            </button>
            <button type="button" onclick="insertEmoticon(' :malu ')" title="Malu" class="p-1.5 bg-slate-50 hover:bg-amber-100 rounded border border-slate-200 transition transform hover:scale-110">
              <img src="https://s.kaskus.id/images/smilies/smilies_11.gif" alt="malu" class="w-6 h-6 object-contain">
            </button>
            <button type="button" onclick="insertEmoticon(' :sundul ')" title="Sundul" class="p-1.5 bg-slate-50 hover:bg-amber-100 rounded border border-slate-200 transition transform hover:scale-110">
              <img src="https://s.kaskus.id/images/smilies/smilies_47.gif" alt="sundul" class="w-6 h-6 object-contain">
            </button>
            <button type="button" onclick="insertEmoticon(' :jempol ')" title="Jempol" class="p-1.5 bg-slate-50 hover:bg-amber-100 rounded border border-slate-200 transition transform hover:scale-110">
              <img src="https://s.kaskus.id/images/smilies/smilies_28.gif" alt="jempol" class="w-6 h-6 object-contain">
            </button>
            <button type="button" onclick="insertEmoticon(' :coffee ')" title="Ngopi" class="p-1.5 bg-slate-50 hover:bg-amber-100 rounded border border-slate-200 transition transform hover:scale-110">
              <img src="https://s.kaskus.id/images/smilies/smilies_33.gif" alt="coffee" class="w-6 h-6 object-contain">
            </button>
            <button type="button" onclick="insertEmoticon(' :mikir ')" title="Mikir" class="p-1.5 bg-slate-50 hover:bg-amber-100 rounded border border-slate-200 transition transform hover:scale-110">
              <img src="https://s.kaskus.id/images/smilies/smilies_07.gif" alt="mikir" class="w-6 h-6 object-contain">
            </button>
          </div>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-xs md:text-sm transition flex items-center justify-center space-x-1.5 shadow-sm active:scale-95">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>Kirim Komentar</span>
        </button>
      </form>
    </div>

    <!-- LIST KOMENTAR WARGA -->
    <div class="lg:col-span-7 space-y-2 w-full">
      <div class="flex items-center justify-between mb-2 border-b border-slate-100 pb-2">
        <h4 class="font-bold text-slate-800 text-sm flex items-center space-x-1.5">
          <i data-lucide="message-circle" class="w-4 h-4 text-indigo-600"></i>
          <span>Obrolan Terkini</span>
        </h4>
        <div class="flex items-center space-x-2">
          <span id="total-komentar-badge" class="text-[11px] text-slate-500 font-mono">0 Komentar</span>
          <button onclick="bersihkanSemuaChat()" class="text-[11px] text-rose-600 hover:text-rose-800 font-semibold bg-rose-50 hover:bg-rose-100 border border-rose-200 px-2 py-0.5 rounded transition flex items-center space-x-1" title="Bersihkan Obrolan">
            <i data-lucide="trash-2" class="w-3 h-3"></i>
            <span>Hapus Obrolan</span>
          </button>
        </div>
      </div>

      <div id="container-komentar-list" class="space-y-3 max-h-[360px] overflow-y-auto pr-1.5 custom-scroll">
        <p class="text-slate-400 text-xs italic text-center py-8">Belum ada obrolan. Yuk jadi yang pertama menyapa!</p>
      </div>
    </div>
  </div>
</section>
