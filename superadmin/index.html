<title>Pusat Pengelolaan | Flamboyan 4</title>

<style>
:root{--blue:#2d6593;--navy:#1b344c;--tint:#e8f2fa;--edge:#d9e6f0;--muted:#60788b}
body{--work-bg:#eff5f8;--work-accent:#2d6593;--work-tint:#e8f2fa;--work-line:#d9e6f0;--work-text:#1b344c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#193047;background:#eff5f8}button,input,select,textarea{font:inherit}
button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #76addc;outline-offset:2px}
[hidden]{display:none!important}#guard{padding:28px;max-width:560px;margin:88px auto;background:#fff;border:1px solid var(--edge);border-radius:16px}
#f4-account-page:not([hidden]){display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100dvh;position:relative;inset:auto;background:#eff5f8;color:inherit}
#f4-account-page>aside{position:sticky;top:0;align-self:start;height:100dvh;overflow-y:auto;background:#fff;border-right:1px solid var(--edge);padding:16px 12px;display:flex;flex-direction:column;gap:5px}
#f4-account-page>main{max-width:none;width:100%;padding:84px 26px 40px;overflow:visible;min-width:0}
.f4-sa-brand{display:flex;gap:10px;align-items:center;padding:12px 8px 15px;border-bottom:1px solid var(--edge);margin-bottom:11px}
.f4-sa-logo{height:42px;width:42px;object-fit:contain}.f4-sa-brand strong{display:block;font-size:14px;color:var(--navy)}.f4-sa-brand small{display:block;font-size:10px;color:var(--muted)}
.f4-sa-label{font-size:10px!important;color:#8196a8!important;text-transform:uppercase;letter-spacing:.09em;padding:11px 10px 5px!important}
#f4-account-page>aside button{width:100%;min-height:42px;text-align:left;border:0;border-radius:10px;background:transparent;padding:10px 11px;color:#28516d;font-size:12px;font-weight:700}
#f4-account-page>aside button.active,#f4-account-page>aside button:hover{background:var(--tint);color:#125080}
#f4-account-page>aside .f4-sa-subtitle{margin-top:13px;border-top:1px solid var(--edge)}
#f4-account-page>main h2{font-size:25px;margin:0 0 5px;font-weight:850;color:var(--navy)}
#f4-account-page>main p{margin:5px 0 16px;color:var(--muted)}
.f4-work-heading{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
.f4-work-heading h2{font-size:24px!important}
.f4-work-section,.f4-admin-controls,.sa-card{background:white;border:1px solid var(--edge);border-radius:14px;padding:17px}
.sa-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.sa-card small{display:block;color:var(--muted);font-size:11px}.sa-card strong{display:block;font-size:22px;color:var(--navy);margin-top:6px}.sa-card span{display:block;color:var(--muted);font-size:11px}
.sa-section{border:1px solid var(--edge);border-radius:14px;background:#fff;padding:17px;margin:12px 0}
.sa-section h3{margin:0 0 9px;font-size:16px;color:var(--navy)}
.sa-list{display:grid;gap:9px}.sa-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--edge);border-radius:11px;background:#fff}
.sa-item strong{display:block;font-size:13px}.sa-item small{display:block;color:var(--muted);font-size:11px}.sa-chip{background:#e9f2fb;border-radius:20px;color:#286d9e;padding:5px 9px;font-size:10px;font-weight:800}
.sa-controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:12px 0}
.sa-controls input,.sa-controls select{padding:10px 12px;border:1px solid #cbdde7;border-radius:9px;min-width:190px;flex:1}
.sa-action,.f4-admin-btn,.f4-admin-primary,.f4-work-button{border:1px solid #bdd5e7;border-radius:10px;background:#eaf3fa;color:#18567f;padding:10px 12px;font-size:12px;font-weight:800}
.f4-admin-primary{background:#286c9e;color:#fff;border-color:#286c9e}
.f4-admin-list{display:grid;gap:9px}.f4-admin-item{background:white;border:1px solid var(--edge);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.f4-admin-item strong,.f4-admin-item small{display:block}.f4-admin-item small{color:var(--muted);font-size:11px}
.f4-admin-controls{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.f4-admin-controls input{min-width:180px;flex:1;padding:10px;border-radius:9px;border:1px solid var(--edge)}
.f4-admin-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.f4-admin-fields label{display:flex;flex-direction:column;gap:5px;font-weight:650;font-size:12px}
.f4-admin-fields input,.f4-admin-fields textarea,.f4-admin-fields select{width:100%;border:1px solid var(--edge);border-radius:9px;padding:11px;background:#fff}
.f4-admin-editor{border:1px solid var(--edge);background:#fff;padding:20px;border-radius:14px}
.f4-admin-editor .f4-content-destination{display:flex;flex-direction:column;gap:6px;max-width:320px;margin:0 0 14px;font-size:12px;font-weight:700;color:var(--navy)}
.f4-admin-editor .f4-content-destination select{width:100%;min-height:41px;padding:9px 11px;border:1px solid var(--edge);border-radius:9px;background:#fff;color:var(--navy);font:500 13px system-ui}
.f4-admin-editor .f4-content-destination select:focus-visible{outline:2px solid #327cae;outline-offset:1px}
@media(max-width:700px){.f4-admin-editor .f4-content-destination{max-width:100%}}
.f4-warga-form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.f4-admin-note,.f4-admin-message{color:#5c7584;font-size:12px}
.sa-warn{padding:12px;border-radius:10px;background:#fff7ec;color:#83562d!important;border:1px solid #f1dbb9}
.sa-toast{position:fixed;bottom:18px;right:18px;border-radius:12px;padding:12px;background:#173d60;color:#fff;z-index:10;box-shadow:0 7px 22px #112c4422;max-width:320px}
.sa-back{display:none}
@media(max-width:760px){
 #f4-account-page:not([hidden]){grid-template-columns:minmax(0,1fr);display:block}
 #f4-account-page>aside{position:sticky;top:0;z-index:7;height:auto;max-height:190px;overflow-y:auto;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;padding:8px;gap:6px;box-shadow:0 2px 8px #112c4415}
 #f4-account-page>aside .f4-sa-brand{min-width:122px;flex:none;margin:0;padding:5px 8px;border:0}
 #f4-account-page>aside .f4-sa-brand img{width:30px;height:30px}
 #f4-account-page>aside .f4-sa-brand small,.f4-sa-label{display:none!important}
 #f4-account-page>aside button{min-width:125px;width:auto;flex:none;padding:8px;min-height:37px;text-align:center}
 #f4-account-page>aside .f4-sa-subtitle{border:0;margin:0}
 #f4-account-page>main{padding:72px 12px 28px}
 .sa-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .f4-admin-fields{grid-template-columns:1fr}
}

/* Override legacy account-workspace !important rules so this is a real portal,
   not the old fixed management popup hidden beneath the global utility bar. */
html body #f4-account-page:not([hidden]){
 position:relative!important;inset:auto!important;z-index:auto!important;
 display:grid!important;grid-template-columns:244px minmax(0,1fr)!important;
 min-height:100dvh!important;background:#eff5f8!important;color:#193047!important
}
html body #f4-account-page>aside{
 position:sticky!important;top:0!important;align-self:start!important;
 height:100dvh!important;max-height:100dvh!important;overflow-y:auto!important;
 display:flex!important;flex-direction:column!important;padding:16px 12px!important;
 background:#fff!important;border-right:1px solid #d9e6f0!important
}
html body #f4-account-page>main{
 padding:66px 22px 30px!important;overflow-y:auto!important;overflow-x:hidden!important;
 width:100%!important;min-width:0!important
}
html body #f4-account-page .f4-work-heading{display:block!important}
html body #f4-account-page .f4-work-heading h2{margin-bottom:5px!important;color:#1b344c!important}
html body #f4-account-page aside .f4-sa-label{font-size:10px!important;padding:11px 10px 5px!important;color:#8196a8!important}
html body #f4-account-page aside .f4-sa-brand strong{padding:0!important}
@media(max-width:1023px){
 html,body{max-width:100vw!important;overflow-x:hidden!important}
 html body #f4-account-page:not([hidden]){
  display:block!important;grid-template-columns:1fr!important;max-width:100vw!important;overflow-x:clip!important
 }
 html body #f4-account-page>aside{
  position:fixed!important;top:0!important;left:0!important;bottom:0!important;
  margin:0!important;width:min(288px,84vw)!important;height:100dvh!important;max-height:none!important;
  z-index:102!important;transform:translate3d(-110%,0,0)!important;visibility:hidden!important;
  transition:transform .22s ease,visibility .22s ease!important;
  overflow-x:hidden!important;overflow-y:auto!important;
  display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;
  align-items:stretch!important;padding:16px 12px!important;
  box-shadow:12px 0 28px #16304a24!important
 }
 html body #f4-account-page.f4-sa-drawer-open>aside{
  transform:translate3d(0,0,0)!important;visibility:visible!important
 }
 html body #f4-account-page>aside .f4-sa-brand{
  min-width:0!important;display:flex!important;flex-direction:row!important;
  margin-bottom:11px!important;border-bottom:1px solid var(--edge)!important;padding:12px 8px 15px!important
 }
 html body #f4-account-page>aside .f4-sa-brand small,
 html body #f4-account-page>aside .f4-sa-label{display:block!important}
 html body #f4-account-page>aside button{
  width:100%!important;min-width:0!important;flex:none!important;text-align:left!important;
  min-height:42px!important;padding:10px 11px!important
 }
 html body #f4-account-page>main{
  padding:66px 12px 24px!important;overflow-y:auto!important;overflow-x:hidden!important;
  width:100%!important;min-width:0!important
 }
 #f4-account-page .f4-sa-mobile-backdrop{
  display:none;position:fixed;inset:0;background:#10243890;z-index:101
 }
 #f4-account-page.f4-sa-drawer-open .f4-sa-mobile-backdrop{display:block}
 #f4-account-page .sa-tabbar{max-width:100%!important;overflow-x:auto!important}
 #f4-account-page .f4-obligation-scroll{max-width:100%;overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){
 html body #f4-account-page>aside{transition:none!important}
}
/* Five root menus stay left; only the selected group's submenus become tabs. */
html body #f4-account-page>aside{overflow-x:hidden!important}
#f4-account-page .sa-tabbar{
 position:sticky;top:56px;z-index:3;display:flex;align-items:center;gap:7px;
 padding:10px 1px 12px;margin:-4px 0 16px;background:#eff5f8;
 overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;
 scroll-behavior:auto;overscroll-behavior-x:contain;
 border-bottom:1px solid var(--edge);
}
#f4-account-page .sa-tabbar button{
 flex:none;min-height:39px;padding:9px 15px;border:1px solid #d4e3ed;
 border-radius:10px;background:white;color:#28516d;font-size:12px;font-weight:750;
 transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease;
}
#f4-account-page .sa-tabbar button:hover{background:#e6f1f9;border-color:#abcce4}
#f4-account-page .sa-tabbar button[aria-selected="true"]{
 background:#2d6593;color:#fff;border-color:#2d6593;box-shadow:0 2px 6px #27496419
}
#f4-account-page .sa-tabbar button:focus-visible{outline:2px solid #256fac;outline-offset:2px}
#f4-account-page .sa-module-heading{margin:3px 0 14px;padding:1px 2px}
#f4-account-page .sa-module-heading h3{font-size:18px;font-weight:800;margin:0 0 4px;color:#1b344c}
#f4-account-page .sa-module-heading p{font-size:12px;color:#60788b;margin:0}

@keyframes f4SaContentIn{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
#f4-account-page>main>.f4-work-heading,
#f4-account-page>main>.sa-section,
#f4-account-page>main>.sa-grid,
#f4-account-page>main>.sa-controls,
#f4-account-page>main>.f4-admin-controls,
#f4-account-page>main>.f4-admin-list,
#f4-account-page>main>.f4-admin-editor,
#f4-account-page>main>.f4-work-section{
 animation:f4SaContentIn .18s ease-out both
}
@media(max-width:760px){
 #f4-account-page .sa-tabbar{position:sticky;top:0;margin:0 0 14px;padding:8px 0 10px}
 #f4-account-page .sa-tabbar button{min-height:38px;padding:8px 12px}
}
@media(prefers-reduced-motion:reduce){
 #f4-account-page .sa-tabbar{scroll-behavior:auto}
 #f4-account-page .sa-tabbar button{transition:none}
 #f4-account-page>main>*{animation:none!important}
}

/* Table identity and status layout adapted from original Bank Sampah. */
.sa-accounts-shell{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:20px;margin:4px 0 24px}
.sa-account-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.sa-account-head h3{font-size:18px;color:#1b344c;margin:0 0 3px}
#f4-account-page>main .sa-account-head p{margin:0;color:#688397;font-size:12px}
.sa-account-actions{display:flex;gap:8px;flex-wrap:wrap}
.sa-action-primary{background:#2e6146!important;color:white!important;border-color:#2e6146!important}
.sa-account-note{background:#eaf2e9;color:#355f4a!important;border-radius:11px;padding:13px!important;margin:0 0 14px!important;line-height:1.55;font-size:12px!important}
.sa-account-table{background:#f5f9f5;border:1px solid #d7e5d8;border-radius:13px;overflow:hidden}
.sa-account-filters{padding:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sa-account-filters input{flex:1 1 270px;max-width:500px;background:white;border:1px solid #c9d9cd;border-radius:10px;padding:12px;font-size:12px}
.sa-account-filters select{max-width:180px;min-width:135px;padding:12px;background:white;border:1px solid #c9d9cd;border-radius:10px;font-size:12px}
#f4-account-page>main .sa-account-count{font-size:11px!important;flex-basis:100%;margin:0!important;color:#5e806d!important}
.sa-account-scroll{overflow-x:auto;max-height:60vh;overflow-y:auto;background:white}
.sa-account-grid{border-collapse:collapse;width:100%;min-width:690px;font-size:12px}
.sa-account-grid th{text-align:left;color:#678a73;text-transform:uppercase;font-size:10px;letter-spacing:.02em;background:#f9fcf9;padding:12px 14px;border-top:1px solid #dce8df;border-bottom:1px solid #dce8df;position:sticky;top:0}
.sa-account-grid th:last-child,.sa-account-grid td:last-child{text-align:right}
.sa-account-grid td{padding:12px 14px;border-bottom:1px solid #e4ebe4;color:#2d4638;vertical-align:middle}
.sa-account-grid tr:nth-child(even){background:#fcfdfc}
.sa-account-grid td strong{display:block;font-size:12px;color:#16442a}
.sa-account-grid td small{display:block;font-size:10px;color:#849c8b;margin-top:2px}
.sa-account-role{display:inline-block;background:#e8f1fa;color:#286498;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:750}
.sa-account-role[data-role="admin"]{background:#e7eff9;color:#3558a7}
.sa-account-role[data-role="superadmin"]{background:#efe9fd;color:#6d43aa}
.sa-account-status{color:#286849!important;font-weight:750}
.sa-account-status span[data-status="Nonaktif"]{color:#ad5454}
.sa-account-status span[data-status="Belum aktif"]{color:#a37626}
.sa-account-reset{border:0;background:#eaf2e9;color:#2d6143;border-radius:10px;padding:8px 11px;font-weight:700;font-size:11px}
.sa-account-reset:disabled,.sa-action-primary:disabled{opacity:.65;cursor:not-allowed}
@media(max-width:760px){.sa-accounts-shell{padding:12px}.sa-account-head{align-items:flex-start}.sa-account-scroll{max-height:none}.sa-account-filters{padding:10px}.sa-account-filters input{max-width:none}}

/* Superadmin uses its blue/purple theme; only the table grid is scrollable. */
.sa-accounts-shell{border-color:#d8e2f5!important}
.sa-account-note{background:#f0f3ff!important;color:#425480!important}
.sa-account-table{background:#f7f8ff!important;border-color:#dce3f3!important}
.sa-account-filters input,.sa-account-filters select{border-color:#d5ddf1!important}
.sa-account-count{color:#6c77a0!important}
.sa-account-scroll{position:relative!important;max-height:none!important;overflow-y:visible!important;overflow-x:auto!important}
.sa-account-grid{border-collapse:separate!important;border-spacing:0!important}
.sa-account-grid thead,.sa-account-grid tbody,.sa-account-grid tr,.sa-account-grid td{position:static!important}
.sa-account-grid th{position:static!important;background:#f8f9ff!important;color:#6c75a1!important;border-color:#e2e7f6!important}
.sa-account-grid td{border-color:#e7eafa!important;color:#344361!important}
.sa-account-grid td strong{color:#243867!important}
.sa-account-grid tr:nth-child(even){background:#fbfcff!important}
.sa-account-status{color:#295b69!important}
.sa-account-role{background:#eaefff!important;color:#485fa1!important}
.sa-account-reset{position:static!important;transform:none!important;inset:auto!important;background:#eef0ff!important;color:#555d99!important}
.sa-account-reset:disabled{opacity:.66}
.sa-action-primary{background:#5364a5!important;border-color:#5364a5!important}

/* Master warga: tabel horizontal ringkas; tetap bisa digeser di HP. */
.sa-resident-scroll{width:100%;max-width:100%;overflow-x:auto;border:1px solid #d8e4f2;border-radius:13px;background:white}
.sa-resident-grid{border-collapse:collapse;width:100%;min-width:850px;font-size:12px}
.sa-resident-grid th{background:#edf4fd;color:#315b83;font-weight:750;text-align:left;padding:11px 12px;white-space:nowrap;border-bottom:1px solid #d8e4f2}
.sa-resident-grid td{padding:10px 12px;border-bottom:1px solid #edf1f7;color:#243c55;vertical-align:middle}
.sa-resident-grid tr:nth-child(even){background:#f9fbfe}
.sa-resident-grid td:last-child{text-align:right;width:88px}
.sa-resident-grid td .sa-action{padding:7px 12px}

.f4-obligation-scroll{width:100%;overflow-x:auto;border:1px solid #d8e4f2;border-radius:13px;background:#fff}
.f4-obligation-grid{border-collapse:collapse;min-width:780px;width:100%;font-size:12px}
.f4-obligation-grid th{padding:11px 12px;text-align:left;background:#edf4fd;color:#315b83;border-bottom:1px solid #d8e4f2;white-space:nowrap}
.f4-obligation-grid td{padding:10px 12px;border-bottom:1px solid #edf1f7;color:#243c55}
.f4-obligation-grid tr:nth-child(even){background:#f9fbfe}
.f4-obligation-grid td:nth-child(n+3):nth-child(-n+6){text-align:center;font-weight:700}
.f4-obligation-grid td:last-child{text-align:right}

/* Compact editable lists; preserve vertical root sidebar + horizontal subtabs. */
.f4-obligation-scroll{overflow-x:auto;max-width:100%;border-radius:12px}
.f4-obligation-grid{min-width:800px;width:100%;border-collapse:collapse;table-layout:auto}
.f4-obligation-grid th{white-space:nowrap;text-align:left}
.f4-obligation-grid td{min-width:85px;max-width:290px;vertical-align:middle}
.f4-obligation-grid td:first-child{font-weight:730}
.f4-obligation-grid td:last-child{width:85px;min-width:85px;text-align:right}
.f4-obligation-grid[data-module="obligations"] td:nth-child(n+3):nth-child(-n+6){text-align:center}
.f4-obligation-grid:not([data-module="obligations"]) td:nth-child(n+3):nth-child(-n+6){text-align:left;font-weight:normal}
.f4-admin-truncate{display:block;max-width:235px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f4-admin-source-link{color:#2967a0;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.f4-admin-muted{color:#8e9ab0}
@media(max-width:760px){.f4-obligation-grid{min-width:760px}}

.f4-admin-action-set{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;white-space:nowrap}
.f4-admin-danger{background:#fff2f1!important;color:#a53c39!important;border-color:#efc5c1!important}
.f4-admin-danger:hover,.f4-admin-danger:focus-visible{background:#fbe4e2!important;color:#882820!important}
.f4-admin-danger:disabled{opacity:.55;cursor:wait}
.f4-obligation-grid:not([data-module="obligations"]) td:last-child{min-width:150px;width:150px}
@media(max-width:720px){.f4-admin-action-set{gap:5px}.f4-admin-action-set button{padding:8px 10px}}

/* Website-owned confirmation modal; works even when browser JS dialogs are blocked. */
#f4-superadmin-confirm{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;
 background:rgba(18,29,45,.68);padding:18px;font-family:system-ui,-apple-system,sans-serif}
#f4-superadmin-confirm .f4-sa-confirm-panel{width:min(100%,440px);background:#fff;color:#263d51;

<script>
(()=>{
'use strict';
const API='https://api.flamboyan4.web.id',root=document.getElementById('f4-account-page'),side=root.querySelector('aside'),main=root.querySelector('main'),guard=document.getElementById('guard');
const saBackdrop=document.createElement('div');
saBackdrop.className='f4-sa-mobile-backdrop';saBackdrop.setAttribute('aria-hidden','true');root.append(saBackdrop);
const saEmbedded=window.parent!==window;
const standaloneButton=document.createElement('button');
standaloneButton.type='button';standaloneButton.className='f4-sa-standalone-menu';
standaloneButton.setAttribute('aria-label','Buka menu Superadmin');standaloneButton.textContent='☰';
if(!saEmbedded){document.body.append(standaloneButton);standaloneButton.onclick=()=>window.f4ToggleSuperadminMenu();}
function saMenuOpened(){return root.classList.contains('f4-sa-drawer-open')}

 if(saEmbedded)window.parent.postMessage({type:'f4:sidebar-state',portal:'superadmin',open},location.origin);

function saCloseDrawer(fromHistory=false){

window.f4ToggleSuperadminMenu=()=>{

const groups=[['overview','Ringkasan Sistem'],['accounts','Akun & Hak Akses'],['content','Portal Utama'],['bank','Bank Sampah'],['masters','Data Acuan'],['audit','Pengaturan & Audit']];
const submenu={
 content:[['projects','Project Card'],['agenda','Rencana Kegiatan'],['documentation','Dokumentasi'],['inventory','Inventaris'],['banners','Banner Slider'],['meetings','Hasil Rapat'],['arisan','Jadwal Arisan'],['jersey','Pesanan Jersey']],
 bank:[['bank_progress','Kegiatan'],['bank_albums','Dokumentasi'],['bank_inventory','Inventaris'],['bankcatalog','Jenis & Harga']],

let role='public',group='overview',active='',accounts=[],accountSearch='',residentRows=[];
const el=(tag,text,cls)=>{const v=document.createElement(tag);if(text!==undefined)v.textContent=String(text);if(cls)v.className=cls;return v};
const button=(label,on,cls)=>{const b=el('button',label,cls);b.type='button';b.onclick=on;return b};
const title=(name,desc)=>{
 rememberTabScroll();
 main.replaceChildren();
 const category=group==='content'?'Portal Utama':group==='bank'?'Bank Sampah':group==='masters'?'Data Acuan':'';
 const categoryDesc=group==='content'?'Konten dan publikasi lingkungan Flamboyan 4.':group==='bank'?'Kegiatan, dokumentasi, inventaris, dan harga sampah.':'Data warga dan aturan iuran bersama.';
 const h=el('header',undefined,'f4-work-heading');
 h.append(el('h2',category&&active?category:name),el('p',category&&active?categoryDesc:desc));
 main.append(h);

const section=(label)=>{const s=el('section',undefined,'sa-section');s.append(el('h3',label));main.append(s);return s};
const value=(o,keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return String(o[k]);return ''};
const rows=(o)=>Array.isArray(o)?o:Array.isArray(o?.rows)?o.rows:Array.isArray(o?.data)?o.data:Array.isArray(o?.accounts)?o.accounts:Array.isArray(o?.akun)?o.akun:[];
const notice=(text)=>{const n=el('p',text,'f4-admin-note');main.append(n);return n};
const safe=(error)=>String(error&&error.message||error);
async function get(path){const res=await fetch(API+path,{credentials:'include',cache:'no-store'});const d=await res.json().catch(()=>({}));if(!res.ok||d.ok===false)throw Error(d.error||('HTTP '+res.status));return d}
function sidebar(g=group){
 group=g;side.replaceChildren();
 const brand=el('div',undefined,'f4-sa-brand');const img=el('img');img.src='/assets/logo-flamboyan.svg?v=official-20261027-v2';img.alt='Logo Flamboyan 4';img.className='f4-sa-logo';
 const text=el('span');text.append(el('strong','Flamboyan 4'),el('small','Portal Superadmin'));brand.append(img,text);side.append(brand);
 side.append(el('strong','MENU SUPERADMIN','f4-sa-label'));
 for(const [key,label] of groups){
  const b=button('',()=>open(key),g===key?'active':'');
  const icon=el('img',undefined,'sa-nav-icon');
  icon.src='/assets/icons/'+({overview:'superadmin',accounts:'user',content:'home',bank:'bank',masters:'inventory',audit:'book'}[key])+'.svg';
  icon.alt='';icon.setAttribute('aria-hidden','true');b.append(icon,el('span',label));
  b.setAttribute('aria-current',g===key?'page':'false');side.append(b);
 }
 document.body.dataset.saArea=g;
 window.f4SuperadminArea=g;

}
const tabScrollPositions={content:0,bank:0,masters:0};
function rememberTabScroll(){
 const existing=main.querySelector('.sa-tabbar');
 const previousGroup=existing?.dataset.group;
 if(previousGroup&&Object.hasOwn(tabScrollPositions,previousGroup))
  tabScrollPositions[previousGroup]=existing.scrollLeft;
}
window.f4SuperadminRememberTabScroll=rememberTabScroll;
function renderTabs(){
 const current=submenu[group];
 if(!current||!active||!current.some(([key])=>key===active))return;
 main.querySelector('.sa-tabbar')?.remove();
 const tabs=el('nav',undefined,'sa-tabbar');
 tabs.dataset.group=group;
 tabs.setAttribute('role','tablist');
 tabs.setAttribute('aria-label',group==='content'?'Menu Portal Utama':group==='bank'?'Menu Bank Sampah':'Menu Data Acuan');
 for(const [key,label] of current){
  const tab=button(label,()=>openEditor(key));
  tab.setAttribute('role','tab');
  tab.setAttribute('aria-selected',String(active===key));
  tab.tabIndex=active===key?0:-1;
  tab.addEventListener('keydown',event=>{
   if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
   event.preventDefault();
   const options=[...tabs.querySelectorAll('[role="tab"]')];
   const index=options.indexOf(tab);
   const next=event.key==='Home'?0:event.key==='End'?options.length-1:
     (index+(event.key==='ArrowRight'?1:-1)+options.length)%options.length;
   options[next]?.click();
   main.querySelectorAll('.sa-tabbar [role="tab"]')[next]?.focus({preventScroll:true});
  });
  tabs.append(tab);
 }
 main.querySelector('.f4-work-heading')?.after(tabs);
 tabs.scrollLeft=tabScrollPositions[group]||0;
 const currentTab=tabs.querySelector('[aria-selected="true"]');
 if(currentTab){
  const currentRect=currentTab.getBoundingClientRect(),railRect=tabs.getBoundingClientRect();
  if(currentRect.right>railRect.right)tabs.scrollLeft+=currentRect.right-railRect.right+8;
  if(currentRect.left<railRect.left)tabs.scrollLeft-=railRect.left-currentRect.left+8;
 }
 tabScrollPositions[group]=tabs.scrollLeft;
}
window.f4SuperadminRenderTabs=renderTabs;
window.f4RenderManagementSidebar=(origin)=>{
 const g=origin==='portal'?'content':origin==='bank'?'bank':origin==='book'?'masters':group;
 sidebar(g);
};
const f4SaNav={ready:false,restoring:false};
function f4SaRememberRoute(replace=false){
 if(!f4SaNav.ready||f4SaNav.restoring)return;
 const route={group,kind:active};
 const previous=history.state?.f4SaRoute;
 if(previous?.group===route.group&&previous?.kind===route.kind)return;
 const state={...history.state,f4SaDrawer:false,f4SaRoute:route};
 history[replace?'replaceState':'pushState'](state,'','#sa-'+group+(active?'/'+active:''));
}
window.addEventListener('popstate',()=>{
 const route=history.state?.f4SaRoute;
 if(!f4SaNav.ready||!route||!groups.some(([id])=>id===route.group))return;
 if(group===route.group&&(!route.kind||active===route.kind))return;
 f4SaNav.restoring=true;
 try{
  saCloseDrawer(true);
  open(route.group,false);
  if(route.kind&&submenu[route.group]?.some(([id])=>id===route.kind)&&active!==route.kind)
   openEditor(route.kind);
 }finally{f4SaNav.restoring=false}
});
function open(name,push=true){
 if(role!=='superadmin'||!groups.some(([key])=>key===name))return;
 saCloseDrawer(true);
 if(history.state?.f4SaDrawer)history.replaceState({...history.state,f4SaDrawer:false},'',location.href);
 window.f4CancelSuperadminEditor?.();
 active='';sidebar(name);
 if(push&&window.parent!==window)
  window.parent.postMessage({type:'f4:superadmin-section',section:name},location.origin);
 if(name==='overview')overview();
 if(name==='accounts')accountsPage();
 if(name==='content'||name==='bank'||name==='masters'){
   openEditor(submenu[name][0][0]);
   return;
 }
 if(name==='audit')auditPage();
 if(!submenu[name])f4SaRememberRoute();
}
function openEditor(kind){
 if(role!=='superadmin')return;
 const target=Object.entries(submenu).find(([,items])=>items.some(([key])=>key===kind));
 if(!target)return;
 const switched=active!==kind,priorGroup=group;
 active=kind;group=target[0];
 if(priorGroup!==group||!side.querySelector('button.active'))sidebar(group);
 if(kind==='residents'||kind==='bankcatalog')window.f4CancelSuperadminEditor?.();
 if(kind==='residents')window.openWarga();
 else if(kind==='bankcatalog')catalogPage();
 else if(typeof window.openSuperadminEditor==='function')window.openSuperadminEditor(kind);
 else title('Memuat Modul','Editor sedang disiapkan…');
 if(switched){
  const smooth=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  main.scrollTo?.({top:0,behavior:smooth});
 }
 f4SaRememberRoute();
}
window.f4SuperadminSwitchModule=openEditor;
function overview(){
 title('Pusat Pengelolaan','Semua pengaturan lintas portal • Akun Superadmin');
 const cards=el('div',undefined,'sa-grid');main.append(cards);
 for(const [key,label] of [['accounts','Akun terdaftar'],['houses','Rumah'],['projects','Projek publik'],['health','Status koneksi']]){
  const item=el('div',undefined,'sa-card');item.append(el('small',label),el('strong','—'),el('span','Memeriksa data'));item.dataset.card=key;cards.append(item);
 }
 const feed=section('Koneksi dan publikasi');feed.append(el('p','Angka hanya ditampilkan dari respons API yang berhasil; tidak ada angka simulasi.'));
 const tasks=section('Akses cepat');const actions=el('div',undefined,'sa-controls');
 for(const [key,label] of groups.slice(1))actions.append(button(label,()=>open(key),'sa-action'));tasks.append(actions);
 const pulls=[['accounts','/api/superadmin/accounts/preview'],['houses','/api/v2/admin/residents'],['projects','/api/v2/admin/content/projects']];
 Promise.allSettled(pulls.map(async ([id,path])=>{
  const card=cards.querySelector('[data-card="'+id+'"]');
  try{
   const r=rows(await get(path));
   if(!card?.isConnected)return;
   card.querySelector('strong').textContent=String(r.length);
   card.querySelector('span').textContent=r.length?'Data tersedia':'Belum ada data';
  }catch(error){
   if(card?.isConnected){
    card.querySelector('strong').textContent='—';
    card.querySelector('span').textContent='Gagal dimuat: '+safe(error);
   }
   throw error;
  }
 })).then(results=>{
  const health=cards.querySelector('[data-card="health"]');
  if(!health?.isConnected)return;
  const failed=results.filter(r=>r.status==='rejected').length;
  health.querySelector('strong').textContent=failed?'Periksa':'Terhubung';
  health.querySelector('span').textContent=failed?failed+' layanan perlu diperiksa':'Semua respons diterima';
 });
}
// Match original Bank Sampah account-management table, add centralized role.
let accountRoleFilter='',accountRequestSerial=0;
const normalizedRole=(value)=>{
 const role=String(value||'').trim().toLowerCase();
 if(['warga','anggota','member','resident'].includes(role))return 'anggota';
 if(['superadmin','super_admin','super-admin'].includes(role))return 'superadmin';
 if(['admin','administrator'].includes(role))return 'admin';
 return role||'publik';
};
function accountName(a){return value(a,['nama','name','display_name','full_name','username'])||'Tanpa nama'}
function accountHouse(a){return value(a,['rumah','house','house_code','nomor_rumah','unit'])}
function accountUser(a){return value(a,['username','user_name','login'])}
function accountId(a){return value(a,['wargaId','warga_id','member_id','payer_id','resident_id'])}
function accountStatus(a){
 const enabled=a.aktif??a.active??a.is_active;
 if(enabled===false||enabled===0||enabled==='0')return 'Nonaktif';
 const state=String(a.status||a.account_status||'').trim();
 if(/nonaktif|inactive|disabled|suspend/i.test(state))return 'Nonaktif';
 if(a.perluAktivasi||/pending|belum/i.test(state))return 'Belum aktif';
 if(enabled===true||enabled===1||enabled==='1'||/aktif|active/i.test(state))return 'Aktif';
 // Display status only when an explicit account status is available from API.
 return '—';
}

async function manageAccount(a,action){
 const old=accountName(a),house=accountHouse(a),username=accountUser(a);
 const shade=el('div',undefined,'sa-account-shade'),panel=el('section',undefined,'sa-account-modal');
 panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');
 const heading=el('h3',action==='edit'?'Edit nama warga':action==='deactivate'?'Nonaktifkan akun':'Pergantian penghuni');
 const subtitle=el('p',old+' · '+house+' · '+username,'sa-account-subtitle');
 const msg=el('p',action==='handover'?'Penghuni lama tetap tercatat dalam riwayat keuangan dan tabungan. Penghuni baru mendapat ID serta akun terpisah.':action==='deactivate'?'Akun dinonaktifkan tanpa menghapus transaksi dan riwayatnya.':'Hanya untuk koreksi nama pemilik yang sama. Jika orangnya berubah, pilih Ganti penghuni.','sa-account-info');
 const form=el('form');
 let name,user;
 if(action!=='deactivate'){
  const label=el('label','Nama lengkap');name=el('input');name.required=true;name.minLength=2;name.maxLength=160;name.value=action==='edit'?old:'';
  label.append(name);form.append(label);
 }
 if(action==='handover'){
  const label=el('label','Username baru (berbeda dari pemilik lama)');
  user=el('input');user.required=true;user.pattern='[a-z0-9][a-z0-9-]{3,39}';user.placeholder=(username||'warga')+'-2';
  label.append(user);form.append(label);
 }
 const feedback=el('p','','sa-account-feedback');feedback.setAttribute('role','status');
 const buttons=el('div',undefined,'sa-account-modal-actions');
 const cancel=button('Batal',()=>shade.remove(),'sa-account-reset');
 const save=button(action==='handover'?'Ganti penghuni':action==='deactivate'?'Ya, Nonaktifkan':'Simpan',()=>{},'sa-action sa-action-primary');
 save.type='submit';buttons.append(cancel,save);form.append(feedback,buttons);panel.append(heading,subtitle,msg,form);shade.append(panel);document.body.append(shade);
 shade.onclick=e=>{if(e.target===shade)shade.remove()};
 form.onsubmit=async e=>{
  e.preventDefault();save.disabled=true;feedback.textContent='Memproses perubahan…';
  const payload={action,accountId:a.id};
  if(name)payload.name=name.value.trim();
  if(user){payload.username=user.value.trim().toLowerCase();payload.confirmation='GANTI PENGHUNI'}
  if(action==='deactivate')payload.confirmation='NONAKTIFKAN AKUN';
  try{
   const r=await fetch(API+'/api/superadmin/accounts/manage-member',{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const data=await r.json().catch(()=>({}));if(!r.ok||data.ok===false)throw Error(data.error||'HTTP '+r.status);
   feedback.textContent=action==='handover'?'Selesai. Username baru: '+data.username+' · Password awal: '+data.passwordAwal+'. Berikan secara pribadi.':
    action==='deactivate'?'Akun lama nonaktif; riwayatnya tetap disimpan.':'Nama berhasil diperbarui.';
   save.disabled=false;save.textContent='Tutup';
   form.onsubmit=e=>{e.preventDefault();shade.remove();accountsPage()};
  }catch(error){feedback.textContent='Gagal: '+error.message;save.disabled=false}
 };
 if(name)name.focus();else save.focus();
}
async function accountRequest(a,operation){
 const id=String(a?.id||'');
 if(!/^account:[A-Za-z0-9_-]{1,100}$/.test(id)||String(a?.role)!=='anggota')
   throw Error('Akun anggota tidak valid.');
 const activation=operation==='activate';
 const path=activation?'/api/superadmin/accounts/activate-member':'/api/superadmin/accounts/reset-member';
 const payload={accountId:id,confirmation:activation?'AKTIFKAN AKUN WARGA':'RESET PASSWORD WARGA'};
 const res=await fetch(API+path,{method:'POST',credentials:'include',cache:'no-store',
  headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 const result=await res.json().catch(()=>({}));
 if(!res.ok||result.ok===false)throw Error(result.error||'HTTP '+res.status);
 return result;
}
async function accountSingleAction(a,operation,control){
 const activation=operation==='activate',username=accountUser(a);
 if(!await window.f4UiDialog.confirm((activation?'Aktifkan akun ':'Reset password akun ')+username+'? Password awal akan menjadi 1234'+(activation?'.':', dan semua sesi lama akan dikeluarkan.') ))return;
 control.disabled=true;
 try{
  const result=await accountRequest(a,operation);
  await window.f4UiDialog.alert((activation?'Akun aktif.':'Password direset.')+'\nUsername: '+(result.username||username)+'\nPassword awal: '+(result.passwordAwal||'1234')+'\nSampaikan secara pribadi kepada warga.');
  accountsPage();
 }catch(e){await window.f4UiDialog.alert('Perubahan akun gagal: '+safe(e));control.disabled=false}
}
function accountsPage(){
 title('Akun & Hak Akses','Kelola identitas dan hak akses akun Flamboyan 4.');
 const panel=el('section',undefined,'sa-accounts-shell');
 const heading=el('div',undefined,'sa-account-head'),head=el('div');
 head.append(el('h3','Kelola akun warga'),el('p','Daftar akun terpusat untuk seluruh portal.'));
 const actions=el('div',undefined,'sa-account-actions');
 const prepare=button('Siapkan semua akun',async()=>{
  const pending=accounts.filter(a=>a.role==='anggota'&&a.perluAktivasi===true);
  if(!pending.length)return;
  if(!await window.f4UiDialog.confirm('Aktifkan '+pending.length+' akun anggota yang belum aktif? Password awal setiap akun: 1234. Akun yang sudah aktif tidak berubah.'))return;
  prepare.disabled=true;
  let made=0;
  try{

function paintAccounts(){
 const tbody=document.getElementById('sa-accounts');
 const count=document.getElementById('sa-account-count');

 const term=accountSearch.trim().toLowerCase(),roleFilter=accountRoleFilter;

  const role=normalizedRole(a.role||a.peran||a.account_role);
  if(roleFilter&&role!==roleFilter)return false;
  return [accountName(a),accountHouse(a),accountUser(a),accountId(a),role]
    .join(' ').toLowerCase().includes(term);
 });
 count.textContent=filtered.length+' dari '+accounts.length+' akun';
 tbody.replaceChildren();
 for(const a of filtered){
  const tr=el('tr');
  const name=el('td'),namelabel=el('strong',accountName(a));
  name.append(namelabel);
  // Account/member IDs remain internal for editing and audits; no IDs on list cards.
  const house=el('td',accountHouse(a)||'—');
  const user=el('td',accountUser(a)||'—');
  const role=el('td'),tag=el('span',({anggota:'Anggota',admin:'Admin',superadmin:'Superadmin'})[normalizedRole(a.role||a.peran||a.account_role)]||'Publik','sa-account-role');
  tag.dataset.role=normalizedRole(a.role||a.peran||a.account_role);role.append(tag);
  const status=el('td',undefined,'sa-account-status'),statusLabel=el('span',accountStatus(a));
  statusLabel.dataset.status=accountStatus(a);status.append(statusLabel);
  const action=el('td');

  const canActivate=member&&a.perluAktivasi===true;
  const canReset=member&&accountStatus(a)==='Aktif';
  if(canActivate||canReset){
   const operation=canActivate?'activate':'reset';
   const control=button(canActivate?'Aktifkan':'Reset password',()=>accountSingleAction(a,operation,control),'sa-account-reset');
   control.title=canActivate?'Aktifkan akun anggota':'Reset password anggota ke 1234 dan putuskan sesi lama';
   action.append(control);
  }
  if(member&&accountStatus(a)==='Aktif'){
   action.append(button('Edit',()=>manageAccount(a,'edit'),'sa-account-manage'));
   action.append(button('Nonaktifkan',()=>manageAccount(a,'deactivate'),'sa-account-manage sa-account-warning'));
   action.append(button('Ganti penghuni',()=>manageAccount(a,'handover'),'sa-account-manage'));

 },'sa-action'));}
