<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<noscript><meta http-equiv="refresh" content="0;url=/"><style id="f4-private-noscript">body{display:none!important}
</style></noscript>
<meta name="robots" content="noindex,nofollow">
<title>Pusat Pengelolaan | Flamboyan 4</title>

<style>
:root{--blue:#6650cc;--navy:#28334b;--tint:#f1edff;--edge:#e4e7ef;--muted:#69748b}
body{--work-bg:#fff;--work-accent:var(--blue);--work-tint:var(--tint);--work-line:var(--edge);--work-text:var(--navy)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);background:#fff}button,input,select,textarea{font:inherit}
button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}#guard{padding:28px;max-width:560px;margin:88px auto;background:#fff;border:1px solid var(--edge);border-radius:16px}
#f4-account-page:not([hidden]){display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100dvh;position:relative;inset:auto;background:#fff;color:inherit}
#f4-account-page>aside{position:sticky;top:0;align-self:start;height:100dvh;max-height:100dvh;overflow-x:hidden;overflow-y:auto;background:#fff;border-right:1px solid var(--edge);padding:16px 12px;display:flex;flex-direction:column;gap:5px}
#f4-account-page>main{max-width:none;width:100%;padding:66px 22px 30px;overflow-y:auto;overflow-x:hidden;min-width:0}
.f4-sa-brand{display:flex;gap:10px;align-items:center;padding:12px 8px 15px;border-bottom:1px solid var(--edge);margin-bottom:11px}
.f4-sa-logo{height:42px;width:42px;object-fit:contain}.f4-sa-brand strong{display:block;font-size:14px;color:var(--navy)}.f4-sa-brand small{display:block;font-size:10px;color:var(--muted)}
.f4-sa-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;padding:11px 10px 5px}
#f4-account-page>aside button{width:100%;min-height:42px;text-align:left;border:0;border-radius:10px;background:transparent;padding:10px 11px;color:var(--navy);font-size:12px;font-weight:700}
#f4-account-page>aside button.active,#f4-account-page>aside button:hover{background:var(--tint);color:var(--blue)}
#f4-account-page>aside .f4-sa-subtitle{margin-top:13px;border-top:1px solid var(--edge)}
#f4-account-page>main h2{font-size:25px;margin:0 0 5px;font-weight:850;color:var(--navy)}
#f4-account-page>main p{margin:5px 0 16px;color:var(--muted)}
.f4-work-heading{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
.f4-work-heading h2{font-size:24px}
.f4-work-section,.f4-admin-controls,.sa-card{background:white;border:1px solid var(--edge);border-radius:14px;padding:17px}
.sa-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--f4-grid-gap,16px);margin:16px 0}
.sa-card small{display:block;color:var(--muted);font-size:11px}.sa-card strong{display:block;font-size:22px;color:var(--navy);margin-top:6px}.sa-card span{display:block;color:var(--muted);font-size:11px}
.sa-section{border:1px solid var(--edge);border-radius:14px;background:#fff;padding:17px;margin:12px 0}
.sa-section h3{margin:0 0 9px;font-size:16px;color:var(--navy)}
.sa-list{display:grid;gap:9px}.sa-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--edge);border-radius:11px;background:#fff}
.sa-item strong{display:block;font-size:13px}.sa-item small{display:block;color:var(--muted);font-size:11px}.sa-chip{background:var(--tint);border-radius:20px;color:var(--blue);padding:5px 9px;font-size:10px;font-weight:800}
.sa-controls{display:flex;flex-wrap:wrap;align-items:center;gap:var(--f4-control-gap,10px);margin:12px 0}
.sa-controls input,.sa-controls select{height:var(--f4-control-height,42px);padding:0 12px;border:1px solid var(--edge);border-radius:9px;min-width:190px;flex:1}
.sa-action,.f4-admin-btn,.f4-admin-primary,.f4-work-button{border:1px solid var(--edge);border-radius:10px;background:var(--tint);color:var(--blue);padding:10px 12px;font-size:12px;font-weight:800}
.f4-admin-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.f4-admin-list{display:grid;gap:9px}.f4-admin-item{background:white;border:1px solid var(--edge);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.f4-admin-item strong,.f4-admin-item small{display:block}.f4-admin-item small{color:var(--muted);font-size:11px}
.f4-admin-controls{display:flex;align-items:center;gap:var(--f4-control-gap,10px);flex-wrap:wrap;margin:12px 0}
.f4-admin-controls input{min-width:180px;flex:1;height:var(--f4-control-height,42px);padding:0 12px;border-radius:9px;border:1px solid var(--edge)}
.f4-admin-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--f4-grid-gap,16px)}
.f4-admin-fields label{display:flex;flex-direction:column;gap:5px;font-weight:650;font-size:12px}
.f4-admin-fields input,.f4-admin-fields textarea,.f4-admin-fields select{width:100%;border:1px solid var(--edge);border-radius:9px;padding:11px;background:#fff}
.f4-admin-fields :is(input,select){height:var(--f4-control-height,42px);padding-block:0}
.f4-admin-editor{border:1px solid var(--edge);background:#fff;padding:20px;border-radius:14px}

/* Compact master iuran form: genuine component styles, no cascade overlays. */
.f4-obligation-form{padding:16px 18px;display:grid;gap:11px;max-width:1000px}
.f4-obligation-identity{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--f4-grid-gap,16px)}
.f4-obligation-field{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:12px;font-weight:700;color:var(--navy)}
.f4-obligation-field :is(input,select){width:100%;height:42px;min-width:0;padding:8px 12px;border:1px solid var(--edge);border-radius:9px;background:#fff;color:var(--navy);font:500 13px system-ui}
.f4-obligation-field :is(input,select):focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.f4-obligation-section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--navy);margin-top:2px}
.f4-obligation-section-title span{font-size:11px;color:var(--muted)}
.f4-obligation-amounts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--f4-grid-gap-compact,10px)}
.f4-obligation-amounts input{text-align:center;font-weight:600}
.f4-obligation-form .f4-obligation-edit-fields{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f4-obligation-form .f4-obligation-edit-fields label{gap:5px}
.f4-obligation-form .f4-obligation-edit-fields input{min-height:41px;padding:8px 11px}
.f4-obligation-form .f4-obligation-actions{justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;margin-top:0;padding-top:10px;border-top:1px solid var(--edge)}
.f4-obligation-form .f4-admin-message{margin:0;font-size:12px}
@media(max-width:760px){
 .f4-obligation-form{padding:12px;gap:10px}
 .f4-obligation-identity{grid-template-columns:1fr}
 .f4-obligation-amounts{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .f4-obligation-form .f4-obligation-edit-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
 .f4-obligation-form .f4-obligation-actions>*{flex:1 1 0;min-width:0}
}

.f4-admin-editor .f4-content-destination{display:flex;flex-direction:column;gap:6px;max-width:320px;margin:0 0 14px;font-size:12px;font-weight:700;color:var(--navy)}
.f4-admin-editor .f4-content-destination select{width:100%;min-height:41px;padding:9px 11px;border:1px solid var(--edge);border-radius:9px;background:#fff;color:var(--navy);font:500 13px system-ui}
.f4-admin-editor .f4-content-destination select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
@media(max-width:700px){.f4-admin-editor .f4-content-destination{max-width:100%}}
.f4-warga-form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.f4-admin-note,.f4-admin-message{color:var(--muted);font-size:12px}
.sa-warn{padding:12px;border-radius:10px;background:#fff7ec;color:#83562d;border:1px solid #f1dbb9}
.sa-toast{position:fixed;bottom:18px;right:18px;border-radius:12px;padding:12px;background:var(--navy);color:#fff;z-index:10;box-shadow:0 7px 22px #112c4422;max-width:320px}
.sa-back{display:none}
@media(max-width:760px){
 #f4-account-page:not([hidden]){grid-template-columns:minmax(0,1fr);display:block}
 #f4-account-page>aside{position:sticky;top:0;z-index:7;height:auto;max-height:190px;overflow-y:auto;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;padding:8px;gap:6px;box-shadow:0 2px 8px #112c4415}
 #f4-account-page>aside .f4-sa-brand{min-width:122px;flex:none;margin:0;padding:5px 8px;border:0}
 #f4-account-page>aside .f4-sa-brand img{width:30px;height:30px}
 #f4-account-page>aside .f4-sa-brand small,.f4-sa-label{display:none}
 #f4-account-page>aside button{min-width:125px;width:auto;flex:none;padding:8px;min-height:37px;text-align:center}
 #f4-account-page>aside .f4-sa-subtitle{border:0;margin:0}
 #f4-account-page>main{padding:72px 12px 28px}
 .sa-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .f4-admin-fields{grid-template-columns:1fr}
}

/* Portal Superadmin memakai layout asli, tanpa overlay account-workspace lama. */
@media(max-width:1023px){
 html,body{max-width:100vw;overflow-x:hidden}
 html body #f4-account-page:not([hidden]){
  display:block;grid-template-columns:1fr;max-width:100vw;overflow-x:clip
 }
 html body #f4-account-page>aside{
  position:fixed;top:0;left:0;bottom:0;
  margin:0;width:min(288px,84vw);height:100dvh;max-height:none;
  z-index:102;transform:translate3d(-110%,0,0);visibility:hidden;
  transition:transform .22s ease,visibility .22s ease;
  overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column;flex-wrap:nowrap;
  align-items:stretch;padding:16px 12px;
  box-shadow:12px 0 28px #16304a24
 }
 html body #f4-account-page.f4-sa-drawer-open>aside{
  transform:translate3d(0,0,0);visibility:visible
 }
 html body #f4-account-page>aside .f4-sa-brand{
  min-width:0;display:flex;flex-direction:row;
  margin-bottom:11px;border-bottom:1px solid var(--edge);padding:12px 8px 15px
 }
 html body #f4-account-page>aside .f4-sa-brand small,
 html body #f4-account-page>aside .f4-sa-label{display:block}
 html body #f4-account-page>aside button{
  width:100%;min-width:0;flex:none;text-align:left;
  min-height:42px;padding:10px 11px
 }
 html body #f4-account-page>main{
  padding:66px 12px 24px;overflow-y:auto;overflow-x:hidden;
  width:100%;min-width:0
 }
 #f4-account-page .f4-sa-mobile-backdrop{
  display:none;position:fixed;inset:0;background:#10243890;z-index:101
 }
 #f4-account-page.f4-sa-drawer-open .f4-sa-mobile-backdrop{display:block}
 #f4-account-page .sa-tabbar{max-width:100%;overflow-x:auto}
 #f4-account-page .f4-obligation-scroll{max-width:100%;overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){
 html body #f4-account-page>aside{transition:none}
}
/* Five root menus stay left; only the selected group's submenus become tabs. */
html body #f4-account-page>aside{overflow-x:hidden}
#f4-account-page .sa-tabbar{
 position:sticky;top:56px;z-index:3;display:flex;align-items:center;gap:7px;
 padding:10px 1px 12px;margin:-4px 0 16px;background:#fff;
 overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;
 scroll-behavior:auto;overscroll-behavior-x:contain;
 border-bottom:1px solid var(--edge);
}
#f4-account-page .sa-tabbar button{
 flex:none;min-height:39px;padding:9px 15px;border:1px solid var(--edge);
 border-radius:10px;background:white;color:var(--navy);font-size:12px;font-weight:750;
 transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease;
}
#f4-account-page .sa-tabbar button:hover{background:var(--tint);border-color:var(--edge)}
#f4-account-page .sa-tabbar button[aria-selected="true"]{
 background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 6px #27496419
}
#f4-account-page .sa-tabbar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@keyframes f4SaContentIn{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
#f4-account-page>main>.f4-work-heading,
#f4-account-page>main>.sa-section,
#f4-account-page>main>.sa-grid,
#f4-account-page>main>.sa-controls,
#f4-account-page>main>.f4-admin-controls,
#f4-account-page>main>.f4-admin-list,
#f4-account-page>main>.f4-admin-editor,
#f4-account-page>main>.f4-work-section{
 animation:f4SaContentIn .18s ease-out both
}
@media(max-width:760px){
 #f4-account-page .sa-tabbar{position:sticky;top:0;margin:0 0 14px;padding:8px 0 10px}
 #f4-account-page .sa-tabbar button{min-height:38px;padding:8px 12px}
}
@media(prefers-reduced-motion:reduce){
 #f4-account-page .sa-tabbar{scroll-behavior:auto}
 #f4-account-page .sa-tabbar button{transition:none}
 #f4-account-page>main>*{animation:none}
}

/* Navigasi terkelompok: satu pemilik gaya, tanpa frame atau lapisan override. */
#f4-account-page .sa-module-nav{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:-7px 0 17px}
#f4-account-page .sa-module-nav button{border:0;border-radius:8px;padding:8px 12px;background:transparent;color:var(--muted);font-size:12px;font-weight:700}
#f4-account-page .sa-module-nav button:hover{background:var(--tint)}
#f4-account-page .sa-module-nav button.is-active{background:var(--tint);color:var(--blue)}
#f4-account-page .sa-module-nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#f4-account-page .sa-overview-grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:10px}
#f4-account-page .sa-overview-status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 14px}
#f4-account-page .sa-overview-state{font-size:12px;color:#236547;font-weight:750}
#f4-account-page .sa-overview-state.is-warning{color:#98621c}
@media(max-width:760px){
 #f4-account-page .sa-overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 #f4-account-page .sa-module-nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
 #f4-account-page .sa-module-nav button{white-space:nowrap}
}

/* Table identity and status layout adapted from original Bank Sampah. */
/* Satu pemilik gaya tabel akun Superadmin: tanpa lapisan override warna lama. */
.sa-accounts-shell{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:20px;margin:4px 0 24px}
.sa-account-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.sa-account-head h3{font-size:18px;color:var(--navy);margin:0 0 3px}
#f4-account-page>main .sa-account-head p{margin:0;color:var(--muted);font-size:12px}
.sa-account-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sa-action-primary{background:var(--blue);color:white;border-color:var(--blue)}
.sa-account-note{background:var(--tint);color:var(--navy);border-radius:11px;padding:13px;margin:0 0 14px;line-height:1.55;font-size:12px}
.sa-account-table{background:#fbfaff;border:1px solid var(--edge);border-radius:13px;overflow:hidden}
.sa-account-filters{padding:14px;display:flex;gap:var(--f4-control-gap,10px);align-items:center;flex-wrap:wrap}
.sa-account-filters input,.sa-account-filters select{height:var(--f4-control-height,42px);padding:0 12px;background:#fff;border:1px solid var(--edge);border-radius:10px;font-size:12px;line-height:1.3;box-sizing:border-box}
.sa-account-filters input{flex:1 1 270px;max-width:500px}
.sa-account-filters select{flex:0 1 180px;max-width:180px;min-width:135px}
#f4-account-page>main .sa-account-count{font-size:11px;flex-basis:100%;margin:0;color:var(--muted)}
.sa-account-scroll{position:relative;max-height:none;overflow-x:auto;overflow-y:visible;background:#fff}
.sa-account-grid{border-collapse:separate;border-spacing:0;width:100%;min-width:690px;font-size:12px}
.sa-account-grid th{text-align:left;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.02em;background:#f8f6fe;padding:12px 14px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);position:static}
.sa-account-grid th:last-child,.sa-account-grid td:last-child{text-align:right}
.sa-account-grid td{padding:12px 14px;border-bottom:1px solid var(--edge);color:var(--navy);vertical-align:middle;position:static}
.sa-account-grid tr:nth-child(even){background:#fdfcff}
.sa-account-grid td strong{display:block;font-size:12px;color:var(--navy)}
.sa-account-grid td small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.sa-account-role{display:inline-block;background:var(--tint);color:var(--blue);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:750}
.sa-account-role[data-role="admin"]{background:var(--tint);color:var(--blue)}
.sa-account-role[data-role="superadmin"]{background:#efe9fd;color:var(--blue)}
.sa-account-status{color:#087f5b;font-weight:750}
.sa-account-status span[data-status="Nonaktif"]{color:#ad5454}
.sa-account-status span[data-status="Belum aktif"]{color:#a37626}
.sa-account-reset{position:static;transform:none;inset:auto;border:0;background:var(--tint);color:var(--blue);border-radius:10px;padding:8px 11px;font-weight:700;font-size:11px}
.sa-account-reset:disabled,.sa-action-primary:disabled{opacity:.66;cursor:not-allowed}
@media(max-width:760px){
 .sa-accounts-shell{padding:12px}
 .sa-account-head{align-items:flex-start}
 .sa-account-filters{padding:10px}
 .sa-account-filters input{max-width:none;flex-basis:100%}
 .sa-account-filters select{max-width:100%;flex:1 1 135px}
}
/* Master warga: tabel horizontal ringkas; tetap bisa digeser di HP. */
.sa-resident-scroll{width:100%;max-width:100%;overflow-x:auto;border:1px solid var(--edge);border-radius:13px;background:white}
.sa-resident-grid{border-collapse:collapse;width:100%;min-width:850px;font-size:12px}
.sa-resident-grid th{background:#f7f5ff;color:var(--blue);font-weight:750;text-align:left;padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--edge)}
.sa-resident-grid td{padding:10px 12px;border-bottom:1px solid var(--edge);color:var(--navy);vertical-align:middle}
.sa-resident-grid tr:nth-child(even){background:#fdfcff}
.sa-resident-grid td:last-child{text-align:right;width:88px}
.sa-resident-grid td .sa-action{padding:7px 12px}

/* Shared compact tables; replace the two old overlapping table rule blocks. */
.f4-obligation-scroll{width:100%;max-width:100%;overflow-x:auto;border:1px solid var(--edge);border-radius:12px;background:#fff}
.f4-obligation-grid{border-collapse:collapse;min-width:760px;width:100%;font-size:12px}
.f4-obligation-grid th{padding:9px 11px;text-align:left;background:#f7f5ff;color:var(--blue);border-bottom:1px solid var(--edge);white-space:nowrap}
.f4-obligation-grid td{padding:8px 11px;border-bottom:1px solid var(--edge);color:var(--navy);vertical-align:middle}
.f4-obligation-grid tr:nth-child(even){background:#fdfcff}
.f4-obligation-grid td:first-child{font-weight:700}
.f4-obligation-grid td:nth-child(n+3):nth-child(-n+6){text-align:center;font-weight:700}
.f4-obligation-grid:not([data-module="obligations"]) td:nth-child(n+3):nth-child(-n+6){text-align:left;font-weight:400}
.f4-obligation-grid:not([data-module="obligations"]) td:last-child{text-align:right;min-width:150px;width:150px}
.f4-obligation-grid[data-module="obligations"]{table-layout:fixed;min-width:690px}
.f4-obligation-grid[data-module="obligations"] th:first-child{width:25%}
.f4-obligation-grid[data-module="obligations"] th:nth-child(2){width:16%}
.f4-obligation-grid[data-module="obligations"] th:nth-child(n+3):nth-child(-n+6){width:12%;text-align:center}
.f4-obligation-grid[data-module="obligations"] th:last-child{width:11%;text-align:center}
.f4-obligation-grid[data-module="obligations"] td{padding:6px 9px;height:43px;white-space:nowrap}
.f4-obligation-grid[data-module="obligations"] td:last-child{text-align:center}
.f4-obligation-row-actions{display:flex;justify-content:center;align-items:center;gap:5px;white-space:nowrap}
.f4-obligation-icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;min-width:30px;padding:0;border:1px solid var(--edge);border-radius:8px;background:#f8f6fe;color:var(--blue);cursor:pointer}

<script>
(()=>{
'use strict';
const API='https://api.flamboyan4.web.id',root=document.getElementById('f4-account-page'),side=root.querySelector('aside'),main=root.querySelector('main'),guard=document.getElementById('guard');
const saBackdrop=document.createElement('div');
saBackdrop.className='f4-sa-mobile-backdrop';saBackdrop.setAttribute('aria-hidden','true');root.append(saBackdrop);
const saEmbedded=window.parent!==window;
const standaloneButton=document.createElement('button');
standaloneButton.type='button';standaloneButton.className='f4-sa-standalone-menu';
standaloneButton.setAttribute('aria-label','Buka menu Superadmin');standaloneButton.textContent='☰';
if(!saEmbedded){document.body.append(standaloneButton);standaloneButton.onclick=()=>window.f4ToggleSuperadminMenu();}
function saMenuOpened(){return root.classList.contains('f4-sa-drawer-open')}
function saNotifyMenu(open){
 if(saEmbedded)window.parent.postMessage({type:'f4:sidebar-state',portal:'superadmin',open},location.origin);
 standaloneButton.setAttribute('aria-expanded',String(open));
}
function saCloseDrawer(fromHistory=false){
 if(!saMenuOpened())return;
 if(!fromHistory&&history.state?.f4SaDrawer){history.back();return}
 root.classList.remove('f4-sa-drawer-open');
 document.documentElement.classList.remove('f4-sa-drawer-lock');
 saNotifyMenu(false);
}
window.f4ToggleSuperadminMenu=()=>{
 if(saMenuOpened()){saCloseDrawer();return}
 if(matchMedia('(min-width:1024px)').matches)return;
 history.pushState({...history.state,f4SaDrawer:true},'',location.href);
 root.classList.add('f4-sa-drawer-open');
 document.documentElement.classList.add('f4-sa-drawer-lock');
 saNotifyMenu(true);
};
saBackdrop.addEventListener('click',()=>saCloseDrawer());
window.addEventListener('popstate',()=>{if(!history.state?.f4SaDrawer)saCloseDrawer(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&saMenuOpened()){e.preventDefault();saCloseDrawer()}});
window.addEventListener('resize',()=>{if(innerWidth>=1024)saCloseDrawer(true)});
const groups=[['overview','Ringkasan Sistem'],['treasury','Pusat Keuangan'],['accounts','Akun & Hak Akses'],['content','Portal Utama'],['bank','Bank Sampah'],['masters','Data & Aturan'],['audit','Pengaturan & Audit']];
const submenu={
 content:[['projects','Project Card'],['agenda','Rencana Kegiatan'],['documentation','Dokumentasi'],['inventory','Inventaris'],['banners','Banner Slider'],['meetings','Hasil Rapat'],['arisan','Jadwal Arisan'],['jersey','Pesanan Jersey']],
 bank:[['bank_progress','Kegiatan'],['bank_albums','Dokumentasi'],['bank_inventory','Inventaris'],['bankcatalog','Jenis & Harga'],['bank_weighing','Jadwal Timbang']],
 masters:[['residents','Data Warga & Rumah'],['obligations','Kewajiban Iuran'],['tariffs','Tarif Iuran'],['settings','Aturan Tanggal']]
};
// Kelompok navigasi ringkas; kunci modul lama tetap digunakan oleh API dan tautan.
const moduleGroups={
 content:[
  {id:'publikasi',label:'Publikasi',items:['projects','banners','documentation']},
  {id:'kegiatan',label:'Kegiatan & Arsip',items:['agenda','meetings','inventory']},
  {id:'program',label:'Program Warga',items:['arisan','jersey']}
 ],
 bank:[
  {id:'publikasi',label:'Publikasi',items:['bank_progress','bank_albums','bank_inventory']},
  {id:'pengaturan',label:'Pengaturan',items:['bankcatalog','bank_weighing']}
 ]
};
let role='public',group='overview',active='',accounts=[],accountSearch='',residentRows=[];
const el=(tag,text,cls)=>{const v=document.createElement(tag);if(text!==undefined)v.textContent=String(text);if(cls)v.className=cls;return v};
const button=(label,on,cls)=>{const b=el('button',label,cls);b.type='button';b.onclick=on;return b};
const title=(name,desc)=>{
 rememberTabScroll();
 main.replaceChildren();
 const category=group==='content'?'Portal Utama':group==='bank'?'Bank Sampah':group==='masters'?'Data & Aturan':'';
 const categoryDesc=group==='content'?'Kelola konten, kegiatan, dan program warga.':group==='bank'?'Kelola publikasi dan pengaturan Bank Sampah.':'Kelola data warga dan aturan iuran.';
 const h=el('header',undefined,'f4-work-heading');
 h.append(el('h2',category&&active?category:name),el('p',category&&active?categoryDesc:desc));
 main.append(h);
 renderTabs();
 // The active submenu tab already names the module. Do not repeat
 // its title/description beneath the tab navigation.
};
const section=(label)=>{const s=el('section',undefined,'sa-section');s.append(el('h3',label));main.append(s);return s};
const value=(o,keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return String(o[k]);return ''};
const rows=(o)=>Array.isArray(o)?o:Array.isArray(o?.rows)?o.rows:Array.isArray(o?.data)?o.data:Array.isArray(o?.accounts)?o.accounts:Array.isArray(o?.akun)?o.akun:[];
const notice=(text)=>{const n=el('p',text,'f4-admin-note');main.append(n);return n};
const safe=(error)=>String(error&&error.message||error);
async function get(path){const res=await fetch(API+path,{credentials:'include',cache:'no-store'});const d=await res.json().catch(()=>({}));if(!res.ok||d.ok===false)throw Error(d.error||('HTTP '+res.status));return d}
function sidebar(g=group){
 group=g;side.replaceChildren();
 const brand=el('div',undefined,'f4-sa-brand');const img=el('img');img.src='/assets/logo-flamboyan.svg?v=official-20261027-v2';img.alt='Logo Flamboyan 4';img.className='f4-sa-logo';
 const text=el('span');text.append(el('strong','Flamboyan 4'),el('small','Portal Superadmin'));brand.append(img,text);side.append(brand);
 side.append(el('strong','MENU SUPERADMIN','f4-sa-label'));
 for(const [key,label] of groups){
  const b=button('',()=>open(key),g===key?'active':'');
  b.dataset.saGroup=key;
  const icon=el('img',undefined,'sa-nav-icon');
  icon.src='/assets/icons/'+({overview:'superadmin',treasury:'cash',accounts:'user',content:'portal-superadmin',bank:'bank-superadmin',masters:'inventory',audit:'book'}[key])+'.svg';
  icon.alt='';icon.setAttribute('aria-hidden','true');
  b.append(icon,el('span',label));
  b.setAttribute('aria-current',g===key?'page':'false');side.append(b);
 }
 document.body.dataset.saArea=g;
 window.f4SuperadminArea=g;

}
const tabScrollPositions={content:0,bank:0,masters:0};
function rememberTabScroll(){
 const existing=main.querySelector('.sa-tabbar');
 const previousGroup=existing?.dataset.group;
 if(previousGroup&&Object.hasOwn(tabScrollPositions,previousGroup))
  tabScrollPositions[previousGroup]=existing.scrollLeft;
}
window.f4SuperadminRememberTabScroll=rememberTabScroll;
function renderTabs(){
 const current=submenu[group];
 if(!current||!active||!current.some(([key])=>key===active))return;
 main.querySelector('.sa-tabbar')?.remove();
 main.querySelector('.sa-module-nav')?.remove();
 const grouped=moduleGroups[group];
 const activeGroup=grouped?.find(item=>item.items.includes(active));
 const options=grouped
  ?grouped.map(item=>[item.id,item.label,item.items[0]])
  :current.map(([key,label])=>[key,label,key]);
 const tabs=el('nav',undefined,'sa-tabbar');
 tabs.dataset.group=group;
 tabs.setAttribute('role','tablist');
 tabs.setAttribute('aria-label',group==='content'?'Kelompok Portal Utama':group==='bank'?'Kelompok Bank Sampah':'Menu Data & Aturan');
 for(const [key,label,first] of options){
  const selected=grouped?activeGroup?.id===key:active===key;
  const tab=button(label,()=>openEditor(first));
  tab.setAttribute('role','tab');
  tab.setAttribute('aria-selected',String(selected));
  tab.tabIndex=selected?0:-1;
  tab.addEventListener('keydown',event=>{
   if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
   event.preventDefault();
   const index=options.findIndex(option=>option[0]===key);
   const next=event.key==='Home'?0:event.key==='End'?options.length-1:
    (index+(event.key==='ArrowRight'?1:-1)+options.length)%options.length;
   openEditor(options[next][2]);
   main.querySelectorAll('.sa-tabbar [role="tab"]')[next]?.focus({preventScroll:true});
  });
  tabs.append(tab);
 }
 main.querySelector('.f4-work-heading')?.after(tabs);
 tabs.scrollLeft=tabScrollPositions[group]||0;
 const currentTab=tabs.querySelector('[aria-selected="true"]');
 if(currentTab){
  const currentRect=currentTab.getBoundingClientRect(),railRect=tabs.getBoundingClientRect();
  if(currentRect.right>railRect.right)tabs.scrollLeft+=currentRect.right-railRect.right+8;
  if(currentRect.left<railRect.left)tabs.scrollLeft-=railRect.left-currentRect.left+8;
 }
 tabScrollPositions[group]=tabs.scrollLeft;
 if(activeGroup){
  const moduleNav=el('nav',undefined,'sa-module-nav');
  moduleNav.setAttribute('aria-label','Pilih fitur '+activeGroup.label);
  for(const key of activeGroup.items){
   const entry=current.find(([id])=>id===key);
   if(!entry)continue;
   const chosen=key===active;
   const item=button(entry[1],()=>openEditor(key),chosen?'is-active':'');
   if(chosen)item.setAttribute('aria-current','page');
   moduleNav.append(item);
  }
  tabs.after(moduleNav);
 }
}
window.f4SuperadminRenderTabs=renderTabs;
window.f4RenderManagementSidebar=(origin)=>{
 const g=origin==='portal'?'content':origin==='bank'?'bank':origin==='book'?'masters':group;
 sidebar(g);
};
const f4SaNav={ready:false,restoring:false};
function f4SaRememberRoute(replace=false){
 if(!f4SaNav.ready||f4SaNav.restoring)return;
 const route={group,kind:active};
 const previous=history.state?.f4SaRoute;
 if(previous?.group===route.group&&previous?.kind===route.kind)return;
 const state={...history.state,f4SaDrawer:false,f4SaRoute:route};
 history[replace?'replaceState':'pushState'](state,'','#sa-'+group+(active?'/'+active:''));
}
window.addEventListener('popstate',()=>{
 const route=history.state?.f4SaRoute;
 if(!f4SaNav.ready||!route||!groups.some(([id])=>id===route.group))return;
 if(group===route.group&&(!route.kind||active===route.kind))return;
 f4SaNav.restoring=true;
 try{
  saCloseDrawer(true);
  open(route.group,false);
  if(route.kind&&submenu[route.group]?.some(([id])=>id===route.kind)&&active!==route.kind)
   openEditor(route.kind);
 }finally{f4SaNav.restoring=false}
});
function open(name,push=true){
 if(role!=='superadmin'||!groups.some(([key])=>key===name))return;
 saCloseDrawer(true);
 if(history.state?.f4SaDrawer)history.replaceState({...history.state,f4SaDrawer:false},'',location.href);
 window.f4CancelSuperadminEditor?.();
 active='';sidebar(name);
 if(push&&window.parent!==window)
  window.parent.postMessage({type:'f4:superadmin-section',section:name},location.origin);
 if(name==='overview')overview();
 if(name==='treasury')window.f4OpenTreasuryCenter?.();
 if(name==='accounts')accountsPage();
 if(name==='content'||name==='bank'||name==='masters'){
   openEditor(submenu[name][0][0]);
   return;
 }
 if(name==='audit')auditPage();
 if(!submenu[name])f4SaRememberRoute();
}
function bankWeighingPage(){
 title('Jadwal Penimbangan','Atur frekuensi dan tanggal penimbangan Bank Sampah.');
 const panel=section('Jadwal Rutin');
 const form=el('form',undefined,'sa-weighing-form');
 const weekdays=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
 const row=(name,id,control)=>{
  const label=el('label',name,'sa-weighing-label');label.htmlFor=id;
  control.id=id;
  const field=el('div',undefined,'sa-weighing-field');field.append(label,control);
  return field;
 };
 const frequency=el('select');frequency.required=true;
 [['weekly','Setiap minggu'],['biweekly','Setiap 2 minggu'],['monthly','Setiap bulan']].forEach(([value,name])=>frequency.add(new Option(name,value)));
 const weekday=el('select');weekday.required=true;
 weekdays.forEach((name,i)=>weekday.add(new Option(name,String(i))));
 const anchor=el('input');anchor.type='date';
 const monthly=el('select');for(let i=1;i<=31;i++)monthly.add(new Option('Tanggal '+i,String(i)));
 const frequencyField=row('Frekuensi','saBankWeighingFrequency',frequency);
 const weekdayField=row('Hari penimbangan','saBankWeighingDay',weekday);
 const anchorField=row('Tanggal penimbangan pertama','saBankWeighingAnchor',anchor);
 const monthField=row('Tanggal setiap bulan','saBankWeighingMonthDate',monthly);
 const preview=el('p','', 'sa-weighing-preview');
 const status=el('p','Memuat jadwal…','sa-weighing-status');
 status.setAttribute('role','status');status.setAttribute('aria-live','polite');
 const actions=el('div',undefined,'sa-weighing-actions');
 const save=el('button','Simpan Jadwal','sa-action sa-action-primary');save.type='submit';save.disabled=true;
 actions.append(save);
 form.append(frequencyField,weekdayField,anchorField,monthField,preview,actions,status);
 panel.append(form);
 let loaded=false,waiting=false,serverVersion=0;
 const today=()=>new Date(Date.now()+7*3600000).toISOString().slice(0,10);
 const dateAt=value=>{
  if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(value||''))return null;
  const date=new Date(value+'T00:00:00Z');
  return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value?date:null;
 };
 const format=date=>new Intl.DateTimeFormat('id-ID',{
  weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'
 }).format(date);
 function nextOccurrence(){
  const now=dateAt(today());let date=new Date(now);
  if(frequency.value==='weekly'){
   date.setUTCDate(date.getUTCDate()+(Number(weekday.value)-date.getUTCDay()+7)%7);
  }else if(frequency.value==='biweekly'){
   const base=dateAt(anchor.value);if(!base)return null;
   const cycles=Math.max(0,Math.ceil((now-base)/86400000/14));
   date=new Date(base.getTime()+cycles*14*86400000);
  }else{
   const n=Number(monthly.value),year=date.getUTCFullYear(),month=date.getUTCMonth();
   const occurrence=(y,m)=>new Date(Date.UTC(y,m,Math.min(n,new Date(Date.UTC(y,m+1,0)).getUTCDate())));
   date=occurrence(year,month);
   if(date<now)date=occurrence(year,month+1);
  }
  return date;
 }
 function update(){
  weekdayField.hidden=frequency.value==='monthly'||frequency.value==='biweekly';
  anchorField.hidden=frequency.value!=='biweekly';
  monthField.hidden=frequency.value!=='monthly';

function accountStatus(a){
 const enabled=a.aktif??a.active??a.is_active;
 if(enabled===false||enabled===0||enabled==='0')return 'Nonaktif';
 const state=String(a.status||a.account_status||'').trim();
 if(/nonaktif|inactive|disabled|suspend/i.test(state))return 'Nonaktif';

  headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});

 form.append(grid);const note=el('p','','f4-admin-note'),actions=el('div',undefined,'f4-warga-form-actions');
 const save=button(isNew?'Tambah':'Simpan Perubahan',()=>{if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))},'f4-admin-primary');
 actions.append(button('Batal',openWarga,'sa-action'),save);form.append(note,actions);card.append(form);
 form.addEventListener('submit',async event=>{
  event.preventDefault();
  const data={action:mode};
  for(const control of form.querySelectorAll('[name]')){
   const val=String(control.value||'').trim();
   if(control.required&&!val){note.textContent=control.name+' wajib diisi.';control.focus();return}
   data[control.name]=val;
  }
  if(mode==='edit_house')data.household_id=row.household_id;
  if(mode==='edit_resident'){data.payer_id=row.payer_id;data.active=row.active!==0}
  save.disabled=true;note.textContent='Menyimpan perubahan…';
  try{
   const response=await fetch(API+'/api/v2/admin/residents',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
   const result=await response.json().catch(()=>({}));
   if(!response.ok||result.ok===false)throw Error(result.error||'HTTP '+response.status);
   await openWarga();
   const message=el('p','Data berhasil disimpan.','sa-chip');main.insertBefore(message,main.children[1]||null);
  }catch(e){note.textContent='Gagal menyimpan: '+safe(e)}
  finally{save.disabled=false}
 });
}

async function boot(){
 try{
  const s=await get('/api/v2/auth/session');
  role=String(s?.account?.role||s?.role||'').toLowerCase();
  if(role!=='superadmin')throw Error('Hanya role Superadmin yang memiliki izin masuk. Silakan login dengan akun berwenang.');
  document.body.classList.add('role-superadmin');guard.hidden=true;root.hidden=false;
  const own=location.hash.replace(/^#sa-/,'');
  let requested=own.split('/')[0],initialModule=own.split('/')[1]||'';
  // Existing bookmarks to the removed duplicate Bagi Hasil open the restored schedule.
  if(requested==='bank'&&initialModule==='bank_split')initialModule='bank_weighing';
  // Match the parent URL before first paint; do not paint Overview and then
  // immediately replace it with Content/Data Acuan (visible as a flash).
  if(window.parent!==window){
   try{
    const parentFragment=window.parent.location.hash.match(/^#superadmin\/(overview|treasury|accounts|content|bank|masters|audit)$/)?.[1];
    if(parentFragment)requested=parentFragment;
   }catch{}
  }
  open(groups.some(x=>x[0]===requested)?requested:'overview',false);
  if(initialModule&&submenu[group]?.some(([key])=>key===initialModule))openEditor(initialModule);
  f4SaNav.ready=true;
  history.replaceState({...history.state,f4SaDrawer:false,f4SaRoute:{group,kind:active}},'',location.href);
  if(window.parent!==window)window.parent.postMessage({type:'f4:ready',portal:'superadmin'},location.origin);
 }catch(e){guard.replaceChildren(el('h2','Akses Portal Superadmin ditolak'),el('p',safe(e)));guard.append(button('Kembali ke Portal Utama',()=>{
   if(window.parent!==window)window.parent.postMessage({type:'f4:go-portal',portal:'portal'},location.origin);
   else location.href='/';
 },'sa-action'));}
}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==window.parent)return;
 if(e.data?.type==='f4:superadmin-open-section'&&e.data.section!==group)open(e.data.section);
});
boot();
