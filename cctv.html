<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live CCTV Lorong | Flamboyan 4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Library HLS.js Murni JS untuk Browser -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold flex items-center space-x-1">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Kembali ke Portal</span>
        </a>
        <h1 class="text-sm font-bold text-white flex items-center space-x-2">
          <i data-lucide="video" class="w-5 h-5 text-emerald-400"></i>
          <span>Web VMS Monitoring CCTV Lorong</span>
        </h1>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 flex-grow w-full space-y-4">
    <!-- Grid 7 Kamera CCTV -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <script>
        const camTitles = [
          "CAM 01 - Portal Gerbang Depan",
          "CAM 02 - Gang Utama 1",
          "CAM 03 - Gang Utama 2",
          "CAM 04 - Area Pos Kamling",
          "CAM 05 - Blok Belakang 1",
          "CAM 06 - Blok Belakang 2",
          "CAM 07 - Sudut Ujung Lorong"
        ];

        for (let i = 1; i <= 7; i++) {
          document.write(`
            <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex flex-col justify-between shadow-md">
              <div class="p-2.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-xs">
                <span class="font-bold text-slate-200 flex items-center space-x-1.5">
                  <i data-lucide="camera" class="w-3.5 h-3.5 text-indigo-400"></i>
                  <span>${camTitles[i-1]}</span>
                </span>
                <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono">CH ${i}</span>
              </div>

              <div class="relative aspect-video bg-black flex items-center justify-center overflow-hidden">
                <!-- HTML5 Canvas / Video JS Player -->
                <canvas id="cctv-canvas-${i}" class="w-full h-full hidden object-contain"></canvas>
                <video id="cctv-video-${i}" class="w-full h-full hidden" autoplay muted playsinline></video>
                
                <div id="cctv-placeholder-${i}" class="text-center p-4">
                  <i data-lucide="video-off" class="w-8 h-8 text-slate-600 mx-auto mb-2"></i>
                  <p class="text-xs text-slate-400 font-medium">${camTitles[i-1]}</p>
                  <p class="text-[10px] text-slate-500 mt-1">Gunakan mode HTTP/HLS atau DDNS</p>
                </div>
              </div>

              <div class="p-2 bg-slate-950 border-t border-slate-800 flex justify-between items-center text-[11px] text-slate-400">
                <button onclick="startJsSnapshotStream(${i})" class="text-emerald-400 hover:text-emerald-300 font-semibold flex items-center space-x-1">
                  <i data-lucide="play" class="w-3.5 h-3.5"></i>
                  <span>Putar JS Stream</span>
                </button>
                <a href="http://192.168.1.2" target="_blank" class="hover:text-white flex items-center space-x-1">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>Akses DVR Direct</span>
                </a>
              </div>
            </div>
          `);
        }
      </script>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // SCRIPT JAVASCRIPT UNTUK MEMUTAR CAMERA SNAPSHOT LOOP DIRECT DARI BROWSER
    function startJsSnapshotStream(channel) {
      const canvas = document.getElementById(`cctv-canvas-${channel}`);
      const placeholder = document.getElementById(`cctv-placeholder-${channel}`);
      const ctx = canvas.getContext('2d');

      placeholder.classList.add('hidden');
      canvas.classList.remove('hidden');

      // Alamat IP DVR Lokal
      const dvrIp = "192.168.1.2"; //[cite: 2]
      
      // Mengambil snapshot frame tiap 1 detik menggunakan Pure JS Image
      setInterval(() => {
        const img = new Image();
        // Endpoint snapshot umum DVR Xiongmai/XMEye/Hikvision
        img.src = `http://${dvrIp}/cgi-bin/snapshot.cgi?channel=${channel}&time=` + new Date().getTime();
        
        img.onload = function() {
          canvas.width = img.width || 640;
          canvas.height = img.height || 360;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
      }, 1000);
    }
  </script>
</body>
</html>
