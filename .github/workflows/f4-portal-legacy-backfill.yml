name: F4 Portal Arisan Jersey D1 Backfill
on:
  push:
    branches: [main]
    paths:
      - cloudflare/migrations/20261025_portal_legacy_arisan_jersey.sql
      - .github/workflows/f4-portal-legacy-backfill.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f4-portal-legacy-safe-backfill
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Backfill Arisan and Jersey only; never touch bookkeeping transactions
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,urllib.request
          account=os.environ['CF_ACCOUNT'];token=os.environ['CF_TOKEN']
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def cf(path,method='GET',data=None):
              h={'Authorization':'Bearer '+token,'Accept':'application/json'}
              if data is not None:h['Content-Type']='application/json'
              req=urllib.request.Request(base+path,headers=h,method=method,
                  data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(req,timeout=50) as res:d=json.load(res)
              if d.get('success') is not True:raise RuntimeError('Cloudflare operation rejected')
              return d.get('result')
          target=next((x for x in cf('/d1/database') if x.get('name')=='flamboyan4-staging'),None)
          if not target:raise RuntimeError('D1 staging database not found')
          settings=cf('/workers/scripts/flamboyan4-terpadu-staging/settings')
          bind=next((x for x in settings.get('bindings',[]) if x.get('name')=='DB'),None)
          if bind is None or bind.get('type')!='d1' or bind.get('id')!=target['uuid']:
              raise RuntimeError('Worker database binding mismatch: stop')
          path='/d1/database/'+target['uuid']+'/query'
          def sql(query):
              res=cf(path,'POST',{'sql':query})
              if not isinstance(res,list) or len(res)!=1 or res[0].get('success') is not True:
                  raise RuntimeError('Cloudflare D1 SQL refused')
              return res[0].get('results') or []
          source=pathlib.Path('cloudflare/migrations/20261025_portal_legacy_arisan_jersey.sql').read_text()
          content='\n'.join(l for l in source.splitlines() if l.strip() and not l.lstrip().startswith('--'))
          statements=[x.strip() for x in content.split(';') if x.strip()]
          if len(statements)!=4:raise RuntimeError('Unexpected number of migration statements')
          expected=('CREATE TABLE IF NOT EXISTS PORTAL_ARISAN_SCHEDULE',
                    'CREATE TABLE IF NOT EXISTS PORTAL_JERSEY_ORDERS',
                    'INSERT OR IGNORE INTO PORTAL_ARISAN_SCHEDULE',
                    'INSERT OR IGNORE INTO PORTAL_JERSEY_ORDERS')
          for statement,prefix in zip(statements,expected):
              if not statement.upper().startswith(prefix):raise RuntimeError('Non-approved SQL operation: stop')
              # These public-data inserts never update/delete financial ledgers.
              if re.search(r'\b(UPDATE|DELETE|DROP|ALTER)\b',re.sub(r"'(?:''|[^'])*'","''",statement),re.I):
                  raise RuntimeError('Destructive SQL rejected')
          for statement in statements:sql(statement)
          arisan=sql('SELECT COUNT(*) AS n FROM portal_arisan_schedule')[0]['n']
          jersey=sql('SELECT COUNT(*) AS n FROM portal_jersey_orders')[0]['n']
          if arisan<26 or jersey<26:raise RuntimeError('Data row count insufficient')
          print('PORTAL_ARISAN_D1_ROWS='+str(arisan))
          print('PORTAL_JERSEY_D1_ROWS='+str(jersey))
          # Historical Firebase chat is imported once by stable source keys.
          # Firebase remains read-only, while Portal frontend reads D1 only.
          import hashlib,datetime,urllib.error
          from zoneinfo import ZoneInfo
          firebase_url='https://flamboyan4-chat-default-rtdb.firebaseio.com/komentar_warga.json'
          try:
              request=urllib.request.Request(firebase_url,headers={'Accept':'application/json','User-Agent':'Flamboyan4-Historical-Migration/1.0'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  records=json.load(response)
          except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as e:
              print('FIREBASE_HISTORY_READ_UNAVAILABLE='+type(e).__name__)
              records=None
          if records is not None:
              if not isinstance(records,dict):
                  raise RuntimeError('Firebase comments source returned unexpected structure')
              rows=[];invalid=0
              months={'jan':1,'feb':2,'mar':3,'apr':4,'mei':5,'jun':6,'jul':7,'agu':8,'sep':9,'okt':10,'nov':11,'des':12}
              for key,row in records.items():
                  if not isinstance(row,dict):
                      invalid+=1;continue
                  name=row.get('nama');message=row.get('pesan')
                  if not isinstance(name,str) or not isinstance(message,str) or not name.strip() or not message.strip():
                      invalid+=1;continue
                  date=row.get('timestamp')
                  if isinstance(date,(int,float)) and 1e11<date<5e12:
                      created_at=datetime.datetime.fromtimestamp(date/1000,datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S')
                  else:
                      raw=str(row.get('waktu') or '')
                      m=re.match(r'^\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4}),?\s+(\d{1,2})[:.](\d{2})',raw)
                      if m and m[2].lower() in months:
                          local=datetime.datetime(int(m[3]),months[m[2].lower()],int(m[1]),int(m[4]),int(m[5]),tzinfo=ZoneInfo('Asia/Jakarta'))
                          created_at=local.astimezone(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S')
                      else:created_at=raw
                  stable='komentar:firebase:'+hashlib.sha256(str(key).encode('utf-8')).hexdigest()[:32]
                  rows.append((stable,name.strip(),message.strip(),'aktif',created_at))
              for start in range(0,len(rows),25):
                  batch=rows[start:start+25]
                  statement='INSERT OR IGNORE INTO portal_comments(id,display_name,body,status,created_at) VALUES '+','.join(['(?,?,?,?,?)']*len(batch))
                  values=[v for row in batch for v in row]
                  res=cf(path,'POST',{'sql':statement,'params':values})
                  if not isinstance(res,list) or len(res)!=1 or res[0].get('success') is not True:
                      raise RuntimeError('Firebase D1 historical comment migration failed')
              print('FIREBASE_SOURCE_COMMENTS='+str(len(records)))
              print('D1_HISTORICAL_COMMENTS_PARSED='+str(len(rows)))
              print('FIREBASE_MALFORMED_ENTRIES='+str(invalid))
              print('FIREBASE_SOURCE_NOT_MODIFIED=1')
          print('TRANSAKSI_KEUANGAN_DIUBAH=0')
          PY
