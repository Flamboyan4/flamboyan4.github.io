name: F4 Gallery Video Proxy Read-only Acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/f4-gallery-video-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe actual public Google Drive video via Worker (HEAD + 4 KiB Range)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          import re
          base='https://api.flamboyan4.web.id/api/v2/gallery/video/'
          known_video='1z_OvFon4dQ_CD8ucIvfR22ZZZp0rYYr9'
          headers={'Origin':'https://flamboyan4.web.id','User-Agent':'F4-video-readonly-acceptance/1.0'}
          url=base+known_video
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method='HEAD'),timeout=25) as res:
              assert res.status==200,('video HEAD',res.status)
              assert res.headers.get('Content-Type','').startswith('video/'),res.headers.get('Content-Type')
              assert res.headers.get('Accept-Ranges')=='bytes'
              print('VIDEO_PROXY_HEAD_OK',res.status,res.headers.get('Content-Type'),res.headers.get('Content-Length'))
          request=urllib.request.Request(url,headers={**headers,'Range':'bytes=0-4095'})
          with urllib.request.urlopen(request,timeout=30) as res:
              assert res.status==206,('Range must be partial',res.status)
              assert re.match(r'^bytes 0-[0-9]+/[0-9]+,res.headers.get('Content-Range','')),res.headers.get('Content-Range')
              chunk=res.read(4096)
              assert 0<len(chunk)<=4096,('invalid binary response',len(chunk))
              assert not chunk.lstrip().startswith((b'<',b'{')), 'Unexpected HTML or JSON video'
              print('VIDEO_PROXY_RANGE_OK',res.status,len(chunk),res.headers.get('Content-Range'))
          for bad in ['not-valid','1_FmEN71Q5N7GEOY-Ufiperw6vb8LpZvX']:
              try:
                  urllib.request.urlopen(urllib.request.Request(base+bad,headers=headers,method='HEAD'),timeout=18)
                  raise AssertionError('Non-video / invalid file ID became public')
              except urllib.error.HTTPError as blocked:
                  assert blocked.code in (403,404),('Unexpected access status',blocked.code)
              print('VIDEO_NONPUBLIC_REJECTED',bad[:8])
          PY
,res.headers.get('Content-Range','')),res.headers.get('Content-Range')
              chunk=res.read(4096)
              assert 0<len(chunk)<=4096,('invalid binary response',len(chunk))
              assert not chunk.lstrip().startswith((b'<',b'{')), 'Unexpected HTML or JSON video'
              print('VIDEO_PROXY_RANGE_OK',res.status,len(chunk),res.headers.get('Content-Range'))
          for bad in ['not-valid','1_FmEN71Q5N7GEOY-Ufiperw6vb8LpZvX']:
              try:
                  urllib.request.urlopen(urllib.request.Request(base+bad,headers=headers,method='HEAD'),timeout=18)
                  raise AssertionError('Non-video / invalid file ID became public')
              except urllib.error.HTTPError as blocked:
                  assert blocked.code in (403,404),('Unexpected access status',blocked.code)
              print('VIDEO_NONPUBLIC_REJECTED',bad[:8])
          PY
