name: Persistent app shell checks
on:
  push:
    branches:
      - migration/persistent-app-shell
    paths:
      - 'spa-preview/**'
      - '.github/workflows/persistent-shell-checks.yml'
permissions:
  contents: read
jobs:
  preview-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spa-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
