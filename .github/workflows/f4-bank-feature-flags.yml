name: F4 Complete Missing Bank Feature Flags
on:
  push:
    branches: [ops-cloudflare-integration-20261025]
    paths: [.github/workflows/f4-bank-feature-flags.yml]
permissions:
  contents: write
concurrency:
  group: f4-worker-release
  cancel-in-progress: false
jobs:
  feature-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Add missing flags as false without changing transactional data
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,datetime,hashlib
          from pathlib import Path
          out=Path("ops-audit/bank-flags-status.json");out.parent.mkdir(exist_ok=True)
          result={"at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"status":"started"}
          def save():out.write_text(json.dumps(result,indent=2)+"\n")
          save()
          try:
            root="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]
            tok=os.environ["CF_TOKEN"];target="flamboyan4-terpadu-staging"
            def call(path,method="GET",body=None,content_type=None):
              headers={"Authorization":"Bearer "+tok}
              if content_type:headers["Content-Type"]=content_type
              req=urllib.request.Request(root+path,data=body,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=80) as resp:r=json.load(resp)
              if not r.get("success"):raise ValueError("Cloudflare API rejected: "+str([e.get("code") for e in r.get("errors",[])]))
              return r.get("result")
            expected_deploy="ae468eee-34ec-43bd-979f-e1dc84c939f6"
            history=call("/workers/scripts/"+target+"/deployments").get("deployments") or []
            if not history or history[0].get("id")!=expected_deploy:raise ValueError("Unexpected deployment version - abort")
            cfg=call("/workers/scripts/"+target+"/settings")
            fields={v["name"]:v for v in cfg["bindings"]}
            required=["BANK_CANCEL_WRITE_ENABLED","BANK_EXPENSE_WRITE_ENABLED","BANK_INVENTORY_WRITE_ENABLED","BANK_MEDIA_WRITE_ENABLED","BANK_PAYOUT_WRITE_ENABLED","BANK_RECONCILIATION_WRITE_ENABLED"]
            expected_active={"FINANCE_WRITE_ENABLED","MANUAL_CASH_WRITE_ENABLED"}
            active={k for k,v in fields.items() if k.endswith("_WRITE_ENABLED") and str(v.get("text","")).lower()=="true"}
            if active!=expected_active:raise ValueError("Unexpected active write flags - abort")
            if any(k in fields for k in required):raise ValueError("Missing bank flags already exist - abort")
            if fields.get("DB",{}).get("type")!="d1" or fields.get("PHOTOS",{}).get("type")!="r2_bucket":raise ValueError("DB/R2 missing")
            p=Path("cloudflare/worker-terpadu-operasional-teruji.js")
            data=p.read_bytes()
            if hashlib.sha256(data).hexdigest()!="6f913d0d99457c66440d0241fc27e1e64d3f2152cbb4cfff1187ac68c9c59f11":raise ValueError("Candidate checksum mismatch")
            meta={"main_module":"main.js","keep_assets":True,
              "compatibility_date":cfg.get("compatibility_date") or "2026-10-21",
              "bindings":[{"type":"inherit","name":name} for name in fields]+[{"type":"plain_text","name":name,"text":"false"} for name in required]}
            boundary="----F4MissingFeatureFlags"
            def part(name,body,mime):
              return ('--'+boundary+'\r\nContent-Disposition: form-data; name="'+name+'"; filename="'+name+'"\r\nContent-Type: '+mime+'\r\n\r\n').encode()+body+b'\r\n'
            body=part("metadata",json.dumps(meta).encode(),"application/json")+part("main.js",data,"application/javascript+module")+('--'+boundary+'--\r\n').encode()
            call("/workers/scripts/"+target+"?bindings_inherit=strict","PUT",body,"multipart/form-data; boundary="+boundary)
            actual=call("/workers/scripts/"+target+"/settings")
            flags={v["name"]:v for v in actual.get("bindings",[])}
            missing=[k for k in required if k not in flags or str(flags[k].get("text","")).lower()!="false"]
            nowactive={k for k,v in flags.items() if k.endswith("_WRITE_ENABLED") and str(v.get("text","")).lower()=="true"}
            if missing or nowactive!=expected_active or flags.get("DB",{}).get("type")!="d1" or flags.get("PHOTOS",{}).get("type")!="r2_bucket":
              raise ValueError("Post-deploy verification failed")
            deployed=call("/workers/scripts/"+target+"/deployments").get("deployments") or []
            result.update(status="pass",flags_added=required,active_write_flags=sorted(nowactive),deployment_id=deployed[0].get("id"))
          except Exception as e:
            result.update(status="failed",error=type(e).__name__+": "+str(e)[:220])
            save()
            raise
          save()
          print("Six missing Bank Sampah flags installed in disabled state.")
          PY
      - name: Record result
        if: always()
        run: |
          test -f ops-audit/bank-flags-status.json || echo '{"status":"workflow_error"}' > ops-audit/bank-flags-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-audit/bank-flags-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ops): record Bank Sampah missing flag install"
          git push origin HEAD:ops-cloudflare-integration-20261025
