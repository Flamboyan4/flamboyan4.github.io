name: F4 Read-only Gallery Reaction Audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/f4-social-reactions-readonly-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only aggregate audit of reactions and comments in live D1
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,re
          account=os.environ.get("CF_ACCOUNT")
          token=os.environ.get("CF_TOKEN")
          if not account or not token:raise RuntimeError("Production Cloudflare credentials unavailable")
          api="https://api.cloudflare.com/client/v4/accounts/"+account
          def api_call(path,method="GET",payload=None):
            req=urllib.request.Request(api+path,data=json.dumps(payload).encode() if payload else None,
              method=method,headers={"Authorization":"Bearer "+token,"Accept":"application/json",
              **({"Content-Type":"application/json"} if payload else {})})
            with urllib.request.urlopen(req,timeout=45) as response:body=json.load(response)
            if body.get("success") is not True:raise RuntimeError("Cloudflare refused read-only query")
            return body.get("result")
          domains=api_call("/workers/domains?hostname=api.flamboyan4.web.id")
          target=[d for d in domains if d.get("hostname")=="api.flamboyan4.web.id" and d.get("enabled")]
          if len(target)!=1:raise RuntimeError("Cannot prove the live production Worker")
          worker=target[0].get("service")
          if not re.fullmatch(r"[-_A-Za-z0-9]+",worker or ""):raise RuntimeError("Invalid live Worker name")
          settings=api_call("/workers/scripts/"+worker+"/settings")
          binding=next((b for b in settings.get("bindings",[]) if b.get("name")=="DB" and b.get("type")=="d1"),None)
          if not binding:raise RuntimeError("Live Worker D1 binding unavailable")
          uuid=binding.get("id")
          if not re.fullmatch(r"[a-f0-9-]{36}",uuid or ""):raise RuntimeError("Invalid database ID")
          print("READ_ONLY_PRODUCTION_SOCIAL_AUDIT")
          def query(sql):
            res=api_call("/d1/database/"+uuid+"/query","POST",{"sql":sql})
            if not isinstance(res,list) or not res:return []
            if res[0].get("success") is False:raise RuntimeError("Read-only query failed")
            return res[0].get("results",[])
          for label,sql in [
            ("REACTION_TOTALS","SELECT target_type,COUNT(*) AS votes,COUNT(DISTINCT target_id) AS targets FROM f4_gallery_reactions GROUP BY target_type"),
            ("COMMENT_TOTALS","SELECT target_type,status,COUNT(*) AS comments,COUNT(DISTINCT target_id) AS targets FROM f4_gallery_comments GROUP BY target_type,status"),
            ("PHOTO_ID_PREFIX_COUNTS","SELECT CASE WHEN target_id LIKE 'gdrive:%' THEN 'gdrive' WHEN target_id LIKE 'f4photo:%' THEN 'f4photo' WHEN target_id LIKE 'media:%' THEN 'media' ELSE 'other' END AS kind,COUNT(*) AS votes,COUNT(DISTINCT target_id) AS targets FROM f4_gallery_reactions WHERE target_type='photo' GROUP BY kind"),
            ("MOST_LIKED_PHOTOS","SELECT target_id,COUNT(*) AS likes FROM f4_gallery_reactions WHERE target_type='photo' GROUP BY target_id ORDER BY likes DESC LIMIT 20"),
            ("MOST_COMMENTED_PHOTOS","SELECT target_id,COUNT(*) AS comments FROM f4_gallery_comments WHERE target_type='photo' AND status='aktif' GROUP BY target_id ORDER BY comments DESC LIMIT 20"),
            ("RECENT_REACTION_MONTHS","SELECT SUBSTR(created_at,1,7) AS month, COUNT(*) AS votes FROM f4_gallery_reactions GROUP BY month ORDER BY month DESC LIMIT 6")
          ]:
            print(label,json.dumps(query(sql),ensure_ascii=False))
          PY
