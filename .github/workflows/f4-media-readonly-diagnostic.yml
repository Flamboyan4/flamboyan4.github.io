name: F4 Media Read-only Diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/f4-media-readonly-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public gallery metadata and public video transport (no credentials)
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base="https://api.flamboyan4.web.id"
          def jget(path):
              req=urllib.request.Request(base+path,headers={"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"F4-Media-Diagnostic/1"})
              with urllib.request.urlopen(req,timeout=15) as rsp:return json.load(rsp)
          for path in ["/api/v2/public/portal","/api/v2/gallery"]:
              try:
                  data=jget(path)
                  print("RESULT",path,"OK",data.get("ok"),"keys",list(data.keys())[:18])
                  if "documentation" in data:
                      print("PORTAL_DOCUMENTATION_COUNT",len(data["documentation"]))
                      for d in data["documentation"]:
                          if "arisan" in str(d.get("title") or d.get("judul") or "").lower() or "gorol" in str(d.get("title") or d.get("judul") or "").lower():
                              print("DOC",json.dumps({k:d.get(k) for k in ["id","title","date","drive_url","cover","image_ref","active","visibility"]},ensure_ascii=False))
                  if "albums" in data and "photos" in data:
                      print("GALLERY_COUNTS",len(data["albums"]),len(data["photos"]))
                      for a in data["albums"]:
                          if "arisan" in str(a.get("title") or "").lower():
                              print("GALBUM",json.dumps({k:a.get(k) for k in ["id","title","folder","date"]},ensure_ascii=False))
                      for p in data["photos"][:5]:
                          print("GPHOTO",json.dumps({k:p.get(k) for k in ["id","albumId","driveId","url"]}))
              except Exception as e:print("API_FAIL",path,str(e)[:250])
          video="1z_OvFon4dQ_CD8ucIvfR22ZZZp0rYYr9"
          urls=[
           "https://drive.usercontent.google.com/download?id="+video+"&export=download&confirm=t",
           "https://drive.google.com/uc?export=download&id="+video,
           "https://drive.google.com/thumbnail?id="+video+"&sz=w800",
           base+"/api/v2/gallery/video/"+video
          ]
          for url in urls:
              label=url.split("/")[2]+(" proxy" if "api.flamboyan4" in url else " video-or-image")
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-4095"})
                  with urllib.request.urlopen(request,timeout=18) as rsp:
                      body=rsp.read(256)
                      print("VIDEO_PROBE",label,"status",rsp.status,"type",rsp.headers.get("Content-Type"),"length",rsp.headers.get("Content-Length"),"range",rsp.headers.get("Content-Range"),"sig",repr(body[:24]),"finalhost",urllib.request.urlparse(rsp.url).hostname)
              except urllib.error.HTTPError as e:
                  print("VIDEO_HTTP_FAIL",label,"status",e.code,"type",e.headers.get("Content-Type"),"body",repr(e.read(80)))
              except Exception as e:
                  print("VIDEO_OTHER_FAIL",label,str(e)[:200])
          PY
