name: F4 TPQ guarded D1 duplicate reconciliation
# Re-run against audited institution-to-payer identity roles, preserving payment amounts
# Historical migrated payments have NULL payment.household_id; relink to the verified home
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/f4-tpq-d1-reconcile.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f4-d1-tpq-one-time-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate the canonical TPQ identity, reconcile D1 ID links, and recheck balances
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 qa/reconcile_tpq_duplicate_d1.py
