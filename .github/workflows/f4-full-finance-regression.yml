name: Flamboyan 4 - Full Isolated Finance Regression
on:
  workflow_dispatch:
  push:
    branches: [main, finalize-iuran-year-guards-20261025, migrate-portal-public-cash-20261025, bank-safe-reversal-20261025, bank-real-report-member-fix-20261025, bank-album-cover-20261025, bank-progress-photo-final-20261025, bank-authenticated-ui-isolated-20261025, bank-final-private-parity-login-20261025, bank-final-three-deposit-audit-20261025, bank-portal-real-login-browser-20261025, fix-iuran-talangan-portal-pribadi-20261025]
    paths:
      - cloudflare/worker-terpadu-operasional-teruji.js
      - qa/run_isolated_bank_full_e2e.py
      - qa/private_bank_roster_extract.py
      - qa/bank_local_login_integration.py
      - qa/bank_production_readonly_gate.py
      - qa/bank_portal_login_browser_e2e.py
      - portal-live/portal/index.html
      - portal-live/pembukuan/index.html
      - portal-live/bank-sampah/index.html
      - portal-live/superadmin-editor.js
      - uji-terpadu/portal/index.html
      - .github/workflows/f4-full-finance-regression.yml

permissions:
  contents: read

concurrency:
  group: f4-finance-regression-read-only
  cancel-in-progress: false

jobs:
  isolated-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler for local D1
        run: npm install --no-save --ignore-scripts wrangler@4
      - name: Install browser for isolated Admin and Member UI acceptance
        if: github.ref_name == 'main' || github.ref_name == 'bank-authenticated-ui-isolated-20261025' || github.ref_name == 'bank-portal-real-login-browser-20261025'
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Install cryptography for encrypted private roster audit
        if: (github.ref_name == 'bank-final-private-parity-login-20261025' || github.ref_name == 'bank-final-three-deposit-audit-20261025')
        run: python3 -m pip install --quiet cryptography
      - name: Export D1 READ ONLY and test in disposable local clone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          F4_BANK_PRIVATE_AUDIT: ${{ (github.ref_name == 'bank-final-private-parity-login-20261025' || github.ref_name == 'bank-final-three-deposit-audit-20261025') }}
          F4_BANK_BROWSER_QA: ${{ github.ref_name == 'bank-authenticated-ui-isolated-20261025' }}
          F4_BANK_PORTAL_UI: ${{ github.ref_name == 'main' || github.ref_name == 'bank-portal-real-login-browser-20261025' }}
        run: python3 qa/run_isolated_bank_full_e2e.py
      - name: Upload sanitized test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-isolated-finance-result
          path: ops-audit/local-bank-full-e2e.json
          if-no-files-found: error
