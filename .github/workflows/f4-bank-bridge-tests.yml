name: F4 Bank D1 Bridge Regression Tests
on:
  push:
    branches: [ops-cloudflare-integration-20261025]
    paths:
      - portal-live/live-bank-readonly.js
      - portal-live/f4-bank-write-bridge.js
      - uji-terpadu/live-bank-readonly.js
      - uji-terpadu/f4-bank-write-bridge.js
      - .github/workflows/f4-bank-bridge-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and identical code between live/test
        run: |
          node --check portal-live/live-bank-readonly.js
          node --check portal-live/f4-bank-write-bridge.js
          cmp portal-live/live-bank-readonly.js uji-terpadu/live-bank-readonly.js
          cmp portal-live/f4-bank-write-bridge.js uji-terpadu/f4-bank-write-bridge.js
      - name: Test balances, posting and missing allocation detection (mocked, never write D1)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const examples={
            cash:[
              {id:'cash1',occurred_on:'2026-10-25',transaction_type:'penjualan_terkonfirmasi',fund_position:'operasional',cash_in_rp:100,cash_out_rp:0,status:'aktif',source_transaction_id:'sale1'},
              {id:'cash2',occurred_on:'2026-10-25',transaction_type:'pengeluaran',fund_position:'operasional',cash_in_rp:0,cash_out_rp:40,status:'aktif'},
              {id:'cash3',occurred_on:'2026-10-25',transaction_type:'penjualan_terkonfirmasi',fund_position:'tabungan_warga',cash_in_rp:200,cash_out_rp:0,status:'aktif'},
              {id:'cash4',occurred_on:'2026-10-25',transaction_type:'pengeluaran',fund_position:'tabungan_warga',cash_in_rp:0,cash_out_rp:999,status:'dibatalkan'}
            ],
            sales:[
              {id:'sale1',batch_id:'batch1',sold_on:'2026-10-25',status:'terkonfirmasi',amount_received_rp:100},
              {id:'sale2',batch_id:'batch2',sold_on:'2026-10-25',status:'terkonfirmasi',amount_received_rp:300},
              {id:'sale3',batch_id:'batch3',sold_on:'2026-10-25',status:'draft'}
            ],
            allocations:[{id:'allocation1',batch_id:'batch1',receivedRp:100}]
          };
          let writes=0;
          const window={__f4BankDemoCall:()=>Promise.reject(new Error('UNMAPPED'))};
          const context={
            window,console,Date,Intl,URL,URLSearchParams,Blob,Map,Set,Promise,Number,String,Math,Array,Object,
            crypto:globalThis.crypto,
            fetch:async (url,options={})=>{
              if(options.method==='POST') {writes++;throw new Error('Write forbidden in regression test');}
              const entry=Object.entries(examples).find(([key])=>String(url).endsWith('/api/v2/admin/bank/'+key));
              if(!entry)throw new Error('Unexpected GET '+url);
              return {ok:true,json:async()=>({ok:true,data:entry[1]})};
            }
          };
          vm.runInNewContext(fs.readFileSync('portal-live/live-bank-readonly.js','utf8'),context,{filename:'live-bank-readonly.js'});
          const pos=await window.__f4BankDemoCall('bsV10KasPosAdmin',[]);
          assert.equal(pos.kasGabungan,260);
          assert.equal(pos.pos.find(x=>x.kode==='operasional').tersedia,60);
          assert.equal(pos.pos.find(x=>x.kode==='tabungan_warga').tersedia,200);
          assert.equal(pos.pos.find(x=>x.kode==='kas_lorong').tersedia,0);
          const overview=await window.__f4BankDemoCall('bsV9StatusKasAdmin',[]);
          assert.equal(overview.saldoKasTercatat,260);
          assert.equal(overview.batchBelumDiposting.length,1);
          assert.equal(overview.batchBelumDiposting[0].batch,'batch2');
          assert.equal(writes,0);
          console.log('PASS: D1 cash positions, excluded canceled transactions, unposted confirmed batch, no writes');
          JS
      - name: Verify member activation and posting adapter (mock Worker only)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const accounts=[
            {id:'account:A524',username:'a524',role:'anggota',rumah:'A5/24',perluAktivasi:true},
            {id:'account:A525',username:'a525',role:'anggota',rumah:'A5/25',perluAktivasi:true},
            {id:'account:A526',username:'a526',role:'anggota',rumah:'A5/26',perluAktivasi:false}
          ];
          const posts=[];
          const window={__f4BankDemoCall:()=>Promise.reject(new Error('unmapped'))};
          const context={
            window,Date,Intl,URL,URLSearchParams,Map,Set,Promise,Number,String,Math,Object,
            crypto:globalThis.crypto,
            fetch:async(url,options={})=>{
              const path=String(url).replace('https://api.flamboyan4.web.id','');
              let data;
              if(options.method==='POST'){
                const body=JSON.parse(options.body||'{}');posts.push({path,body});
                assert.equal(path,'/api/superadmin/accounts/activate-member');
                assert.equal(body.confirmation,'AKTIFKAN AKUN WARGA');
                data={ok:true,username:accounts.find(a=>a.id===body.accountId)?.username};
              }else if(path==='/api/superadmin/accounts/preview')data={ok:true,akun:accounts};
              else if(path==='/api/v2/admin/bank/allocations?limit=300')data={ok:true,data:[{batch_id:'b1',receivedRp:100}]};
              else if(path==='/api/v2/admin/bank/sales?limit=300')data={ok:true,data:[{id:'sale1',batch_id:'b1',status:'terkonfirmasi'}]};
              else if(path==='/api/v2/admin/bank/cash?limit=300')data={ok:true,data:[{id:'cash1',source_transaction_id:'sale1',status:'aktif',cash_in_rp:100,cash_out_rp:0}]};
              else throw Error('Unexpected GET '+path);
              return {ok:true,status:200,json:async()=>data};
            }
          };
          vm.runInNewContext(fs.readFileSync('portal-live/f4-bank-write-bridge.js','utf8'),context);
          const created=await window.__f4BankDemoCall('authAdminProvisionBatch',[]);
          assert.equal(created.dibuat,2);
          assert.equal(created.tersisa,0);
          const single=await window.__f4BankDemoCall('authAdminResetDefault',['', 'account:A524']);
          assert.equal(single.passwordAwal,'F4-A524');
          await assert.rejects(()=>window.__f4BankDemoCall('authAdminResetDefault',['','account:A526']),/Reset password akun aktif belum tersedia/);
          await assert.rejects(()=>window.__f4BankDemoCall('bsV27BatalkanPengesahan',[]),/Worker belum menyediakan reversal/);
          const posting=await window.__f4BankDemoCall('bsV9PostingKasPenjualan',[]);
          assert.equal(posting.diposting,1);
          assert.equal(posts.length,3);
          console.log('PASS: initial activation, active reset refusal, finalization reversal guard, posting count');
          JS
