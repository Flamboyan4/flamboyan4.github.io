name: F4 Gallery Production Worker Release
# Gallery release 2026-11-23: one Portal photo upload, shared Bank Sampah visibility and social IDs.
run-name: "Gallery API release ${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/f4-gallery-production-release.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Ketik DEPLOY_GALLERY_PRODUCTION untuk mengizinkan publikasi"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: f4-worker-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ github.event_name == 'push' && 'DEPLOY_GALLERY_PRODUCTION' || inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Worker source and gallery tag routes
        run: |
          node --check cloudflare/worker-terpadu-operasional-teruji.js
          node --check portal-live/dokumentasi/community-gallery.js
          python3 - <<'PY'
          from pathlib import Path
          source=Path("cloudflare/worker-terpadu-operasional-teruji.js").read_text()
          for path in ('/api/v2/gallery/tags','/api/v2/gallery/category','/api/v2/gallery/people',
                       '/api/v2/gallery/folder','/api/v2/gallery/image/','/api/v2/gallery/public-video/'):
              if path not in source:
                  raise RuntimeError("Missing gallery API route: "+path)
          if 'CREATE TABLE IF NOT EXISTS f4_gallery_tags' not in source:
              raise RuntimeError("Gallery tag schema missing")
          PY
      - name: Validate target, preserve all bindings, and deploy only on exact confirmation
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib,hashlib,re
          if os.environ["CONFIRMATION"]!="DEPLOY_GALLERY_PRODUCTION":
              raise RuntimeError("Confirmation phrase does not match. Nothing deployed.")
          # Automatic release is deliberately limited to this workflow file's push
          # and still subject to production environment protection rules.
          if os.environ.get("GITHUB_EVENT_NAME") not in ("push","workflow_dispatch"):
              raise RuntimeError("Unsupported release event.")
          # Discover the Worker actually routed to the live API hostname.
          # Never infer production from a Worker script name.
          token=os.environ["CF_TOKEN"];account=os.environ["CF_ACCOUNT"]
          if not token or not account:raise RuntimeError("Cloudflare GitHub secrets missing")
          base="https://api.cloudflare.com/client/v4/accounts/"+account
          def call(path,method="GET",payload=None,ctype=None):
              hdr={"Authorization":"Bearer "+token,"Accept":"application/json"}
              if ctype:hdr["Content-Type"]=ctype
              request=urllib.request.Request(base+path,data=payload,headers=hdr,method=method)
              with urllib.request.urlopen(request,timeout=70) as response:
                  data=json.load(response)
              if data.get("success") is not True:
                  raise RuntimeError("Cloudflare refused request: "+str(data.get("errors")))
              return data.get("result")
          domains=call("/workers/domains?hostname=api.flamboyan4.web.id")
          routes=[d for d in domains if d.get("hostname")=="api.flamboyan4.web.id" and d.get("enabled") is True]
          if len(routes)!=1:
              raise RuntimeError("Expected exactly one enabled Worker custom domain for api.flamboyan4.web.id. No deployment.")
          worker=str(routes[0].get("service") or "")
          if not re.fullmatch(r"[A-Za-z0-9_-]{4,100}",worker):
              raise RuntimeError("Mapped Worker name invalid. No deployment.")
          if routes[0].get("environment") not in (None,"","production"):
              raise RuntimeError("API domain is not attached to the production environment.")
          settings=call("/workers/scripts/"+worker+"/settings")
          bindings=settings.get("bindings") or []
          names={b.get("name"):b for b in bindings}
          if names.get("DB",{}).get("type")!="d1":
              raise RuntimeError("Live domain Worker is missing D1. No deployment.")
          uuid=str(names["DB"].get("id") or "")
          if not re.fullmatch(r"[a-fA-F0-9-]{36}",uuid):
              raise RuntimeError("Live D1 binding has invalid UUID. No deployment.")
          if names.get("PHOTOS",{}).get("type")!="r2_bucket" or names.get("ASSETS",{}).get("type")!="assets":
              raise RuntimeError("Required R2/ASSETS binding not recognized. No deployment.")
          databases=call("/d1/database")
          production=next((d for d in databases if d.get("uuid")==uuid),None)
          if not production:
              raise RuntimeError("Live Worker D1 database was not found. No deployment.")
          print("VERIFIED_LIVE_DOMAIN_WORKER="+worker+" D1_NAME="+str(production.get("name") or "unknown"))
          script=pathlib.Path("cloudflare/worker-terpadu-operasional-teruji.js").read_bytes()
          if len(script)<200000:raise RuntimeError("Worker source truncated")
          flags={k:v.get("text") for k,v in names.items() if k.endswith("_WRITE_ENABLED")}
          metadata={"main_module":"main.js","keep_assets":True,
                    "compatibility_date":settings.get("compatibility_date") or "2026-10-21",
                    "bindings":[{"name":b["name"],"type":"inherit"} for b in bindings],
                    "annotations":{"workers/message":"F4 gallery tags + album categories; preserve bindings"}}
          boundary="----F4GallerySafeDeploy"
          def part(name,raw,mime):
              return (("--"+boundary+"\r\nContent-Disposition: form-data; name=\""+name+"\"; filename=\""+name+"\"\r\nContent-Type: "+mime+"\r\n\r\n").encode()+raw+b"\r\n")
          body=part("metadata",json.dumps(metadata).encode(),"application/json")+part("main.js",script,"application/javascript+module")+("--"+boundary+"--\r\n").encode()
          call("/workers/scripts/"+worker+"?bindings_inherit=strict","PUT",body,"multipart/form-data; boundary="+boundary)
          after=call("/workers/scripts/"+worker+"/settings")
          after_names={b.get("name"):b for b in after.get("bindings") or []}
          if set(after_names)!=set(names) or after_names.get("DB",{}).get("id")!=uuid:
              raise RuntimeError("CRITICAL: post-deployment binding mismatch")
          if any(after_names.get(k,{}).get("text")!=value for k,value in flags.items()):
              raise RuntimeError("CRITICAL: post-deployment write flag mismatch")
          print("GALLERY_PRODUCTION_DEPLOY_OK worker="+worker+" d1="+uuid)
          print("SOURCE_SHA256="+hashlib.sha256(script).hexdigest())
          print("BINDINGS_PRESERVED="+str(len(names)))
          PY
      - name: Verify live tag endpoints after release (read-only)
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          base="https://api.flamboyan4.web.id"
          headers={"Origin":"https://flamboyan4.web.id","Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Flamboyan4-Gallery-Release-Smoketest/1.0"}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=25) as response:
                  return json.load(response)
          gallery=get("/api/v2/gallery")
          assert gallery.get("ok") is True,"Public gallery unavailable after release"
          ranked=get("/api/v2/gallery/popular")
          archive=[p for p in ranked.get("popular",[]) if str(p.get("id","")).startswith("gdrive:")]
          print("LIVE_SOCIAL_RANK_ARCHIVE_COUNT="+str(len(archive)))
          print("LIVE_SOCIAL_RANK_ARCHIVE_SAMPLE="+str([(p.get("id"),p.get("likes"),p.get("commentCount")) for p in archive[:8]]))
          assert len(archive)>=4,"Archived popular photos with preserved likes/comments were not restored"
          assert any(int(p.get("likes") or 0)>=2 for p in archive),"Most liked archive photo is missing from ranking"
          # Diagnostic for archival photos: only a known, formerly public documentation folder.
          # Its result is read-only and no OAuth tokens are logged.
          from urllib.error import HTTPError
          archive_ref="gfolder:1ywp2v8rUH-oAGcM91PQyVrO7Wx9iLdCA"
          try:
              archived=get("/api/v2/gallery/folder?"+urllib.parse.urlencode({"album":archive_ref}))
              print("LIVE_ARCHIVE_FOLDER_HTTP=200 PHOTO_COUNT="+str(len(archived.get("media") or [])))
          except HTTPError as e:
              print("LIVE_ARCHIVE_FOLDER_HTTP="+str(e.code)+" (check Drive OAuth permissions if not 200)")
          # Verify a real MP4 response and Range semantics from the public archive stream.
          video="1z_OvFon4dQ_CD8ucIvfR22ZZZp0rYYr9"
          request=urllib.request.Request(base+"/api/v2/gallery/public-video/"+video,
              headers={**headers,"Range":"bytes=0-4095"})
          with urllib.request.urlopen(request,timeout=30) as response:
              chunk=response.read(4096)
              if response.status!=206 or response.headers.get("Content-Type")!="video/mp4" or chunk[4:8]!=b"ftyp":
                  raise RuntimeError("Public video proxy did not return playable MP4 byte-range data")
              print("LIVE_PUBLIC_ARCHIVE_MP4_STREAM_OK status=206 bytes="+str(len(chunk)))
          assert isinstance(gallery.get("categories"),list),"New gallery API not active"
          items=gallery.get("albums") or []
          if items:
              album=str(items[0]["id"])
              q=urllib.parse.urlencode({"type":"album","id":album})
              tagged=get("/api/v2/gallery/tags?"+q)
              assert tagged.get("ok") is True and isinstance(tagged.get("tags"),list),"Tag endpoint failed"
              category=get("/api/v2/gallery/category?"+urllib.parse.urlencode({"album":album}))
              assert category.get("ok") is True,"Category endpoint failed"
          bank=get("/api/v2/public/bank")
          assert bank.get("ok") is True and isinstance(bank.get("albums"),list),"Bank gallery unavailable"
          # Existing Portal photo categories remain read-only for visitors.
          if gallery.get("photos"):
              photo_id=str(gallery["photos"][0]["id"])
              photo_query=urllib.parse.urlencode({"type":"photo","id":photo_id})
              assigned=get("/api/v2/gallery/category?"+photo_query)
              assert assigned.get("ok") is True and "category" in assigned and assigned.get("canEdit") is False,"Shared photo program tag route failed"
              print("LIVE_PHOTO_PROGRAM_TAG_READ_OK")
          for item in bank.get("albums",[]):
              if str(item.get("id","")).startswith("galbum:"):
                  detail=get("/api/v2/public/bank/album/"+urllib.parse.quote(item["id"],safe=""))
                  assert detail.get("ok") is True and len(detail.get("media") or [])>0,"Tagged bank album has no linked public gallery photos"
                  assert all(str(x.get("id","")).startswith("f4photo:") for x in detail["media"]),"Bank gallery replaced original photo IDs"
          print("LIVE_GALLERY_TAG_AND_BANK_READ_SMOKE_OK")
          PY
