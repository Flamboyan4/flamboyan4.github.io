name: F4 Home Stories Ranking Browser Smoke
on:
  push:
    branches: [main]
    paths: [.github/workflows/f4-home-stories-browser-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.57.0
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Verify latest and popular rank real preserved likes
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          import {existsSync} from 'node:fs';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(existsSync);
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1366,height:768}});
          page.on('pageerror',e=>console.log('STORIES_PAGE_ERROR',String(e).slice(0,280)));
          page.on('console',m=>{if(m.type()==='error')console.log('STORIES_CONSOLE_ERROR',m.text().slice(0,220))});
          const snapshot=()=>page.locator('#f4g-home-grid .f4g-home-card').evaluateAll(cards=>cards.map(c=>({
            title:c.querySelector('.f4g-home-title')?.textContent?.trim(),
            likes:Number(c.querySelector('.f4g-home-stats .f4g-home-stat:first-child span')?.textContent||0),
            comments:Number(c.querySelector('.f4g-home-stats .f4g-home-stat:last-child span')?.textContent||0)
          })));
          try{
            await page.goto('https://flamboyan4.web.id/?halaman=beranda',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelectorAll('#f4g-home-grid .f4g-home-card').length===3,null,{timeout:45000});
            await page.locator('#f4g-home-latest').click();
            const latest=await snapshot();
            console.log('STORIES_LATEST',JSON.stringify(latest));
            await page.locator('#f4g-home-popular').click();
            const popular=await snapshot();
            console.log('STORIES_POPULAR',JSON.stringify(popular));
            if(popular.length!==3||popular[0].likes<2)throw Error('Most popular archived photo with two preserved likes is missing');
            if(JSON.stringify(latest)===JSON.stringify(popular))throw Error('Latest and Popular still display identical rows');
            if(!popular.some(x=>x.likes>0))throw Error('Preserved likes are not rendered');
            console.log('STORIES_RANKINGS_CORRECT');
          }finally{await browser.close()}
          JS
