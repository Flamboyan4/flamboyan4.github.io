name: F4 Production Read-only Health Verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/f4-live-production-smoke.yml]
  workflow_dispatch:
  workflow_run:
    workflows: ["F4 Finance Guarded Deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live public routes and private boundaries without credentials
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,sys
          base="https://api.flamboyan4.web.id"
          routes=[
            ("/api/health",200),
            ("/api/v2/system/features",200),
            ("/api/v2/public/portal",200),
            ("/api/v2/public/portal/cash",401),
            ("/api/v2/public/bank",200),
            ("/api/public/bank/weighing-schedule",200),
            ("/api/v2/admin/bank/albums",401),
            ("/api/v2/public/bank/report",401),
            ("/api/member/savings",401),
            ("/api/bookkeeping/reports/yearly?year=2026",401)
          ]
          failed=[]
          for path,expected in routes:
              req=urllib.request.Request(base+path,headers={
                  "Accept":"application/json","Cache-Control":"no-cache",
                  "Origin":"https://flamboyan4.web.id",
                  "User-Agent":"Mozilla/5.0 Flamboyan4-Smoke/1.0"
              })
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      code=response.status
                      data=json.load(response)
                      valid=isinstance(data,dict) and data.get("ok") is not False
                      if path=="/api/v2/public/bank" and valid:
                          albums=data.get("albums") or []
                          catalog=data.get("catalog") or []
                          progress=data.get("progress") or []
                          inventory=data.get("inventory") or []
                          scoped=sum(1 for row in albums if row.get("portal_scope")=="bank-sampah")
                          unscoped=sum(1 for row in albums if row.get("portal_scope") not in ("bank-sampah","portal-utama"))
                          print("BANK_PUBLIC_D1_SOURCE_COUNTS albums="+str(len(albums))+
                            " bank_scoped="+str(scoped)+" missing_scope="+str(unscoped)+
                            " catalog="+str(len(catalog))+" progress="+str(len(progress))+
                            " inventory="+str(len(inventory)))
                          if unscoped:valid=False
                          # Public metadata only: diagnose the single unscoped
                          # legacy album before making any ownership changes.
                          for row in albums[:10]:
                              title=str(row.get("title") or "").replace("\\n"," ").replace("\\r"," ")[:100]
                              category=str(row.get("category") or "").replace("\\n"," ").replace("\\r"," ")[:60]
                              print("PUBLIC_ALBUM_SCOPE_AUDIT title="+repr(title)+
                                " category="+repr(category)+" scope="+repr(row.get("portal_scope")))
                              if row.get("portal_scope")=="bank-sampah" and row.get("id"):
                                  detail_url=base+"/api/v2/public/bank/album/"+urllib.parse.quote(str(row["id"]),safe="")
                                  detail_request=urllib.request.Request(detail_url,headers={
                                      "Accept":"application/json","Origin":"https://flamboyan4.web.id",
                                      "User-Agent":"Mozilla/5.0 Flamboyan4-Smoke/1.0"
                                  })
                                  try:
                                      with urllib.request.urlopen(detail_request,timeout=20) as detail_response:
                                          album_data=json.load(detail_response)
                                          detail_ok=detail_response.status==200 and isinstance(album_data.get("album"),dict)
                                          print(("PASS" if detail_ok else "FAIL")+" BANK_D1_ALBUM_DETAIL"+
                                                " media_count="+str(len(album_data.get("media") or [])))
                                          if not detail_ok:valid=False
                                  except Exception as detail_error:
                                      print("FAIL BANK_D1_ALBUM_DETAIL HTTP/NETWORK="+type(detail_error).__name__)
                                      valid=False

              except urllib.error.HTTPError as error:
                  code=error.code
                  valid=expected==401 and code in (401,403)
              except Exception as error:
                  code=type(error).__name__
                  valid=False
              good=(code==expected or (expected==401 and code==403)) and valid
              print(("PASS" if good else "FAIL")+" "+path+" HTTP="+str(code))
              if not good:failed.append((path,code))
          if failed:raise SystemExit("Live smoke incomplete: "+str(failed))
          print("ALL_PUBLIC_AND_ROLE_BOUNDARY_SMOKES_PASS")
          PY
