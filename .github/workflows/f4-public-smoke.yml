name: F4 Live Public API Smoke
on:
  push:
    branches: [ops-cloudflare-integration-20261025]
    paths: [.github/workflows/f4-public-smoke.yml]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only public endpoint smoke
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, datetime
          from pathlib import Path
          base="https://api.flamboyan4.web.id"
          checks=[
            ("/api/health","public_health"),
            ("/api/v2/public/portal","portal_public"),
            ("/api/v2/public/bank","bank_public"),
            ("/api/v2/public/bank/report","bank_public_report"),
            ("/api/bookkeeping/reports/yearly?year=2026","private_yearly_restricted"),
            ("/api/member/savings","private_savings_restricted")
          ]
          report={"at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"scope":"PUBLIC_GET_NO_COOKIE_NO_ADMIN_TOKEN","checks":[]}
          for path,name in checks:
            request=urllib.request.Request(base+path,headers={"Accept":"application/json","Origin":"https://flamboyan4.web.id","User-Agent":"Mozilla/5.0 Flamboyan4-Smoke/1.0"})
            try:
              with urllib.request.urlopen(request,timeout=20) as response:
                body=response.read(200000)
                code=response.status
                parse_ok=bool(json.loads(body))
            except urllib.error.HTTPError as error:
              code=error.code
              parse_ok=False
            except Exception as e:
              code=None;parse_ok=False
            expected=[200] if name.startswith("public_") or name in ("portal_public","bank_public","bank_public_report") else [401,403]
            report["checks"].append({"test":name,"http":code,"ok":code in expected and (parse_ok if code==200 else True)})
          Path("ops-audit/public-smoke.json").parent.mkdir(exist_ok=True)
          Path("ops-audit/public-smoke.json").write_text(json.dumps(report,indent=2)+"\n")
          for x in report["checks"]:print(x)
          PY
      - name: Save public smoke status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-audit/public-smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ops): record live public API smoke"
          git push origin HEAD:ops-cloudflare-integration-20261025
