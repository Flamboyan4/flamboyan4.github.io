name: F4 Iuran Fine D1 Schema Read Only
on:
  push:
    branches: ['fix/iuran-denda-kebersihan-20261107']
    paths:
      - .github/workflows/f4-iuran-fine-schema-readonly.yml
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only D1 fine schema and triggers (no member data)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          base="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]
          headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"}
          def call(path,data=None):
              req=urllib.request.Request(base+path,headers=headers,data=(json.dumps(data).encode() if data is not None else None))
              with urllib.request.urlopen(req,timeout=20) as response:body=json.load(response)
              if not body.get("success"):raise RuntimeError("D1 read failed")
              return body["result"]
          databases=call("/d1/database")
          db=next((d for d in databases if d.get("name")=="flamboyan4-staging"),None)
          if not db:raise RuntimeError("Staging D1 not found")
          path="/d1/database/"+db["uuid"]+"/query"
          for table in ("bookkeeping_fines","bookkeeping_fine_payments","bookkeeping_dp_cash_links","bookkeeping_dp_request_ledger"):
              r=call(path,{"sql":"PRAGMA table_info("+table+")"})
              print("COLUMNS",table,[{"name":x["name"],"type":x["type"],"notnull":x["notnull"]} for x in r[0].get("results",[])])
          r=call(path,{"sql":"SELECT name,tbl_name,sql FROM sqlite_master WHERE type='trigger' AND tbl_name IN ('bookkeeping_fines','bookkeeping_fine_payments') ORDER BY name"})
          for row in r[0].get("results",[]):
              print("TRIGGER",row["name"],row["tbl_name"],row["sql"])
          PY
