name: F4 Public Website Page & Script Smoke
on:
  push:
    branches: [qa-full-bank-local-20261025]
    paths: [.github/workflows/f4-live-pages-smoke.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: HTTP validation public pages and their local JS dependencies
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,html.parser,datetime
          from pathlib import Path
          root="https://flamboyan4.web.id"
          required=["/","/bank-sampah/","/uji-terpadu/","/uji-terpadu/bank-sampah/","/uji-terpadu/pembukuan/"]
          optional=["/portal-live/","/portal-live/bank-sampah/","/portal-live/pembukuan/","/pembukuan/"]
          result={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"checks":[],"status":"started"}
          class Parser(html.parser.HTMLParser):
            def __init__(self):super().__init__();self.scripts=[]
            def handle_starttag(self,tag,attrs):
              if tag=="script":
                src=dict(attrs).get("src")
                if src:self.scripts.append(src)
          def load(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Flamboyan4-Pages-QA","Accept":"text/html,application/javascript,*/*"})
            try:
              with urllib.request.urlopen(req,timeout=18) as response:return response.status,response.read(900000),response.geturl()
            except urllib.error.HTTPError as e:return e.code,b"",url
            except Exception:return 0,b"",url
          failed=False
          for path in required+optional:
            status,body,final=load(root+path)
            must=path in required
            scripts=[]
            if status==200 and b"<html" in body.lower():
              p=Parser();p.feed(body.decode("utf-8","replace"))
              for ref in p.scripts:
                finalurl=urllib.parse.urljoin(final,ref)
                if urllib.parse.urlparse(finalurl).netloc=="flamboyan4.web.id":
                  js_status,_,_=load(finalurl)
                  scripts.append({"file":urllib.parse.urlparse(finalurl).path,"http":js_status})
            good=status==200 and all(x["http"]==200 for x in scripts)
            result["checks"].append({"path":path,"required":must,"http":status,
                                      "local_scripts_checked":len(scripts),
                                      "broken_scripts":[x for x in scripts if x["http"]!=200],"pass":good})
            if must and not good:failed=True
          result["status"]="pass" if not failed else "fail"
          out=Path("ops-audit/live-site-pages-smoke.json");out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print("Required routes OK:",sum(x["pass"] for x in result["checks"] if x["required"]),"/",len(required))
          if failed:raise SystemExit("At least one required page or script failed")
          PY
      - name: Save non-private findings
        if: always()
        run: |
          test -f ops-audit/live-site-pages-smoke.json || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-audit/live-site-pages-smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(qa): public page and JavaScript health report"
          git push origin HEAD:qa-full-bank-local-20261025
