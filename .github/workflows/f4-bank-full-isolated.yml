name: F4 Isolated Bank Full Financial E2E
on:
  push:
    branches: [qa-full-bank-local-20261025]
    paths:
      - .github/workflows/f4-bank-full-isolated.yml
      - qa/run_isolated_bank_full_e2e.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f4-bank-isolated-full
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-save --ignore-scripts wrangler@4
      - name: Read-only export to LOCAL D1 and test reconciliation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 qa/run_isolated_bank_full_e2e.py
      - name: Save summary - no private source data
        if: always()
        run: |
          test -f ops-audit/local-bank-full-e2e.json || echo '{"status":"workflow_error"}' > ops-audit/local-bank-full-e2e.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-audit/local-bank-full-e2e.json
          git diff --cached --quiet && exit 0
          git commit -m "test(bank): record full isolated 50-50 financial E2E result"
          git push origin HEAD:qa-full-bank-local-20261025
