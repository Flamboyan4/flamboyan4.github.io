name: F4 One-Time Historic Iuran Allocation Reconciliation
on:
  push:
    branches: [main]
    paths: [.github/workflows/f4-legacy-iuran-split.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f4-one-time-historic-iuran-split
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile 68 authentic Excel allocation rows in Cloudflare D1 atomically
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          import json,os,urllib.request
          BASE="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]
          TOKEN=os.environ["CF_TOKEN"]
          def cf(path,method="GET",data=None):
              headers={"Authorization":"Bearer "+TOKEN,"Accept":"application/json"}
              if data is not None:headers["Content-Type"]="application/json"
              req=urllib.request.Request(BASE+path,headers=headers,method=method,data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(req,timeout=75) as response: obj=json.load(response)
              if obj.get("success") is not True:raise RuntimeError("Cloudflare denied migration request")
              return obj.get("result")
          database=next((d for d in cf("/d1/database") if d.get("name")=="flamboyan4-staging"),None)
          if database is None:raise RuntimeError("Expected D1 is unavailable")
          settings=cf("/workers/scripts/flamboyan4-terpadu-staging/settings")
          binding=next((b for b in settings.get("bindings",[]) if b.get("name")=="DB"),None)
          if not binding or binding.get("type")!="d1" or binding.get("id")!=database["uuid"]:
              raise RuntimeError("Worker binding does not match D1")
          target="/d1/database/"+database["uuid"]+"/query"
          def sql(query):
              result=cf(target,"POST",{"sql":query})
              if not isinstance(result,list) or not result or any(part.get("success") is not True for part in result):
                  raise RuntimeError("D1 rejected migration SQL")
              return result[-1].get("results") or []
          # The 68-row source is the original, user-provided Database Pembukuan.xlsx / ALOKASI_IURAN.
          # Exceptions retain original per-payment distinctions: unpaid Arisan, double Kebersihan,
          # partial categories, and zeros. No payment amount is inferred from generic tariffs.
          NO_RT={24,55}
          NO_KEBERSIHAN={11,17,23,34,49,65}
          DOUBLE_KEBERSIHAN={22,54}
          NO_KAS={24,55}
          NO_ARISAN={9,12,15,16,24,32,33,34,39,47,48,55,63,64,65,70}
          def split(n):
              return (0 if n in NO_RT else 25000,
                      40000 if n in DOUBLE_KEBERSIHAN else 0 if n in NO_KEBERSIHAN else 20000,
                      0 if n in NO_KAS else 10000,
                      0 if n in NO_ARISAN else 60000)
          source=sql("""SELECT id,payment_id,payer_id,period_year,period_month,contribution_type,amount_rp,status
          FROM bookkeeping_payment_allocations WHERE id LIKE 'allocation:ALOK%' ORDER BY id""")
          ids={ "allocation:ALOK%04d"%n:n for n in range(4,72)}
          if len(source)<68:raise RuntimeError("Legacy allocation rows missing")
          legacy=[r for r in source if r["id"] in ids]
          new=[r for r in source if r["id"] not in ids]
          if len(legacy)!=68 or new:raise RuntimeError("Unexpected extra/missing legacy rows")
          expected_total=6710000
          if sum(sum(split(n)) for n in range(4,72))!=expected_total:raise RuntimeError("Workbook amounts do not reconcile")
          for r in legacy:
              n=ids[r["id"]]
              payment=(n if n<=8 else {9:3,10:2,11:1}.get(n,n-3))
              month=(9 if 4<=n<=8 or 12<=n<=40 else 10)
              if r["payment_id"]!="payment:PAY%04d"%payment or int(r["period_year"])!=2026 or int(r["period_month"])!=month or r["status"]!="aktif":
                  raise RuntimeError("Legacy payment, period or status differs from original Excel; halt without updates")
          original_legacy=all(r["contribution_type"]=="gabungan" and int(r["amount_rp"])==sum(split(ids[r["id"]])) for r in legacy)
          already_split=all(r["contribution_type"]=="IURAN_BULANAN" and int(r["amount_rp"])==split(ids[r["id"]])[0] for r in legacy)
          if not original_legacy and not already_split:raise RuntimeError("Partially changed legacy state; manual audit needed")
          joined=sql("""SELECT COUNT(*) AS n FROM bookkeeping_payment_allocations a
          LEFT JOIN bookkeeping_payments p ON p.id=a.payment_id
          WHERE a.id LIKE 'allocation:ALOK%' AND (p.id IS NULL OR p.payer_id!=a.payer_id OR p.status!='aktif')""")
          if joined[0]["n"]!=0:raise RuntimeError("Payment references are inconsistent; stop")
          def case(default,zeros=(),override=None,col="NEW.id"):
              pieces=["WHEN 'allocation:ALOK%04d' THEN 0"%n for n in sorted(zeros)]
              pieces+=["WHEN 'allocation:ALOK%04d' THEN %d"%(n,val) for n,val in sorted((override or {}).items())]
              return "(CASE "+col+" "+" ".join(pieces)+" ELSE %d END)"%default
          fields=[
              ("KEBERSIHAN",case(20000,NO_KEBERSIHAN,{22:40000,54:40000})),
              ("KAS_LORONG",case(10000,NO_KAS)),
              ("ARISAN",case(60000,NO_ARISAN))
          ]
          def inspect_post():
              result=sql("""SELECT contribution_type,COUNT(*) AS n,COALESCE(SUM(amount_rp),0) AS total
                FROM bookkeeping_payment_allocations WHERE id LIKE 'allocation:ALOK%' OR id LIKE 'split:allocation:ALOK%'
                GROUP BY contribution_type""")
              values={str(r["contribution_type"]):(int(r["n"]),int(r["total"])) for r in result}
              desired={"IURAN_BULANAN":(68,1650000),"KEBERSIHAN":(62,1280000),
                       "KAS_LORONG":(66,660000),"ARISAN":(52,3120000)}
              if values!=desired:raise RuntimeError("D1 detailed ledger does not reconcile with original workbook")
              print("LEGACY_IURAN_SPLIT_OK=1")
              print("LEGACY_COMPONENT_TOTALS="+json.dumps(values,sort_keys=True))
              print("HISTORIC_TOTAL_UNCHANGED=6710000")
              print("ORIGINAL_PAYMENTS_MODIFIED=0")
          if already_split:
              inspect_post()
          else:
              pre=sql("""SELECT COUNT(*) AS n,COALESCE(SUM(amount_rp),0) AS total FROM bookkeeping_payment_allocations""")
              if int(pre[0]["total"])!=expected_total or int(pre[0]["n"])!=68:
                  raise RuntimeError("Other allocation records or totals exist; refuse migration")
              triggers=sql("SELECT name FROM sqlite_master WHERE type='trigger' AND name='f4_legacy_split_20261025'")
              if not triggers:
                  inserts=[]
                  for kind,value in fields:
                      inserts.append("""INSERT INTO bookkeeping_payment_allocations
                       (id,payment_id,payer_id,period_year,period_month,contribution_type,amount_rp,status)
                       SELECT 'split:' || NEW.id || ':%s',NEW.payment_id,NEW.payer_id,NEW.period_year,NEW.period_month,
                          '%s',%s,NEW.status WHERE %s>0;"""%(kind,kind,value,value))
                  trigger="""CREATE TRIGGER f4_legacy_split_20261025
                   AFTER UPDATE OF contribution_type ON bookkeeping_payment_allocations
                   WHEN OLD.contribution_type='gabungan' AND NEW.contribution_type='IURAN_BULANAN'
                   BEGIN %s END"""%" ".join(inserts)
                  sql(trigger)
              # One SQLite UPDATE statement + AFTER UPDATE trigger = one atomic statement.
              # If an insert fails, the update (all 68 rows) also rolls back.
              rt=case(25000,NO_RT,col="id")
              names=",".join("'"+v+"'" for v in sorted(ids))
              sql("""UPDATE bookkeeping_payment_allocations
                   SET contribution_type='IURAN_BULANAN',amount_rp=%s
                   WHERE id IN (%s) AND contribution_type='gabungan'"""%(rt,names))
              inspect_post()
          sql("DROP TRIGGER IF EXISTS f4_legacy_split_20261025")
          print("MIGRATION_TRIGGER_REMOVED=1")
          PY
