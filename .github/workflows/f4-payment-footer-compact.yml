name: F4 Compact Payment Footer Visual Check
on:
  push:
    branches: [main]
    paths:
      - index.html
      - portal-live/home-base.css
      - qa/verify-payment-footer-compact.py
      - .github/workflows/f4-payment-footer-compact.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify footer at 1365px, 390px and 360px
        run: python3 qa/verify-payment-footer-compact.py
