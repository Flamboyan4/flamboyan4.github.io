name: Bank Sampah Disposable D1 Full Lifecycle
on:
  push:
    branches: [fix/bank-audit-stable-nov14]
    paths:
      - .github/workflows/f4-bank-isolated-lifecycle-audit.yml
      - qa/run_isolated_bank_full_e2e.py
      - cloudflare/worker-terpadu-operasional-teruji.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler v4
        run: npm install --no-save --ignore-scripts wrangler@4
      - name: Clone production D1 read-only and test bank workflows on a local copy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 qa/run_isolated_bank_full_e2e.py
      - name: Upload anonymized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-isolated-e2e-result
          path: ops-audit/local-bank-full-e2e.json
          if-no-files-found: ignore
