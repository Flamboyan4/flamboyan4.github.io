name: F4 Expired QA Sessions Cleanup
on:
  push:
    branches: [ops-cloudflare-integration-20261025]
    paths: [.github/workflows/f4-qa-expired-sessions.yml]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove expired QA-only sessions without affecting real logins
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,datetime
          from pathlib import Path
          root="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]
          t=os.environ["CF_TOKEN"]
          def call(path,data=None):
            payload=None if data is None else json.dumps(data).encode()
            req=urllib.request.Request(root+path,method="POST" if payload else "GET",data=payload,headers={"Authorization":"Bearer "+t,"Content-Type":"application/json"})
            with urllib.request.urlopen(req,timeout=30) as r:x=json.load(r)
            if not x.get("success"):raise RuntimeError("Cloudflare API rejected session cleanup")
            return x.get("result")
          db=next(x for x in call("/d1/database") if x["name"]=="flamboyan4-staging")
          p="/d1/database/"+db["uuid"]+"/query"
          def sql(q):
            d=call(p,{"sql":q})
            return d[0].get("results") or []
          pre=sql("SELECT COUNT(*) AS n FROM sessions WHERE id LIKE 'qa-%' AND expires_at<CURRENT_TIMESTAMP")[0]["n"]
          sql("DELETE FROM sessions WHERE id LIKE 'qa-%' AND expires_at<CURRENT_TIMESTAMP")
          post=sql("SELECT COUNT(*) AS n FROM sessions WHERE id LIKE 'qa-%' AND expires_at<CURRENT_TIMESTAMP")[0]["n"]
          result={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "expired_qa_sessions_before":pre,"expired_qa_sessions_after":post,"regular_sessions_untouched":True,
            "status":"pass" if post==0 else "incomplete"}
          o=Path("ops-audit/expired-qa-sessions.json");o.parent.mkdir(exist_ok=True)
          o.write_text(json.dumps(result,indent=2)+"\n")
          print("Expired synthetic sessions cleaned:",pre,"remaining:",post)
          if post:raise SystemExit("QA sessions remain")
          PY
      - name: Save sanitation record
        if: always()
        run: |
          test -f ops-audit/expired-qa-sessions.json || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-audit/expired-qa-sessions.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ops): remove expired synthetic QA sessions"
          git push origin HEAD:ops-cloudflare-integration-20261025
