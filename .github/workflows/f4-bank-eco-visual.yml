name: Bank Sampah - Browser Audit Situs Asli
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install Playwright browser
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium
      - name: Inspect https://flamboyan4.web.id/bank-sampah/ directly
        run: |
          python3 - <<'PY'
          import asyncio,json,pathlib
          from playwright.async_api import async_playwright
          evidence=pathlib.Path("bank-live-evidence")
          evidence.mkdir(exist_ok=True)
          async def main():
            results=[]
            async with async_playwright() as p:
              browser=await p.chromium.launch(args=["--no-sandbox"])
              for width in (360,390,412,1366):
                ctx=await browser.new_context(viewport={"width":width,"height":844},
                  is_mobile=width<1024,has_touch=width<1024)
                page=await ctx.new_page()
                errors=[]
                page.on("pageerror",lambda e:errors.append(str(e)[:160]))
                try:
                  response=await page.goto("https://flamboyan4.web.id/bank-sampah/",
                    wait_until="domcontentloaded",timeout=30000)
                  await page.wait_for_timeout(1500)
                  state=await page.evaluate("""() => ({
                    viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                    bodyWidth:document.body.scrollWidth,
                    app:[...document.scripts].some(s=>s.src.includes("bank-mobile-app.js")),
                    css:[...document.styleSheets].some(s=>(s.href||"").includes("bank-eco-pages.css")),
                    visiblePublic:!!document.querySelector("#v11Public:not(.hidden)")
                  })""")
                  await page.screenshot(path=str(evidence/f"site-{width}.png"))
                  results.append({"width":width,"http":response.status if response else 0,
                    **state,"errors":errors})
                except Exception as e:
                  results.append({"width":width,"error":str(e)[:200]})
                await ctx.close()
              await browser.close()
            (evidence/"audit.json").write_text(json.dumps(results,indent=2))
            for row in results:print(row)
            assert all(r.get("http")==200 and r.get("app") and r.get("css") and
              not r.get("errors") and r.get("scrollWidth",9999)<=r["width"]+3 for r in results)
          asyncio.run(main())
          PY
      - name: Store live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-live-evidence
          path: bank-live-evidence/
          retention-days: 7
