name: Donatur Staging Cloudflare Readonly Check
on:
  push:
    branches: [fitur-donatur-terpadu-20261113]
    paths:
      - qa/donor_staging_preflight.py
      - .github/workflows/donor-staging-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check staging D1, account role, and Worker bindings without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python qa/donor_staging_preflight.py
