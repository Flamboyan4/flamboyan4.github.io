name: F4 Finance Guarded Deployment
on:
  push:
    branches: [main]
    paths:
      - cloudflare/worker-terpadu-operasional-teruji.js
      - qa/account-profile-password.cjs
      - qa/verify-treasury.py
      - qa/verify-treasury-humas.cjs
      - qa/verify-treasury-dynamic.py
      - qa/verify-treasury-bank-detection.py
      - cloudflare/migrations/20261030_treasury_bank_coverage.sql
      - cloudflare/migrations/20261031_bank_payout_requests.sql
      - qa/verify-treasury-bank-approval.py
      - qa/verify-treasury-lifecycle.cjs
      - .github/workflows/f4-finance-guarded-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f4-worker-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax and account policy
        run: |
          node --check cloudflare/worker-terpadu-operasional-teruji.js
          node qa/account-profile-password.cjs
          python3 qa/verify-treasury.py
          node qa/verify-treasury-humas.cjs
          node qa/verify-treasury-lifecycle.cjs
          python3 qa/verify-treasury-dynamic.py
          python3 qa/verify-treasury-bank-detection.py
          python3 qa/verify-treasury-bank-approval.py
      - name: Publish tested source, strictly inherit all production bindings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,hashlib,pathlib
          token=os.environ["CF_TOKEN"]
          account=os.environ["CF_ACCOUNT"]
          worker="flamboyan4-terpadu-staging"
          base="https://api.cloudflare.com/client/v4/accounts/"+account
          script=pathlib.Path("cloudflare/worker-terpadu-operasional-teruji.js").read_bytes()
          assert len(script)>200000, "Refuse truncated Worker source"
          def call(path,method="GET",data=None,ctype=None):
              headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              if ctype:headers["Content-Type"]=ctype
              req=urllib.request.Request(base+path,headers=headers,method=method,data=data)
              with urllib.request.urlopen(req,timeout=75) as r:response=json.load(r)
              if response.get("success") is not True:
                  raise RuntimeError("Cloudflare API call rejected: "+str([e.get("code") for e in response.get("errors",[])]))
              return response.get("result")
          settings=call("/workers/scripts/"+worker+"/settings")
          bindings=settings.get("bindings") or []
          by_name={x.get("name"):x for x in bindings}
          if by_name.get("DB",{}).get("type")!="d1" or by_name.get("PHOTOS",{}).get("type")!="r2_bucket":
              raise RuntimeError("Missing D1 / R2 bindings: deployment aborted")
          if by_name.get("ASSETS",{}).get("type")!="assets":
              raise RuntimeError("Missing ASSETS binding: deployment aborted")
          databases=call("/d1/database")
          target=next((d for d in databases if d.get("name")=="flamboyan4-staging"),None)
          if not target or by_name["DB"].get("id")!=target.get("uuid"):
              raise RuntimeError("Target D1 mismatch: deployment aborted")
          # Only additive schema migration: create one photo reference table.
          # No financial tables are modified; verification precedes Worker publish.
          migration=pathlib.Path("cloudflare/migrations/20261025_bank_progress_photos.sql").read_text()
          if not migration.lstrip().startswith("-- Bank Sampah photo URLs") or migration.upper().count("CREATE TABLE IF NOT EXISTS")!=1:
              raise RuntimeError("Refuse unexpected Bank Sampah migration SQL")
          d1path="/d1/database/"+target["uuid"]+"/query"
          def d1query(sql):
              res=call(d1path,"POST",json.dumps({"sql":sql}).encode("utf-8"),"application/json")
              if not isinstance(res,list) or len(res)!=1 or res[0].get("success") is not True:
                  raise RuntimeError("D1 schema query failed")
              return res[0].get("results") or []
          d1query(migration)
          columns=d1query("PRAGMA table_info(bank_progress_photos)")
          if not {"progress_id","photo_url","updated_at"}.issubset({v.get("name") for v in columns}):
              raise RuntimeError("New Bank Sampah media table missing required columns")
          print("D1_ADDITIVE_BANK_PHOTO_SCHEMA_OK=1")
          # Idempotent, additive project modules. No deletion or mutation of existing orders/cash.
          project_columns={
              "project_kind":"TEXT NOT NULL DEFAULT 'informasi'",
              "fund_source":"TEXT NOT NULL DEFAULT ''",
              "fund_target_rp":"INTEGER NOT NULL DEFAULT 0",
              "linked_key":"TEXT NOT NULL DEFAULT ''"
          }
          project_existing={x.get("name") for x in d1query("PRAGMA table_info(portal_project_cards)")}
          if not {"id","title","active"}.issubset(project_existing):
              raise RuntimeError("Existing project master structure not recognized")
          for name,definition in project_columns.items():
              if name not in project_existing:
                  d1query("ALTER TABLE portal_project_cards ADD COLUMN "+name+" "+definition)
          project_migration=pathlib.Path("cloudflare/migrations/20261028_project_modules.sql").read_text()
          if project_migration.upper().count("CREATE TABLE IF NOT EXISTS")!=2 or project_migration.upper().count("CREATE INDEX IF NOT EXISTS")!=2:
              raise RuntimeError("Unexpected project migration: only two additive tables and two indexes permitted")
          # Strip SQL comments BEFORE splitting. Comments may contain a semicolon.
          project_sql="\n".join(line for line in project_migration.splitlines()
                                if not line.lstrip().startswith("--"))
          for statement in project_sql.split(";"):
              sql=statement.strip()
              if not sql:continue
              # Kolom proyek sudah dipastikan / ditambahkan secara idempoten
              # oleh project_columns di atas; jangan ALTER COLUMN dua kali.
              if sql.upper().startswith("ALTER TABLE PORTAL_PROJECT_CARDS ADD COLUMN "):continue
              d1query(sql)
          for table,required in [
              ("portal_project_orders",{"id","project_id","resident","amount_due_rp","paid_rp","status"}),
              ("portal_project_contributions",{"id","project_id","contributor","amount_rp","status"})]:
              names={x.get("name") for x in d1query("PRAGMA table_info("+table+")")}
              if not required.issubset(names):raise RuntimeError("Incomplete project module table: "+table)
          project_actual={x.get("name") for x in d1query("PRAGMA table_info(portal_project_cards)")}
          if not set(project_columns).issubset(project_actual):
              raise RuntimeError("Project metadata columns not migrated")
          print("D1_ADDITIVE_PROJECT_SCHEMA_OK=1")
          # Dedicated non-financial receipt metadata for Bank Sampah sales.
          # Safe to run repeatedly; NEVER ALTER financial values/statuses.
          sale_receipts=pathlib.Path("cloudflare/migrations/20261028_bank_sale_receipts.sql").read_text()
          if sale_receipts.upper().count("CREATE TABLE IF NOT EXISTS WASTE_SALE_RECEIPTS")==0 or sale_receipts.upper().count("CREATE TABLE IF NOT EXISTS")!=1:
              raise RuntimeError("Unexpected receipt migration")
          d1query(sale_receipts)
          receipt_columns={x.get("name") for x in d1query("PRAGMA table_info(waste_sale_receipts)")}
          if not {"sale_id","receipt_no","evidence_url","updated_by","updated_at"}.issubset(receipt_columns):
              raise RuntimeError("Receipt document columns missing; Worker deploy aborted")
          print("D1_ADDITIVE_SALE_RECEIPT_SCHEMA_OK=1")
          # Add-only grouping for iuran Kas Lorong & Gorol fine receipts.
          # Do not alter, delete, or rewrite any historical cash transaction.
          kas_sql=pathlib.Path("cloudflare/migrations/20261028_kas_lorong_batches.sql").read_text()
          if kas_sql.upper().count("CREATE TABLE IF NOT EXISTS")!=2 or kas_sql.upper().count("CREATE UNIQUE INDEX IF NOT EXISTS")!=1 or kas_sql.upper().count("CREATE VIEW IF NOT EXISTS")!=1:
              raise RuntimeError("Unexpected Kas batch migration")
          kas_sql="\n".join(line for line in kas_sql.splitlines() if not line.lstrip().startswith("--"))
          for statement in kas_sql.split(";"):
              q=statement.strip()
              if q:d1query(q)
          for table,columns_required in [
              ("bookkeeping_kas_batches",{"id","request_key","category","cash_transaction_id","amount_rp","status"}),
              ("bookkeeping_kas_batch_items",{"id","batch_id","category","source_id","status"})]:
              actual={x.get("name") for x in d1query("PRAGMA table_info("+table+")")}
              if not columns_required.issubset(actual):raise RuntimeError("Kas batch schema incomplete: "+table)
          print("D1_ADDITIVE_KAS_BATCH_SCHEMA_OK=1")
          # Freeze existing iuran obligations as a baseline, then use
          # additive month-effective versions for all future changes.
          historical_sql=pathlib.Path("cloudflare/migrations/20261030_iuran_period_obligations.sql").read_text()
          if (historical_sql.upper().count("CREATE TABLE IF NOT EXISTS")!=1
                or historical_sql.upper().count("CREATE INDEX IF NOT EXISTS")!=1
                or historical_sql.upper().count("INSERT INTO BOOKKEEPING_PAYER_OBLIGATION_PERIODS")!=1):
              raise RuntimeError("Unexpected historical iuran migration: abort deploy")
          historical_clean="\n".join(line for line in historical_sql.splitlines()
                                     if not line.lstrip().startswith("--"))
          for statement in historical_clean.split(";"):
              q=statement.strip()
              if q:d1query(q)
          historical_cols={x.get("name") for x in d1query("PRAGMA table_info(bookkeeping_payer_obligation_periods)")}
          if not {"payer_id","effective_from","qty_iuran_bulanan","qty_kebersihan",
                  "qty_kas_lorong","qty_arisan"}.issubset(historical_cols):
              raise RuntimeError("Historical iuran columns incomplete, abort deploy")
          baseline_unmigrated=d1query("SELECT COUNT(*) AS n FROM bookkeeping_payer_iuran_obligations o WHERE NOT EXISTS (SELECT 1 FROM bookkeeping_payer_obligation_periods h WHERE h.payer_id=o.payer_id)")
          if int(baseline_unmigrated[0].get("n",0))!=0:
              raise RuntimeError("Historical obligation baseline is incomplete")
          print("D1_ADDITIVE_IURAN_HISTORY_SCHEMA_OK=1")
          # Pusat Keuangan: add-only event journal + positions; no historical cash rewrite.
          treasury_sql=pathlib.Path("cloudflare/migrations/20261030_treasury_center.sql").read_text()
          if (treasury_sql.upper().count("CREATE TABLE IF NOT EXISTS")!=3
              or treasury_sql.upper().count("CREATE INDEX IF NOT EXISTS")!=2
              or "INSERT OR IGNORE INTO TREASURY_CONFIG" not in treasury_sql.upper()):
              raise RuntimeError("Unexpected treasury migration")
          treasury_clean="\n".join(line for line in treasury_sql.splitlines()
                                      if not line.lstrip().startswith("--"))
          for statement in treasury_clean.split(";"):
              q=statement.strip()
              if q:d1query(q)
          for table,cols in [
              ("treasury_events",{"id","request_key","payload_hash","kind","occurred_on","created_by"}),
              ("treasury_entries",{"id","event_id","fund_id","location_id","amount_rp"}),
              ("treasury_config",{"id","confirmed_on","confirmed_at","confirmed_by"})]:
              actual={c.get("name") for c in d1query("PRAGMA table_info("+table+")")}
              if not cols.issubset(actual):raise RuntimeError("Incomplete treasury schema: "+table)
          print("D1_ADDITIVE_TREASURY_SCHEMA_OK=1")
          dynamic_sql=pathlib.Path("cloudflare/migrations/20261030_treasury_dynamic_funds.sql").read_text()
          if dynamic_sql.upper().count("CREATE TABLE IF NOT EXISTS")!=3 or dynamic_sql.upper().count("CREATE INDEX IF NOT EXISTS")!=3:
              raise RuntimeError("Unexpected dynamic treasury migration")
          dynamic_clean="\n".join(line for line in dynamic_sql.splitlines()
                                      if not line.lstrip().startswith("--"))
          for statement in dynamic_clean.split(";"):
              q=statement.strip()
              if q:d1query(q)
          for table,cols in [
              ("treasury_funds",{"id","name","cash_location","purpose","created_by"}),
              ("treasury_receipt_observations",{"id","source_kind","source_id","fund_id","amount_rp","observed_on"}),
              ("treasury_source_exclusions",{"source_key","reason","excluded_by","excluded_at"})]:
              actual={c.get("name") for c in d1query("PRAGMA table_info("+table+")")}
              if not cols.issubset(actual):raise RuntimeError("Incomplete treasury dynamic schema: "+table)
          print("D1_ADDITIVE_TREASURY_DYNAMIC_OK=1")
          coverage_sql=pathlib.Path("cloudflare/migrations/20261030_treasury_bank_coverage.sql").read_text()
          if coverage_sql.upper().count("CREATE TABLE IF NOT EXISTS")!=1 or coverage_sql.upper().count("CREATE INDEX IF NOT EXISTS")!=1:
              raise RuntimeError("Unexpected Bank Sampah coverage migration")
          coverage_clean="\n".join(line for line in coverage_sql.splitlines()
                                      if not line.lstrip().startswith("--"))
          for statement in coverage_clean.split(";"):
              q=statement.strip()
              if q:d1query(q)
          actual={c.get("name") for c in d1query("PRAGMA table_info(treasury_bank_source_coverage)")}
          if not {"source_id","event_id","fund_id","captured_amount_rp"}.issubset(actual):
              raise RuntimeError("Incomplete Bank Sampah approval coverage schema")
          print("D1_TREASURY_BANK_COVERAGE_OK=1")
          # Pengajuan pencairan: skema tambahan, tanpa mengubah buku tabungan maupun kas.
          payout_sql=pathlib.Path("cloudflare/migrations/20261031_bank_payout_requests.sql").read_text()
          if payout_sql.upper().count("CREATE TABLE IF NOT EXISTS")!=1 or payout_sql.upper().count("CREATE INDEX IF NOT EXISTS")!=2:
              raise RuntimeError("Unexpected withdrawal-request migration")
          payout_clean="\n".join(line for line in payout_sql.splitlines() if not line.lstrip().startswith("--"))
          for statement in payout_clean.split(";"):
              query=statement.strip()
              if query:d1query(query)
          payout_cols={c.get("name") for c in d1query("PRAGMA table_info(waste_payout_requests)")}
          if not {"id","request_key","member_id","amount_rp","method","status","paid_at","ledger_id"}.issubset(payout_cols):
              raise RuntimeError("Payout request table incomplete; deployment blocked")
          print("D1_ADDITIVE_PAYOUT_REQUESTS_OK=1")
          write_flags={k:by_name[k].get("text") for k in by_name if k.endswith("_WRITE_ENABLED")}
          if not write_flags or any(v not in ("true","false") for v in write_flags.values()):
              raise RuntimeError("Missing or unrecognized Worker write flags")
          metadata={"main_module":"main.js","keep_assets":True,
                    "compatibility_date":settings.get("compatibility_date") or "2026-10-21",
                    "bindings":[{"name":item["name"],"type":"inherit"} for item in bindings],
                    "annotations":{"workers/message":"F4: 41-check isolated Iuran guard release; preserve production configuration"}}
          boundary="----F4SafeFinance20261025"
          def part(name,data,mime):
              h=("--"+boundary+"\r\nContent-Disposition: form-data; name=\""+name+"\"; filename=\""+name+"\"\r\nContent-Type: "+mime+"\r\n\r\n").encode()
              return h+data+b"\r\n"
          body=part("metadata",json.dumps(metadata).encode(),"application/json")+part("main.js",script,"application/javascript+module")+("--"+boundary+"--\r\n").encode()
          result=call("/workers/scripts/"+worker+"?bindings_inherit=strict","PUT",body,"multipart/form-data; boundary="+boundary)
          after=call("/workers/scripts/"+worker+"/settings")
          new={x.get("name"):x for x in after.get("bindings") or []}
          if set(new)!=set(by_name) or new.get("DB",{}).get("id")!=by_name["DB"].get("id") or new.get("PHOTOS",{}).get("type")!="r2_bucket":
              raise RuntimeError("CRITICAL: binding mismatch after deployment")
          for key,value in write_flags.items():
              if new.get(key,{}).get("text")!=value:
                  raise RuntimeError("CRITICAL: write flag modified: "+key)
          deploy=call("/workers/scripts/"+worker+"/deployments")
          latest=(deploy.get("deployments") or [{}])[0].get("id")
          print("DEPLOY_OK target="+worker+" deployment="+str(latest))
          print("SOURCE_SHA256="+hashlib.sha256(script).hexdigest())
          print("BINDINGS_PRESERVED="+str(len(new)))
          print("WRITE_FLAGS_UNCHANGED="+str(len(write_flags)))
          print("WRITE_FLAGS_ACTIVE="+",".join(sorted(k for k,v in write_flags.items() if v=="true")))
          print("WRITE_FLAGS_INACTIVE="+",".join(sorted(k for k,v in write_flags.items() if v=="false")))
          PY
      - name: Live read-only health and public data smoke
        run: |
          python3 - <<'PY'
          import urllib.request,json
          origin="https://api.flamboyan4.web.id"
          for path in ["/api/health","/api/v2/system/features","/api/v2/public/portal","/api/v2/public/bank"]:
              req=urllib.request.Request(origin+path,headers={"Cache-Control":"no-cache","Accept":"application/json","Origin":"https://flamboyan4.web.id","User-Agent":"Mozilla/5.0 Flamboyan4-Smoke/1.0"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  obj=json.load(response)
                  if response.status!=200 or obj.get("ok") is False:raise RuntimeError("Smoke failed: "+path)
                  print("LIVE GET OK "+path)
          PY
