name: F4 RT D1 Report Aggregate Read-only Audit
on:
  push:
    branches: ['fix/book-rt-report-read-direct-allocations-20261107']
    paths:
      - '.github/workflows/f4-rt-report-aggregate-readonly.yml'
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read D1 schema and monthly totals only (no personal records, no mutations)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          base="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]
          headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"}
          def call(path,data=None):
              req=urllib.request.Request(base+path,headers=headers,data=(json.dumps(data).encode() if data is not None else None))
              with urllib.request.urlopen(req,timeout=20) as r: body=json.load(r)
              if not body.get("success"): raise RuntimeError("D1 aggregate query failed")
              return body["result"]
          db=next((d for d in call("/d1/database") if d.get("name")=="flamboyan4-staging"),None)
          if not db: raise RuntimeError("D1 database not found")
          endpoint="/d1/database/"+db["uuid"]+"/query"
          def q(sql):
              x=call(endpoint,{"sql":sql})
              return x[0]["results"] if x else []
          for table in ("bookkeeping_payment_allocations","bookkeeping_allocation_details","bookkeeping_payments"):
              print("COLUMNS",table,[x["name"] for x in q("PRAGMA table_info("+table+")")])
          sql="""SELECT printf('%04d-%02d',a.period_year,a.period_month) AS period,
                      a.contribution_type AS category,
                      count(DISTINCT a.id) AS allocations,
                      coalesce(sum(CASE WHEN ad.allocation_id IS NULL THEN a.amount_rp ELSE 0 END),0) AS direct_rp,
                      count(ad.allocation_id) AS detail_lines,
                      coalesce(sum(ad.amount_rp),0) AS detail_rp
                  FROM bookkeeping_payment_allocations a
                  JOIN bookkeeping_payments p ON p.id=a.payment_id
                  LEFT JOIN bookkeeping_allocation_details ad ON ad.allocation_id=a.id
                  WHERE a.status='aktif' AND p.status='aktif'
                    AND a.period_year=2026 AND a.period_month IN (9,10,11)
                  GROUP BY a.period_year,a.period_month,a.contribution_type
                  ORDER BY period,category"""
          for row in q(sql):print("AGGREGATE",row)
          detail_sql="""SELECT a.period_year AS y,a.period_month AS m,
                    a.contribution_type AS allocation_category,
                    ad.contribution_type AS detail_category,
                    count(*) AS lines,coalesce(sum(ad.amount_rp),0) AS detail_rp
                    FROM bookkeeping_allocation_details ad
                    JOIN bookkeeping_payment_allocations a ON a.id=ad.allocation_id
                    JOIN bookkeeping_payments p ON p.id=a.payment_id
                    WHERE a.status='aktif' AND p.status='aktif'
                    AND a.period_year=2026 AND a.period_month IN (10,11)
                    GROUP BY y,m,allocation_category,detail_category ORDER BY y,m,allocation_category,detail_category"""
          for row in q(detail_sql):print("DETAIL_TOTAL",row)
          paid_sql="""SELECT substr(p.paid_on,1,7) AS paid_month,
                    a.period_month AS target_month,
                    a.contribution_type AS category,
                    count(*) AS allocations,
                    sum(a.amount_rp) AS amount_rp
                    FROM bookkeeping_payment_allocations a
                    JOIN bookkeeping_payments p ON p.id=a.payment_id
                    WHERE a.status='aktif' AND p.status='aktif'
                    AND a.period_year=2026 AND a.period_month=11
                    GROUP BY paid_month,target_month,category ORDER BY paid_month,category"""
          for row in q(paid_sql):print("PAYMENT_MONTH",row)
          source_sql="""SELECT a.period_month AS m,a.contribution_type AS category,
                   CASE WHEN p.id LIKE 'pay-%' THEN 'worker'
                        WHEN p.id LIKE 'pay:%' THEN 'colon'
                        ELSE 'other' END AS payment_source,
                   count(DISTINCT p.id) AS payments,coalesce(sum(a.amount_rp),0) AS nominal,
                   sum(CASE WHEN EXISTS(SELECT 1 FROM bookkeeping_allocation_details ad WHERE ad.allocation_id=a.id) THEN 1 ELSE 0 END) AS with_detail
                   FROM bookkeeping_payment_allocations a
                   JOIN bookkeeping_payments p ON p.id=a.payment_id
                   WHERE a.status='aktif' AND p.status='aktif'
                   AND a.period_year=2026 AND a.period_month IN (10,11)
                   GROUP BY m,category,payment_source ORDER BY m,category,payment_source"""
          for row in q(source_sql):print("SOURCE_TOTAL",row)
          comparisons="""WITH direct AS (
                    SELECT a.period_year AS y,a.period_month AS m,
                      CASE a.contribution_type
                        WHEN 'IURAN_BULANAN' THEN 'bulanan'
                        WHEN 'KEBERSIHAN' THEN 'kebersihan'
                        WHEN 'ARISAN' THEN 'arisan'
                        WHEN 'KAS_LORONG' THEN 'kas_lorong' END AS k,
                      sum(a.amount_rp) AS nominal
                    FROM bookkeeping_payment_allocations a
                    JOIN bookkeeping_payments p ON p.id=a.payment_id
                    WHERE a.status='aktif' AND p.status='aktif' AND a.period_year=2026
                    GROUP BY y,m,k
                  ), detail AS (
                    SELECT a.period_year AS y,a.period_month AS m,
                      ad.contribution_type AS k,sum(ad.amount_rp) AS nominal
                    FROM bookkeeping_allocation_details ad
                    JOIN bookkeeping_payment_allocations a ON a.id=ad.allocation_id
                    JOIN bookkeeping_payments p ON p.id=a.payment_id
                    WHERE a.status='aktif' AND p.status='aktif' AND a.period_year=2026
                    GROUP BY y,m,k
                  )
                  SELECT d.y,d.m,d.k,d.nominal AS direct_rp,coalesce(t.nominal,0) AS detail_rp
                  FROM direct d LEFT JOIN detail t ON t.y=d.y AND t.m=d.m AND t.k=d.k
                  ORDER BY d.y,d.m,d.k"""
          for row in q(comparisons):print("RECONCILE",row)
          PY
