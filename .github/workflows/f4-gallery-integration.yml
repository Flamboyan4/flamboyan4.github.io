name: F4 Community Gallery Integration
on:
  push:
    branches: [main]
    paths:
      - cloudflare/worker-terpadu-operasional-teruji.js
      - portal-live/dokumentasi/community-gallery.js
      - portal-live/dokumentasi/community-gallery.css
      - portal-live/community-home.css
      - qa/verify-community-gallery-browser.py
      - portal-live/dokumentasi/media-preview.js
      - portal-live/dokumentasi/media-viewer.js
      - portal-live/community-home.js
      - dokumentasi/index.html
      - index.html
      - .github/workflows/f4-gallery-integration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts
        run: |
          node --check cloudflare/worker-terpadu-operasional-teruji.js
          node --check portal-live/dokumentasi/community-gallery.js
          node --check portal-live/dokumentasi/media-preview.js
          node --check portal-live/dokumentasi/media-viewer.js
          node --check portal-live/community-home.js
      - name: Check additive Gallery D1 migration and new CSS isolation
        run: |
          python3 - <<'PY'
          import sqlite3,pathlib
          root=pathlib.Path('.')
          sql=(root/'cloudflare/migrations/20261112_galeri_warga.sql').read_text()
          db=sqlite3.connect(':memory:')
          db.executescript(sql)
          db.executescript(sql)
          tables={v[0] for v in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected={'f4_gallery_albums','f4_gallery_photos','f4_gallery_reactions','f4_gallery_comments','f4_gallery_reports'}
          assert tables==expected,('Unexpected table modification',tables)
          db.execute("INSERT INTO f4_gallery_albums(id,title,created_by) VALUES('a','Album','u')")
          db.execute("INSERT INTO f4_gallery_photos(id,album_ref,drive_file_id,drive_folder_id,uploader_id,filename) VALUES('p','a','f','d','u','x.jpg')")
          db.execute("INSERT INTO f4_gallery_reactions(target_type,target_id,account_id) VALUES('photo','p','u')")
          db.execute("INSERT INTO f4_gallery_comments(id,target_type,target_id,account_id,message) VALUES('c','photo','p','u','Komentar')")
          for file in ['portal-live/dokumentasi/community-gallery.css','portal-live/community-home.css']:
              text=(root/file).read_text()
              import re
              without_comments=re.sub(r'/\*.*?\*/','',text,flags=re.S)
              assert not re.search(r'!\s*important\b',without_comments),'New CSS must not introduce !important: '+file
          print('GALLERY_D1_ADDITIVE_AND_SCOPED_CSS_OK tables=',len(tables))
          PY
      - name: Verify read-only live gallery API
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          url='https://api.flamboyan4.web.id/api/v2/gallery'
          request=urllib.request.Request(url,headers={'Origin':'https://flamboyan4.web.id','Accept':'application/json','User-Agent':'F4-gallery-smoke/1.0'})
          try:
            with urllib.request.urlopen(request,timeout=20) as response:
              data=json.load(response)
              assert data.get('ok') is True
              assert isinstance(data.get('albums'),list)
              assert isinstance(data.get('photos'),list)
              assert isinstance(data.get('highlights'),list)
              assert isinstance(data.get('popular'),list)
              print('GALLERY_READ_OK albums=',len(data['albums']),'photos=',len(data['photos']),'driveConfigured=',bool(data.get('uploadEnabled')))
              print('GALLERY_DRIVE_CONNECTION_STATUS', 'READY' if data.get('uploadEnabled') else 'NOT_CONFIGURED')
              assert data.get('uploadEnabled') is True, 'New Cloudflare Google Drive secrets are not visible to production API'
              portal_req=urllib.request.Request('https://api.flamboyan4.web.id/api/v2/public/portal',headers={'Origin':'https://flamboyan4.web.id','Accept':'application/json','User-Agent':'F4-gallery-smoke/1.0'})
              with urllib.request.urlopen(portal_req,timeout=20) as portal_response:
                portal_data=json.load(portal_response)
                assert portal_data.get('ok') is True and isinstance(portal_data.get('documentation'),list)
                print('PORTAL_UNCHANGED_OK docs=',len(portal_data['documentation']))
              for check_path in ['/api/health','/api/v2/public/bank']:
                route='https://api.flamboyan4.web.id'+check_path
                check=urllib.request.Request(route,headers={'Origin':'https://flamboyan4.web.id','Accept':'application/json','User-Agent':'F4-gallery-safety-smoke/1.0'})
                with urllib.request.urlopen(check,timeout=20) as checked:
                  result=json.load(checked)
                  assert result.get('ok') is True,('Existing portal failed',check_path)
                  print('OTHER_MODULE_UNCHANGED_OK',check_path)

          except urllib.error.HTTPError as exc:
            print('GALLERY_READ_HTTP_ERROR',exc.code,exc.read(700).decode('utf-8','replace'))
            raise
          PY
      - name: Install isolated browser runner
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser audit of gallery controls, dialogs, album visibility and homepage
        run: python3 qa/verify-community-gallery-browser.py
      - name: Upload gallery browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-community-gallery-browser
          path: |
            ops-audit/community-gallery-browser.json
            ops-audit/gallery-pc.png
            ops-audit/gallery-hp.png
            ops-audit/photo-viewer-pc.png
            ops-audit/photo-viewer-hp.png
          if-no-files-found: ignore
