name: F4 Bank Sampah Progress Photos Backfill
on:
  push:
    branches: [main]
    paths:
      - cloudflare/migrations/20261025_bank_progress_photo_backfill.sql
      - .github/workflows/f4-bank-progress-photo-backfill.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f4-bank-progress-photos-safe-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve existing D1 and fill only three missing progress photos
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request,pathlib
          account=os.environ['CF_ACCOUNT']
          token=os.environ['CF_TOKEN']
          api='https://api.cloudflare.com/client/v4/accounts/'+account
          def cf(path,method='GET',data=None):
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
              if data is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(api+path,headers=headers,method=method,
                data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(req,timeout=45) as resp:obj=json.load(resp)
              if obj.get('success') is not True:
                  raise RuntimeError('Cloudflare rejected D1 operation')
              return obj.get('result')
          dbs=cf('/d1/database')
          target=next((d for d in dbs if d.get('name')=='flamboyan4-staging'),None)
          if target is None:raise RuntimeError('Target D1 not found: abort')
          cfg=cf('/workers/scripts/flamboyan4-terpadu-staging/settings')
          binding=next((x for x in (cfg.get('bindings') or []) if x.get('name')=='DB'),None)
          if binding is None or binding.get('type')!='d1' or binding.get('id')!=target['uuid']:
              raise RuntimeError('Worker D1 binding mismatch: abort')
          path='/d1/database/'+target['uuid']+'/query'
          def query(sql,params=None):
              res=cf(path,'POST',{'sql':sql,'params':params or []})
              if not isinstance(res,list) or len(res)!=1 or res[0].get('success') is not True:
                  raise RuntimeError('D1 query rejected')
              return res[0].get('results') or [],res[0].get('meta') or {}
          source=pathlib.Path('cloudflare/migrations/20261025_bank_progress_photo_backfill.sql').read_text()
          pattern=r"SELECT id,'(https://drive\.google\.com/file/d/[A-Za-z0-9_-]+/view\?usp=sharing)'\s+FROM progress_entries WHERE title='([^']+)'"
          pairs=re.findall(pattern,source)
          if len(pairs)!=3 or len(set(title for _,title in pairs))!=3:
              raise RuntimeError('Unexpected progress migration source: abort')
          executable='\n'.join(line for line in source.splitlines()
              if line.strip() and not line.lstrip().startswith('--')).upper()
          # SQL titles include "Drop Point": ignore quoted values when scanning keywords.
          commands_only=re.sub(r"'(?:''|[^'])*'", "''", executable)
          if not source.lstrip().startswith('-- Bank Sampah:') or any(
              re.search(r'\b'+word+r'\b',commands_only)
              for word in ('UPDATE','DELETE','DROP','ALTER','TRUNCATE')):
              raise RuntimeError('Photo migration is not insert-only: abort')
          cols,_=query('PRAGMA table_info(bank_progress_photos)')
          if not {'progress_id','photo_url'}.issubset({r['name'] for r in cols}):
              raise RuntimeError('Missing additive bank_progress_photos table')
          resolved=[]
          for url,title in pairs:
              found,_=query('SELECT id FROM progress_entries WHERE title=?',[title])
              if len(found)!=1:
                  raise RuntimeError('Missing or duplicate original progress title: abort without writes')
              resolved.append((found[0]['id'],url))
          inserted=0
          for progress_id,url in resolved:
              rows,_=query('SELECT photo_url FROM bank_progress_photos WHERE progress_id=?',[progress_id])
              if not rows:
                  query('INSERT OR IGNORE INTO bank_progress_photos(progress_id,photo_url) VALUES(?,?)',[progress_id,url])
                  inserted+=1
          verified=0
          for progress_id,url in resolved:
              rows,_=query('SELECT photo_url FROM bank_progress_photos WHERE progress_id=?',[progress_id])
              if len(rows)==1 and isinstance(rows[0].get('photo_url'),str) and rows[0]['photo_url'].startswith('https://'):
                  verified+=1
          if verified!=3:raise RuntimeError('Progress photo backfill verification failed')
          print('BANK_PROGRESS_PHOTOS_VERIFIED=3')
          print('NEW_PHOTO_REFERENCES_ADDED='+str(inserted))
          print('EXISTING_PHOTO_REFERENCES_PRESERVED='+str(3-inserted))
          print('FINANCIAL_TABLES_MUTATED=0')
          PY
