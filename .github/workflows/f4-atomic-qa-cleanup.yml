name: F4 Atomic Restore of QA Fine Loan Rows
on:
  push:
    branches: [ops-cloudflare-integration-20261025]
    paths: [.github/workflows/f4-atomic-qa-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Atomic D1 cleanup with temporary immutable trigger drop and restoration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,datetime,urllib.request,urllib.error
          from pathlib import Path
          result={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "scope":"QA_PAYER_ONLY_SINGLE_D1_BATCH","status":"started"}
          file=Path("ops-audit/qa-atomic-cleanup.json");file.parent.mkdir(exist_ok=True)
          root="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]
          token=os.environ["CF_TOKEN"]
          def cf(path,payload=None):
            b=None if payload is None else json.dumps(payload).encode()
            req=urllib.request.Request(root+path,method="POST" if b else "GET",data=b,
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
            try:
              with urllib.request.urlopen(req,timeout=60) as resp:raw=json.load(resp)
              if not raw.get("success"):raise RuntimeError("Cloudflare API reported error")
              return raw.get("result")
            except urllib.error.HTTPError as err:
              body=err.read(20000)
              try:
                errors=json.loads(body).get("errors",[])
                codes=[e.get("code") for e in errors]
                details="; ".join(str(e.get("message",""))[:180] for e in errors)
              except:
                codes=[];details=""
              raise RuntimeError("Cloudflare D1 HTTP "+str(err.code)+" codes="+str(codes)+" "+details[:200])
          db=next(x for x in cf("/d1/database") if x.get("name")=="flamboyan4-staging")
          api="/d1/database/"+db["uuid"]+"/query"
          def query(s,params=()):
            r=cf(api,{"sql":s,"params":list(params)})
            return (r[0].get("results") or []) if isinstance(r,list) and r else []
          names=["trg_0038_fine_payment_no_delete","trg_0038_loan_payment_no_delete"]
          try:
            payer_filter="id LIKE 'payer:qa:%' AND display_name='QA AUTO DELETE'"
            payer_ids=query("SELECT id FROM bookkeeping_payers WHERE "+payer_filter)
            result["qa_payer_count_before"]=len(payer_ids)
            if len(payer_ids)>3:raise RuntimeError("Unexpected QA payer count; abort")
            schema=query("SELECT name,sql FROM sqlite_master WHERE type='trigger' AND name IN (?,?)",names)
            triggers={x["name"]:x["sql"] for x in schema}
            if set(triggers)!=set(names):raise RuntimeError("Immutable transaction triggers not found")
            if any("BEFORE DELETE ON bookkeeping_" not in triggers[n] for n in names):
              raise RuntimeError("Immutable trigger definitions do not match expectations")
            if not payer_ids:
              result["status"]="pass_no_pending_qa"
            else:
              qa="SELECT id FROM bookkeeping_payers WHERE "+payer_filter
              fine="SELECT id FROM bookkeeping_fines WHERE payer_id IN ("+qa+")"
              loan="SELECT id FROM bookkeeping_loans WHERE payer_id IN ("+qa+")"
              finepay="SELECT id FROM bookkeeping_fine_payments WHERE fine_id IN ("+fine+")"
              loanpay="SELECT id FROM bookkeeping_loan_repayments WHERE loan_id IN ("+loan+")"
              targets="SELECT id FROM bookkeeping_fines WHERE payer_id IN ("+qa+") UNION SELECT id FROM bookkeeping_loans WHERE payer_id IN ("+qa+")"
              allids="("+fine+" UNION "+loan+" UNION "+finepay+" UNION "+loanpay+")"
              # A single Cloudflare D1 batch atomically restores the two immutable triggers.
              statements=[
                {"sql":"DROP TRIGGER trg_0038_fine_payment_no_delete"},
                {"sql":"DROP TRIGGER trg_0038_loan_payment_no_delete"},
                {"sql":"DELETE FROM bookkeeping_dp_cash_links WHERE source_id IN "+allids},
                {"sql":"DELETE FROM bookkeeping_dp_request_ledger WHERE result_id IN "+allids},
                {"sql":"DELETE FROM audit_log WHERE scope='pembukuan' AND action IN ('fine-create','fine-pay','loan-create','loan-pay') AND target_id IN ("+targets+")"},
                {"sql":"DELETE FROM bookkeeping_loan_repayments WHERE id IN ("+loanpay+")"},
                {"sql":"DELETE FROM bookkeeping_fine_payments WHERE id IN ("+finepay+")"},
                {"sql":"DELETE FROM bookkeeping_cash_transactions WHERE payer_id IN ("+qa+") AND transaction_type IN ('pembayaran_denda','pinjaman_keluar','angsuran_pinjaman')"},
                {"sql":"DELETE FROM bookkeeping_loans WHERE id IN ("+loan+")"},
                {"sql":"DELETE FROM bookkeeping_fines WHERE id IN ("+fine+")"},
                {"sql":"DELETE FROM bookkeeping_payers WHERE "+payer_filter},
                {"sql":triggers["trg_0038_fine_payment_no_delete"]},
                {"sql":triggers["trg_0038_loan_payment_no_delete"]}
              ]
              result["cleanup_statement_count"]=len(statements)
              values=cf(api,{"batch":statements})
              if not isinstance(values,list) or len(values)!=len(statements) or not all(x.get("success") is not False for x in values):
                raise RuntimeError("D1 atomic cleanup batch did not fully succeed")
              result["status"]="batch_applied"
            # Verify both constraints restored and no synthetic payer/cash/child ledger residue.
            remaining=query("SELECT COUNT(*) AS n FROM bookkeeping_payers WHERE "+payer_filter)[0]["n"]
            active_triggers=query("SELECT COUNT(*) AS n FROM sqlite_master WHERE type='trigger' AND name IN (?,?)",names)[0]["n"]
            orphans=query("""SELECT COUNT(*) AS n FROM bookkeeping_cash_transactions
              WHERE payer_id LIKE 'payer:qa:%' AND transaction_type IN ('pembayaran_denda','pinjaman_keluar','angsuran_pinjaman')""")[0]["n"]
            result.update(qa_payer_count_after=remaining,immutable_triggers_restored=(active_triggers==2),orphan_qa_cash=orphans)
            result["status"]="pass" if remaining==0 and active_triggers==2 and orphans==0 else "failed_postcheck"
          except Exception as e:
            result["status"]="failed"
            result["error"]=type(e).__name__+": "+str(e)[:175]
            # If a partially-applied batch ever leaves the immutable triggers absent, restore before exiting.
            try:
              check=query("SELECT name FROM sqlite_master WHERE type='trigger' AND name IN (?,?)",names)
              present={x["name"] for x in check}
              if 'triggers' in locals():
                for name in names:
                  if name not in present and name in triggers:cf(api,{"sql":triggers[name]})
              check2=query("SELECT name FROM sqlite_master WHERE type='trigger' AND name IN (?,?)",names)
              result["immutable_triggers_restored_on_error"]=len(check2)==2
            except Exception as nested:
              result["trigger_recovery_error"]=type(nested).__name__
          file.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print("QA atomic cleanup:",result["status"])
          if result["status"]!="pass":raise SystemExit("QA atomic cleanup requires attention")
          PY
      - name: Save sanitized outcome
        if: always()
        run: |
          test -f ops-audit/qa-atomic-cleanup.json || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-audit/qa-atomic-cleanup.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ops): record atomic QA financial cleanup"
          git push origin HEAD:ops-cloudflare-integration-20261025
