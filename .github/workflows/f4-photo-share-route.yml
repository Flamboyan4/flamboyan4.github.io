name: F4 Public Photo Share Route
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/f4-photo-share-route.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f4-worker-release
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Attach only the public short-link path to the existing API Worker
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request
          from urllib.error import HTTPError
          from html import unescape
          token=os.environ["CF_TOKEN"]
          account=os.environ["CF_ACCOUNT"]
          if not token or not account:
              raise RuntimeError("Cloudflare credentials unavailable")
          def call(path, method="GET", payload=None):
              headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"}
              req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,headers=headers,method=method,data=json.dumps(payload).encode() if payload is not None else None)
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)
              if data.get("success") is not True:
                  raise RuntimeError("Cloudflare rejected route operation")
              return data["result"]
          domains=call("/accounts/"+account+"/workers/domains?hostname=api.flamboyan4.web.id")
          matches=[d for d in domains if d.get("hostname")=="api.flamboyan4.web.id" and d.get("enabled") is True]
          if len(matches)!=1 or matches[0].get("environment") not in (None,"","production"):
              raise RuntimeError("Existing production API Worker not uniquely identified")
          worker=matches[0].get("service","")
          if not re.fullmatch(r"[A-Za-z0-9_-]{4,100}",worker):
              raise RuntimeError("Unexpected Worker identifier")
          zones=call("/zones?name=flamboyan4.web.id&status=active")
          zones=[z for z in zones if z.get("name")=="flamboyan4.web.id" and z.get("account",{}).get("id")==account]
          if len(zones)!=1:
              raise RuntimeError("Production zone not uniquely identified")
          zone=zones[0]["id"]
          # Bind only an unused dedicated hostname; preserve all existing portal DNS.
          host="foto.flamboyan4.web.id"
          domain_path="/accounts/"+account+"/workers/domains"
          same=[d for d in call(domain_path+"?hostname="+host) if d.get("hostname")==host]
          if any(d.get("service")!=worker or d.get("enabled") is not True for d in same):
              raise RuntimeError("Existing dedicated domain conflicts; no changes")
          def read(host):
              req=urllib.request.Request("https://"+host+"/s/vzud-FqI",headers={"User-Agent":"F4-Share-Route-Smoke/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=15) as res:
                  page=res.read(200000).decode("utf-8")
                  if res.geturl()!="https://"+host+"/s/vzud-FqI":
                      raise RuntimeError("Unexpected redirect on "+host)
              if 'property="og:title"' not in page or 'property="og:image"' not in page or '/dokumentasi/?' not in unescape(page):
                  raise RuntimeError("Share metadata or photo destination missing on "+host)
              return page
          read("api.flamboyan4.web.id")
          if not same:
              dns=call("/zones/"+zone+"/dns_records?name="+host)
              if any(d.get("name")==host for d in dns):
                  raise RuntimeError("Dedicated hostname already has a DNS record; no changes")
              result=call(domain_path,"PUT",{"hostname":host,"service":worker,"zone_id":zone,"enabled":True,"previews_enabled":False})
              if result.get("hostname")!=host or result.get("service")!=worker:
                  raise RuntimeError("Unexpected custom domain result")
              print("DEDICATED_DOMAIN_ATTACHED")
          else:
              print("DEDICATED_DOMAIN_ALREADY_ATTACHED")
          import time
          for attempt in range(5):
              try:
                  page=read(host)
                  image_url=re.search(r'property="og:image" content="([^"]+)"',page).group(1)
                  if image_url!="https://"+host+"/s/vzud-FqI/image":
                      raise RuntimeError("Expected photo-specific preview image URL")
                  req=urllib.request.Request(image_url,headers={"User-Agent":"F4-Share-Route-Smoke/1.0"})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      if not response.headers.get_content_type().startswith("image/") or not response.read(32):
                          raise RuntimeError("Photo preview image unavailable")
                  print("DEDICATED_SHARE_METADATA_AND_IMAGE_OK")
                  break
              except Exception as e:
                  if attempt==4:raise
                  print("Awaiting dedicated DNS/TLS readiness: "+type(e).__name__)
                  time.sleep(4)
          PY
