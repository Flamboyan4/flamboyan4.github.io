name: F4 Shared JPG Transaction Receipt Regression
on:
  push:
    branches: [main]
    paths:
      - portal-live/transaction-receipts.js
      - pembukuan/index.html
      - bank-sampah/index.html
      - qa/verify-transaction-receipts.cjs
      - .github/workflows/f4-transaction-receipts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify receipt code, statuses, scope and Canvas JPG rendering
        run: |
          node --check portal-live/transaction-receipts.js
          node qa/verify-transaction-receipts.cjs
